<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smartfits Leave Login</title>
  <link rel="icon" href="/images/smartfitsfavicon" />
  <link rel="stylesheet" href="./assets/css/holidaymanagement.css?v=236" />
</head>
<body class="auth-page">
  <a class="back-to-modules back-to-modules-floating" href="https://smartcoretechnology.co.uk/modules/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    Back to Modules
  </a>

  <div class="page-shell auth-shell">
    <div class="auth-card glass-card">
      <img src="/images/smartfitslogo.png" alt="Smartfits Installations Ltd" class="auth-logo" />
      <h1>Holiday Management</h1>
      <p class="muted">Sign in to manage annual leave, sick leave, and other leave.</p>

      <form id="loginForm" class="form-stack">
        <div class="field">
          <label for="email"> Personal Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <div id="loginMessage" class="form-message"></div>
    </div>
  </div>

  <script type="module" src="./assets/js/login.js"></script>
</body>
</html>
