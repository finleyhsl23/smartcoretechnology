<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Nova — SmartCore AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/systems/nova/nova.css"/>
</head>
<body>

<div class="nova-shell">

  <!-- Topbar -->
  <div class="nova-topbar">
    <div class="topbar-left">
      <div class="nova-orb" id="novaOrb"></div>
      <span class="nova-wordmark">NOVA</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="ttsBtn" title="Toggle voice">🔊</button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">☀️</button>
      <button class="icon-btn" id="logoutBtn" title="Sign out">⎋</button>
    </div>
  </div>

  <!-- Chat -->
  <div class="nova-chat" id="novaChat">
    <div class="nova-greeting" id="novaGreeting">
      <div class="greeting-orb" id="greetingOrb"></div>
      <h1 id="greetingText">Good evening</h1>
      <p id="greetingSub">How can I help you today?</p>
    </div>
  </div>

  <!-- Voice transcript -->
  <div class="voice-bar" id="voiceBar">
    <span class="voice-bar-mic">🎙️</span>
    <span id="transcriptText">Listening…</span>
  </div>

  <!-- Input -->
  <div class="nova-input-wrap">
    <div class="nova-input-inner">
      <button class="mic-btn" id="micBtn" title="Voice input">🎙️</button>
      <textarea
        class="nova-textarea"
        id="novaTextarea"
        placeholder="Ask Nova anything…"
        rows="1"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button class="send-btn" id="sendBtn" title="Send" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

</div>

<div id="toastwrap"></div>

<script type="module" src="/systems/nova/nova.js"></script>
</body>
</html>
