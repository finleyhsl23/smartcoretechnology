<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nova — Connecting…</title>
  <style>
    body { margin:0; background:#05081a; display:flex; align-items:center; justify-content:center; height:100vh; font-family:Inter,sans-serif; color:#e9f0ff; }
    .msg { text-align:center; }
    .orb { width:48px; height:48px; border-radius:50%; background:radial-gradient(circle at 38% 32%,#4a80ff,#1e5cff 45%,#0a1a6e); box-shadow:0 0 32px rgba(30,92,255,0.5); margin:0 auto 16px; animation:pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
    p { font-size:14px; color:rgba(233,240,255,0.5); }
  </style>
</head>
<body>
  <div class="msg">
    <div class="orb"></div>
    <p>Connecting — this window will close…</p>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code  = params.get('code');
    const state = params.get('state');
    const error = params.get('error');
    if (window.opener) {
      try {
        window.opener.postMessage(
          { type: 'nova_oauth_callback', code, state, error },
          window.location.origin
        );
      } catch(e) {}
      setTimeout(() => window.close(), 800);
    } else {
      document.querySelector('p').textContent = 'Done — you can close this window.';
    }
  </script>
</body>
</html>
