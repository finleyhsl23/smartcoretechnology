<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ID Cards — SmartCore Presence &amp; Fire Safety</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Matches the same link in settings.html#badges — extra font choices the
       ID card editor offers, needed here too so cards print/download with
       the fonts actually loaded rather than falling back to a default. -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/systems/presence-fire-safety/shared/presence-fire-safety.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="/systems/presence-fire-safety/shared/jspdf-lib.js"></script>
</head>
<body>
<div class="pfs-shell">
  <nav class="pfs-sidebar" id="pfsNav" aria-label="Main navigation"></nav>
  <div id="sidebarOverlay"></div>

  <div class="pfs-main">
    <div class="pfs-topbar">
      <button class="hamburger icon-btn" id="hamburger" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <h1>ID Cards</h1>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>

    <div class="pfs-content" id="content">
      <div id="offlineArea"></div>
      <div id="pageBody"></div>
    </div>
  </div>
</div>
<div id="toastwrap" aria-live="polite"></div>
<div id="printArea"></div>

<style>
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .idc-picker-card { display:flex; flex-direction:column; gap:14px; margin-bottom:20px; }
  .idc-page-preview-label { font-size:12px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .idc-empty-hint { color:var(--text3); font-size:13px; padding:24px; text-align:center; }

  /* ── Card-created / send-to-print modal ─────────────────────────────── */
  .idc-modal-preview { display:flex; flex-direction:column; gap:18px; max-width:280px; margin:0 auto; }
  .idc-send-emp-list { max-height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:12px; padding:6px; margin-top:10px; }
  .idc-send-emp-row { display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; }
  .idc-send-emp-row:hover { background:var(--card2); }
  .idc-send-emp-row input { width:16px; height:16px; }
  .idc-send-summary { margin-top:14px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card2); font-size:13.5px; }
  .idc-send-summary strong { font-size:16px; }
  .idc-choice-row { display:flex; flex-direction:column; gap:10px; }
  .idc-choice-btn { display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--card2); text-align:left; width:100%; }
  .idc-choice-btn:hover { border-color:var(--accent); }
  .idc-choice-btn i { width:22px; height:22px; color:var(--accent2); flex-shrink:0; }
  .idc-choice-btn strong { display:block; font-size:14px; }
  .idc-choice-btn span { font-size:12.5px; color:var(--text3); }
  .idc-section-header { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:28px; margin-bottom:16px; }
  .idc-section-header h2 { margin:0; }
  .idc-row-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .idc-badge-search { max-width:360px; margin-bottom:16px; }
  .set-token { font-family: ui-monospace, monospace; font-size: 12px; }
  .idc-token-cell { display:flex; align-items:center; gap:6px; }
  .idc-token-value { min-width:11ch; }
  .icon-btn-sm { width:28px; height:28px; border-radius:8px; }
  .icon-btn-sm i { width:15px; height:15px; }

  @media screen { #printArea { display:none !important; } }
  @media print {
    body * { visibility:hidden; }
    #printArea, #printArea * { visibility:visible; }
    #printArea { display:block !important; position:absolute; top:0; left:0; }
    .pfs-idcard-print-face { page-break-inside: avoid; margin-bottom: 4mm; }
    /* Without this, browsers drop background colors/images by default when
       printing (unless the user manually ticks "Print backgrounds" in the
       print dialog) — the card's background, decorative shapes, and photo
       circle all use background-color, so the printed card came out looking
       like a near-blank white rectangle instead of matching the on-screen
       preview. This forces them to print regardless of that setting. */
    #printArea, #printArea * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
  }
</style>

<script type="module">
  import { requirePresenceModuleAccess, hasPermission } from "/systems/presence-fire-safety/shared/auth.js";
  import { employees, settings, badges, cardOrders } from "/systems/presence-fire-safety/shared/api.js";
  import { renderNav, initMobileNav, initTopbar } from "/systems/presence-fire-safety/shared/nav.js";
  import { initTheme } from "/systems/presence-fire-safety/shared/theme.js";
  import { enforceKioskGuard, initKioskToggle } from "/systems/presence-fire-safety/shared/kiosk.js";
  import { initSoundFromSettings } from "/systems/presence-fire-safety/shared/sound.js";
  import { renderCardFace, normalizeTemplate, generateQrDataUrl, renderCardImagePair, ensureCardFontsLoaded } from "/systems/presence-fire-safety/shared/id-card-render.js";
  import { downloadCardsPdf } from "/systems/presence-fire-safety/shared/id-card-pdf.js";
  import {
    esc, initials, toast, fmtDateTime, confirmDialog, modal,
    loadingState, emptyState, errorState, permissionDeniedState, moduleDisabledState,
    offlineBanner, setInner, refreshIcons,
  } from "/systems/presence-fire-safety/shared/ui.js";

  initTheme();

  // The Cloudflare Function returns env.STRIPE_PUBLISHABLE_KEY, but that env
  // var isn't actually set for this project (shop/payment.html's checkout
  // hits the same gap and works around it the same way) — publishable keys
  // aren't secret, so hardcoding it here matches that existing pattern.
  const STRIPE_PUBLISHABLE_KEY = "pk_live_51TpUiW4IMhuU6xC03tq0ac7TIz7DpfXo9kzeEjsrOuGyn2jJV5tkYUmuEmeikP3w0yb8enbAfiS67tSJaSX31Z4y00yZiX446d";

  let _profile = null, _companyId = null;
  let _template = null, _logoUrl = null;
  let _selectedEmployee = null; // { id, name }
  let _employeeData = null;     // full row from employees.forIdCard
  let _activeBadge = null;      // current badge row, or null
  let _searchTimer = null;
  let _allBadges = [];          // all active badges, unfiltered
  let _badgeSearchTerm = "";
  const _revealedTokens = new Set(); // badge ids currently shown unmasked

  try {
    const { profile } = await requirePresenceModuleAccess();
    if (enforceKioskGuard("id-cards")) throw new Error("__kiosk_redirect__");
    _profile = profile;
    _companyId = profile.company_id;

    renderNav("id-cards", profile);
    initMobileNav();
    initTopbar();
    initKioskToggle({ companyId: _companyId, currentPage: "id-cards" });
    wireOfflineBanner();
    initSoundFromSettings(_companyId);

    if (!hasPermission("presence.manage_badges")) {
      setInner("pageBody", permissionDeniedState("You don't have permission to manage ID cards."));
    } else {
      const row = await settings.get(_companyId);
      _template = normalizeTemplate(row?.id_card_template);
      _logoUrl = row?.id_card_logo_url || null;
      renderShell();
      loadAllBadges();
    }
  } catch (e) {
    if (e.message !== "__kiosk_redirect__") renderAccessBlocked(e);
  }

  function wireOfflineBanner() {
    const render = () => setInner("offlineArea", navigator.onLine ? "" : offlineBanner());
    render();
    window.addEventListener("online", render);
    window.addEventListener("offline", render);
  }

  // ── Shell ────────────────────────────────────────────────────────────────
  function renderShell() {
    setInner("pageBody", `
      <div class="card idc-picker-card">
        <h2 class="set-section-title" style="margin:0">Print an ID Card</h2>
        <p class="set-section-desc" style="margin:0">Search for an employee to preview and print their card. The back shows their QR sign-in badge.</p>
        <div class="set-search-combo">
          <input type="text" id="empSearch" class="form-input" placeholder="Search employees by name or ID…" autocomplete="off"/>
          <div class="set-search-results" id="empResults" hidden></div>
        </div>
        <div id="empSelectedChip"></div>
      </div>

      <div class="idc-section-header">
        <h2 class="set-section-title">Active QR badges</h2>
        <button class="btn" id="exportAllBtn" type="button"><i data-lucide="download"></i> Export All (PDF)</button>
      </div>
      <input type="text" id="badgeSearch" class="form-input idc-badge-search" placeholder="Search badges by name or employee ID…" autocomplete="off" value="${esc(_badgeSearchTerm)}"/>
      <div id="allBadgesArea"></div>
    `);
    refreshIcons();
    document.getElementById("exportAllBtn").addEventListener("click", (e) => downloadAllCardsPdf(e.currentTarget));
    document.getElementById("badgeSearch").addEventListener("input", (e) => {
      _badgeSearchTerm = e.target.value;
      renderAllBadges(filterBadges());
    });

    const searchInput = document.getElementById("empSearch");
    const resultsBox = document.getElementById("empResults");
    let searchResults = [];
    let activeIndex = -1;

    function renderResults() {
      resultsBox.innerHTML = searchResults.length
        ? searchResults.map((r, i) => `
          <button type="button" class="set-search-result${i === activeIndex ? " active" : ""}" data-idx="${i}">
            <div class="avatar avatar-sm">${esc(initials(r.full_name))}</div>
            <div>
              <div class="set-search-result-name">${esc(r.full_name)}</div>
              <div class="set-search-result-meta">${esc([r.job_title, r.employee_id].filter(Boolean).join(" · "))}</div>
            </div>
          </button>`).join("")
        : `<div class="set-search-result-empty">No employees found</div>`;
      resultsBox.hidden = false;
      resultsBox.querySelectorAll("[data-idx]").forEach(el => {
        el.addEventListener("mouseenter", () => { activeIndex = Number(el.dataset.idx); highlightActive(); });
        el.addEventListener("click", () => selectResult(Number(el.dataset.idx)));
      });
    }

    function highlightActive() {
      resultsBox.querySelectorAll("[data-idx]").forEach(el => el.classList.toggle("active", Number(el.dataset.idx) === activeIndex));
      resultsBox.querySelector(".set-search-result.active")?.scrollIntoView({ block: "nearest" });
    }

    function selectResult(i) {
      const r = searchResults[i];
      if (!r) return;
      _selectedEmployee = { id: r.id, name: r.full_name };
      document.getElementById("empSelectedChip").innerHTML = `<span class="set-selected-chip">${esc(r.full_name)} <button type="button" id="clearEmpChip" aria-label="Clear">✕</button></span>`;
      document.getElementById("clearEmpChip").addEventListener("click", () => {
        _selectedEmployee = null; _employeeData = null; _activeBadge = null;
        document.getElementById("empSelectedChip").innerHTML = "";
      });
      resultsBox.hidden = true;
      searchInput.value = "";
      searchResults = []; activeIndex = -1;
      loadSelectedEmployee();
    }

    searchInput.addEventListener("input", () => {
      clearTimeout(_searchTimer);
      const q = searchInput.value.trim();
      if (!q) { resultsBox.hidden = true; resultsBox.innerHTML = ""; searchResults = []; activeIndex = -1; return; }
      _searchTimer = setTimeout(async () => {
        try {
          searchResults = await employees.search(_companyId, q, { limit: 8 });
          activeIndex = -1;
          renderResults();
        } catch (e) {
          resultsBox.innerHTML = `<div class="set-search-result-empty">${esc(e.message)}</div>`;
          resultsBox.hidden = false;
        }
      }, 250);
    });

    searchInput.addEventListener("keydown", (e) => {
      if (resultsBox.hidden || !searchResults.length) return;
      if (e.key === "ArrowDown") { e.preventDefault(); activeIndex = Math.min(activeIndex + 1, searchResults.length - 1); highlightActive(); }
      else if (e.key === "ArrowUp") { e.preventDefault(); activeIndex = Math.max(activeIndex - 1, 0); highlightActive(); }
      else if (e.key === "Enter") { e.preventDefault(); selectResult(activeIndex >= 0 ? activeIndex : 0); }
      else if (e.key === "Escape") { resultsBox.hidden = true; }
    });

    document.addEventListener("click", (e) => { if (!e.target.closest(".set-search-combo")) resultsBox.hidden = true; });
  }

  // ── Selected employee → card-created modal ──────────────────────────────
  async function loadSelectedEmployee() {
    toast("info", "Creating ID card…", `Looking up ${_selectedEmployee.name}.`);
    try {
      const [emp, badge] = await Promise.all([
        employees.forIdCard(_companyId, _selectedEmployee.id),
        badges.forEmployee(_selectedEmployee.id),
      ]);
      _employeeData = emp;
      _activeBadge = badge;
      // A card with a blank back (no QR) isn't useful to print — issue one
      // automatically rather than making the admin do it as a separate step.
      // Non-fatal if it fails (e.g. a race with someone else issuing one at
      // the same moment): the modal below just shows a warning instead.
      if (!_activeBadge) {
        try {
          _activeBadge = await badges.issue(_companyId, _selectedEmployee.id);
          loadAllBadges();
        } catch (issueErr) {
          console.error("Auto-issue badge failed:", issueErr);
        }
      }
      openCardCreatedModal();
    } catch (e) {
      toast("error", "Couldn't load employee", e.message || "Please try again.");
    }
  }

  // ── Step 1: "ID card created for {name}" + front/back preview ──────────
  function openCardCreatedModal() {
    const overlay = modal(`
      <div class="modal-header"><h3></h3></div>
      <div class="modal-body" id="cardModalBody"></div>
      <div class="modal-footer" id="cardModalFooter"></div>
    `, { size: "" });
    renderCardModalStep1(overlay);
    return overlay;
  }

  function renderCardModalStep1(overlay) {
    const qr = _activeBadge ? generateQrDataUrl(_activeBadge.badge_token) : null;
    const ctx = { employee: _employeeData, logoUrl: _logoUrl, qrDataUrl: qr };
    overlay.querySelector(".modal-header h3").textContent = `ID card created for ${_employeeData.full_name}`;
    overlay.querySelector("#cardModalBody").innerHTML = `
      <div class="idc-modal-preview">
        <div>
          <div class="idc-page-preview-label">Front</div>
          <div id="cardPreviewFront">${renderCardFace(_template, "front", ctx)}</div>
        </div>
        <div>
          <div class="idc-page-preview-label">Back</div>
          <div id="cardPreviewBack">${renderCardFace(_template, "back", ctx)}</div>
        </div>
      </div>
      ${!_activeBadge ? `<p class="form-error" style="margin-top:14px">Couldn't automatically issue a QR badge — the card back will be blank until one is issued from the badges table below.</p>` : ""}
    `;
    // First paint can land before the card's webfont has loaded, sizing
    // shrink-to-fit text for a fallback font that's narrower than the real
    // one — re-render once fonts are confirmed ready so it doesn't stay
    // stuck looking (and truncating) as if it never fit.
    ensureCardFontsLoaded(_template).then(() => {
      const front = overlay.querySelector("#cardPreviewFront");
      const back = overlay.querySelector("#cardPreviewBack");
      if (front) front.innerHTML = renderCardFace(_template, "front", ctx);
      if (back) back.innerHTML = renderCardFace(_template, "back", ctx);
    });
    overlay.querySelector("#cardModalFooter").innerHTML = `
      <button class="btn modal-close" type="button">Close</button>
      <button class="btn btn-primary" id="cardModalContinueBtn" type="button">Continue →</button>
    `;
    overlay.querySelector(".modal-close").addEventListener("click", () => overlay.remove());
    overlay.querySelector("#cardModalContinueBtn").addEventListener("click", () => renderCardModalStep2(overlay, qr));
  }

  // ── Step 2: Print it myself, or send to SmartCore ───────────────────────
  function renderCardModalStep2(overlay, qr) {
    overlay.querySelector(".modal-header h3").textContent = "Print this card";
    overlay.querySelector("#cardModalBody").innerHTML = `
      <div class="idc-choice-row">
        <button class="idc-choice-btn" id="choicePrintBtn" type="button">
          <i data-lucide="printer"></i>
          <div><strong>Print it myself</strong><span>Use a local printer right now</span></div>
        </button>
        <button class="idc-choice-btn" id="choiceDownloadBtn" type="button">
          <i data-lucide="download"></i>
          <div><strong>Download as PDF</strong><span>Front &amp; back, sized to print at 100%</span></div>
        </button>
        <button class="idc-choice-btn" id="choiceSendBtn" type="button">
          <i data-lucide="truck"></i>
          <div><strong>Send to SmartCore to print</strong><span>Real PVC cards, printed and posted to you — from £20</span></div>
        </button>
      </div>
    `;
    overlay.querySelector("#cardModalFooter").innerHTML = `<button class="btn" id="cardModalBackBtn" type="button">← Back</button>`;
    refreshIcons();
    overlay.querySelector("#cardModalBackBtn").addEventListener("click", () => renderCardModalStep1(overlay));
    overlay.querySelector("#choicePrintBtn").addEventListener("click", () => { overlay.remove(); printCard(qr); });
    overlay.querySelector("#choiceDownloadBtn").addEventListener("click", (e) => downloadSingleCardPdf(overlay, e.currentTarget));
    overlay.querySelector("#choiceSendBtn").addEventListener("click", () => openSendToPrintFlow(overlay));
  }

  // ── PDF downloads ────────────────────────────────────────────────────────
  async function downloadSingleCardPdf(overlay, btn) {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.querySelector("strong").textContent = "Preparing…";
    try {
      const qr = _activeBadge ? generateQrDataUrl(_activeBadge.badge_token) : null;
      const ctx = { employee: _employeeData, logoUrl: _logoUrl, qrDataUrl: qr };
      const { front, back } = await renderCardImagePair(_template, ctx);
      downloadCardsPdf(
        [{ front, back, label: _employeeData.full_name }],
        _template?.orientation,
        `${safeFilename(_employeeData.full_name)}-ID-Card.pdf`
      );
      overlay.remove();
    } catch (e) {
      toast("error", "Couldn't build PDF", e.message || "Please try again.");
      btn.disabled = false;
      btn.innerHTML = original;
      refreshIcons();
    }
  }

  async function viewBadgeRowCard(employeeId, btn) {
    btn.disabled = true;
    try {
      const [emp, badge] = await Promise.all([
        employees.forIdCard(_companyId, employeeId),
        badges.forEmployee(employeeId),
      ]);
      if (!emp) throw new Error("Employee not found");
      const qr = badge ? generateQrDataUrl(badge.badge_token) : null;
      const ctx = { employee: emp, logoUrl: _logoUrl, qrDataUrl: qr };
      const overlay = modal(`
        <div class="modal-header"><h3>${esc(emp.full_name)}</h3></div>
        <div class="modal-body">
          <div class="idc-modal-preview">
            <div>
              <div class="idc-page-preview-label">Front</div>
              <div id="cardViewFront">${renderCardFace(_template, "front", ctx)}</div>
            </div>
            <div>
              <div class="idc-page-preview-label">Back</div>
              <div id="cardViewBack">${renderCardFace(_template, "back", ctx)}</div>
            </div>
          </div>
        </div>
        <div class="modal-footer"><button class="btn modal-close" type="button">Close</button></div>
      `, { size: "" });
      overlay.querySelector(".modal-close").addEventListener("click", () => overlay.remove());
      // First paint can land before the card's webfont has loaded — see
      // ensureCardFontsLoaded's own doc comment — so re-render once it's
      // confirmed ready rather than leaving the preview stuck sized for a
      // fallback font.
      ensureCardFontsLoaded(_template).then(() => {
        const front = overlay.querySelector("#cardViewFront");
        const back = overlay.querySelector("#cardViewBack");
        if (front) front.innerHTML = renderCardFace(_template, "front", ctx);
        if (back) back.innerHTML = renderCardFace(_template, "back", ctx);
      });
    } catch (e) {
      toast("error", "Couldn't preview card", e.message || "Please try again.");
    } finally {
      btn.disabled = false;
    }
  }

  async function downloadBadgeRowPdf(employeeId, btn) {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Preparing…";
    try {
      const [emp, badge] = await Promise.all([
        employees.forIdCard(_companyId, employeeId),
        badges.forEmployee(employeeId),
      ]);
      if (!emp) throw new Error("Employee not found");
      const qr = badge ? generateQrDataUrl(badge.badge_token) : null;
      const ctx = { employee: emp, logoUrl: _logoUrl, qrDataUrl: qr };
      const { front, back } = await renderCardImagePair(_template, ctx);
      downloadCardsPdf([{ front, back, label: emp.full_name }], _template?.orientation, `${safeFilename(emp.full_name)}-ID-Card.pdf`);
    } catch (e) {
      toast("error", "Couldn't build PDF", e.message || "Please try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function downloadAllCardsPdf(btn) {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = "Loading employees…";
    try {
      const activeBadgeList = await badges.list(_companyId, { status: "active" });
      if (!activeBadgeList.length) {
        toast("info", "Nothing to export", "There are no active QR badges yet.");
        return;
      }
      const badgeByEmpId = Object.fromEntries(activeBadgeList.map((b) => [b.employee_id, b]));
      const empRows = await employees.forIdCardBulk(_companyId, activeBadgeList.map((b) => b.employee_id));

      const cards = [];
      for (let i = 0; i < empRows.length; i++) {
        const emp = empRows[i];
        btn.textContent = `Preparing ${i + 1} of ${empRows.length}…`;
        const badge = badgeByEmpId[emp.id];
        const qr = badge ? generateQrDataUrl(badge.badge_token) : null;
        const ctx = { employee: emp, logoUrl: _logoUrl, qrDataUrl: qr };
        const { front, back } = await renderCardImagePair(_template, ctx);
        cards.push({ front, back, label: emp.full_name });
      }
      const dateStr = new Date().toISOString().slice(0, 10);
      downloadCardsPdf(cards, _template?.orientation, `ID-Cards-${dateStr}.pdf`);
    } catch (e) {
      toast("error", "Couldn't build PDF", e.message || "Please try again.");
    } finally {
      btn.disabled = false;
      btn.innerHTML = original;
      refreshIcons();
    }
  }

  function safeFilename(name) {
    return String(name || "employee").trim().replace(/[^a-z0-9]+/gi, "-").replace(/^-+|-+$/g, "") || "employee";
  }

  // ── "Send to SmartCore to print" sub-flow ───────────────────────────────
  async function openSendToPrintFlow(overlay) {
    overlay.querySelector(".modal-header h3").textContent = "Send to SmartCore to Print";
    overlay.querySelector("#cardModalBody").innerHTML = loadingState("Loading employees with active badges…");
    overlay.querySelector("#cardModalFooter").innerHTML = "";
    let activeBadgeList;
    try {
      activeBadgeList = await badges.list(_companyId, { status: "active" });
    } catch (e) {
      overlay.querySelector("#cardModalBody").innerHTML = errorState({ title: "Couldn't load employees", message: e.message });
      return;
    }
    const selected = new Set([_selectedEmployee.id]);
    renderSelectEmployeesStep(overlay, activeBadgeList, selected);
  }

  function renderSelectEmployeesStep(overlay, activeBadgeList, selected) {
    const priceFor = (qty) => Math.max(qty * 4, 20);
    const summaryHtml = () => {
      const qty = selected.size;
      const total = priceFor(qty);
      return `<div class="idc-send-summary"><strong>£${total.toFixed(2)}</strong> for ${qty} card${qty === 1 ? "" : "s"}${qty * 4 < 20 ? " (£20 minimum order)" : ""} — £4 per card</div>`;
    };
    overlay.querySelector("#cardModalBody").innerHTML = `
      <p class="text-muted" style="margin-top:0">Choose which employees to print cards for.</p>
      <div class="idc-send-emp-list">
        ${activeBadgeList.map(b => `
          <label class="idc-send-emp-row">
            <input type="checkbox" data-emp-id="${esc(b.employee_id)}" ${selected.has(b.employee_id) ? "checked" : ""}/>
            <div class="avatar avatar-sm">${esc(initials(b.core_employees?.full_name))}</div>
            <div>${esc(b.core_employees?.full_name || "—")} ${b.core_employees?.employee_id ? `<span class="text-muted">(${esc(b.core_employees.employee_id)})</span>` : ""}</div>
          </label>`).join("")}
      </div>
      <div id="sendEmpSummary">${summaryHtml()}</div>
    `;
    overlay.querySelector("#cardModalFooter").innerHTML = `
      <button class="btn" id="sendBackBtn" type="button">← Back</button>
      <button class="btn btn-primary" id="sendNextBtn" type="button">Continue →</button>
    `;
    overlay.querySelectorAll("[data-emp-id]").forEach(cb => {
      cb.addEventListener("change", () => {
        if (cb.checked) selected.add(cb.dataset.empId); else selected.delete(cb.dataset.empId);
        document.getElementById("sendEmpSummary").innerHTML = summaryHtml();
        document.getElementById("sendNextBtn").disabled = selected.size === 0;
      });
    });
    overlay.querySelector("#sendBackBtn").addEventListener("click", () => renderCardModalStep2(overlay, _activeBadge ? generateQrDataUrl(_activeBadge.badge_token) : null));
    overlay.querySelector("#sendNextBtn").addEventListener("click", () => renderShippingStep(overlay, activeBadgeList, selected));
  }

  function renderShippingStep(overlay, activeBadgeList, selected) {
    overlay.querySelector(".modal-header h3").textContent = "Shipping address";
    overlay.querySelector("#cardModalBody").innerHTML = `
      <div class="set-field-grid">
        <label class="set-field"><span class="form-label">Recipient name *</span><input class="form-input" id="shipName"/></label>
        <label class="set-field"><span class="form-label">Phone</span><input class="form-input" id="shipPhone" type="tel"/></label>
      </div>
      <label class="set-field" style="margin-bottom:14px"><span class="form-label">Address line 1 *</span><input class="form-input" id="shipAddr1"/></label>
      <label class="set-field" style="margin-bottom:14px"><span class="form-label">Address line 2</span><input class="form-input" id="shipAddr2"/></label>
      <div class="set-field-grid">
        <label class="set-field"><span class="form-label">City *</span><input class="form-input" id="shipCity"/></label>
        <label class="set-field"><span class="form-label">County</span><input class="form-input" id="shipCounty"/></label>
        <label class="set-field"><span class="form-label">Postcode *</span><input class="form-input" id="shipPostcode"/></label>
      </div>
      <label class="set-field"><span class="form-label">Country</span><input class="form-input" id="shipCountry" value="United Kingdom"/></label>
      <div class="form-error" id="shipError" role="alert" style="margin-top:10px"></div>
    `;
    overlay.querySelector("#cardModalFooter").innerHTML = `
      <button class="btn" id="shipBackBtn" type="button">← Back</button>
      <button class="btn btn-primary" id="shipNextBtn" type="button">Continue to payment →</button>
    `;
    overlay.querySelector("#shipBackBtn").addEventListener("click", () => renderSelectEmployeesStep(overlay, activeBadgeList, selected));
    overlay.querySelector("#shipNextBtn").addEventListener("click", () => {
      const name = overlay.querySelector("#shipName").value.trim();
      const addr1 = overlay.querySelector("#shipAddr1").value.trim();
      const city = overlay.querySelector("#shipCity").value.trim();
      const postcode = overlay.querySelector("#shipPostcode").value.trim();
      const errEl = overlay.querySelector("#shipError");
      if (!name || !addr1 || !city || !postcode) { errEl.textContent = "Name, address line 1, city, and postcode are required."; return; }
      errEl.textContent = "";
      const shipping = {
        name, phone: overlay.querySelector("#shipPhone").value.trim() || null,
        address_line1: addr1, address_line2: overlay.querySelector("#shipAddr2").value.trim() || null,
        city, county: overlay.querySelector("#shipCounty").value.trim() || null,
        postcode, country: overlay.querySelector("#shipCountry").value.trim() || "United Kingdom",
      };
      renderPaymentStep(overlay, activeBadgeList, selected, shipping);
    });
  }

  async function renderPaymentStep(overlay, activeBadgeList, selected, shipping) {
    overlay.querySelector(".modal-header h3").textContent = "Payment";
    overlay.querySelector("#cardModalBody").innerHTML = loadingState("Preparing card designs…");
    overlay.querySelector("#cardModalFooter").innerHTML = "";

    const selectedIds = [...selected];
    const badgeByEmpId = Object.fromEntries(activeBadgeList.map(b => [b.employee_id, b]));

    let empRows;
    try {
      empRows = await employees.forIdCardBulk(_companyId, selectedIds);
    } catch (e) {
      overlay.querySelector("#cardModalBody").innerHTML = errorState({ title: "Couldn't load employees", message: e.message });
      return;
    }

    const employeeImages = [];
    try {
      for (const emp of empRows) {
        const badge = badgeByEmpId[emp.id];
        const qr = badge ? generateQrDataUrl(badge.badge_token) : null;
        const cardCtx = { employee: emp, logoUrl: _logoUrl, qrDataUrl: qr };
        const { front, back } = await renderCardImagePair(_template, cardCtx);
        employeeImages.push({ employee_id: emp.id, front, back });
      }
    } catch (e) {
      overlay.querySelector("#cardModalBody").innerHTML = errorState({ title: "Couldn't prepare card designs", message: e.message });
      return;
    }

    const quantity = employeeImages.length;
    const amountPence = Math.max(quantity * 400, 2000);

    overlay.querySelector("#cardModalBody").innerHTML = loadingState("Setting up payment…");

    let orderData;
    try {
      orderData = await cardOrders.create(_companyId, { employeeImages, shipping });
    } catch (e) {
      overlay.querySelector("#cardModalBody").innerHTML = errorState({ title: "Couldn't create order", message: e.message, retryId: "orderRetry" });
      overlay.querySelector("#orderRetry")?.addEventListener("click", () => renderPaymentStep(overlay, activeBadgeList, selected, shipping));
      return;
    }

    const payLabel = `Pay £${(amountPence / 100).toFixed(2)}`;
    const isDev = new URLSearchParams(location.search).get("dev") === "1";

    overlay.querySelector("#cardModalBody").innerHTML = `
      <p style="margin-top:0"><strong>${quantity}</strong> card${quantity === 1 ? "" : "s"} — <strong>£${(amountPence / 100).toFixed(2)}</strong></p>
      <div id="payment-element"></div>
      <div class="form-error" id="payError" role="alert" style="margin-top:10px"></div>
      ${isDev ? `<button class="btn" id="devBypassBtn" type="button" style="margin-top:14px;width:100%">⚡ Dev bypass — skip payment</button>` : ""}
    `;
    overlay.querySelector("#cardModalFooter").innerHTML = `
      <button class="btn" id="payBackBtn" type="button">← Back</button>
      <button class="btn btn-primary" id="payBtn" type="button">${payLabel}</button>
    `;
    overlay.querySelector("#payBackBtn").addEventListener("click", () => renderShippingStep(overlay, activeBadgeList, selected));

    const stripe = Stripe(orderData.publishable_key || STRIPE_PUBLISHABLE_KEY);
    const elements = stripe.elements({ clientSecret: orderData.client_secret, appearance: { theme: "night" } });
    const paymentEl = elements.create("payment");
    paymentEl.mount("#payment-element");

    overlay.querySelector("#payBtn").addEventListener("click", async () => {
      const btn = overlay.querySelector("#payBtn");
      const errEl = overlay.querySelector("#payError");
      errEl.textContent = "";
      btn.disabled = true;
      btn.textContent = "Processing…";
      const { error } = await stripe.confirmPayment({ elements, redirect: "if_required" });
      if (error) {
        errEl.textContent = error.message || "Payment failed.";
        btn.disabled = false;
        btn.textContent = payLabel;
        return;
      }
      await finalizeAndShowSuccess(overlay, orderData.order_id, quantity, amountPence);
    });

    overlay.querySelector("#devBypassBtn")?.addEventListener("click", async () => {
      overlay.querySelector("#cardModalBody").innerHTML = loadingState("Bypassing payment…");
      overlay.querySelector("#cardModalFooter").innerHTML = "";
      await finalizeAndShowSuccess(overlay, orderData.order_id, quantity, amountPence, true);
    });
  }

  async function finalizeAndShowSuccess(overlay, orderId, quantity, amountPence, devBypass = false) {
    overlay.querySelector("#cardModalBody").innerHTML = loadingState("Confirming order…");
    overlay.querySelector("#cardModalFooter").innerHTML = "";
    try {
      await cardOrders.finalize(orderId, { devBypass });
      overlay.querySelector(".modal-header h3").textContent = "Order sent to SmartCore";
      overlay.querySelector("#cardModalBody").innerHTML = `
        <div class="kiosk-identity" style="margin:0">
          <div class="success-icon"><i data-lucide="check-circle-2"></i></div>
          <h2 style="margin-top:10px">${quantity} card${quantity === 1 ? "" : "s"} ordered</h2>
          <p>£${(amountPence / 100).toFixed(2)} paid. SmartCore will print and post them to the address you provided.</p>
        </div>`;
      overlay.querySelector("#cardModalFooter").innerHTML = `<button class="btn btn-primary modal-close" type="button">Done</button>`;
      overlay.querySelector(".modal-close").addEventListener("click", () => overlay.remove());
      refreshIcons();
    } catch (e) {
      overlay.querySelector("#cardModalBody").innerHTML = errorState({
        title: "Payment received, but couldn't confirm the order",
        message: `${e.message || "Please try again."} If this keeps happening, contact support@smartcoretechnology.co.uk with your payment reference.`,
      });
    }
  }

  async function printCard(qr) {
    const orientation = _template?.orientation === "portrait" ? "portrait" : "landscape";
    const w = orientation === "portrait" ? "54mm" : "85.6mm";
    const h = orientation === "portrait" ? "85.6mm" : "54mm";
    const ctx = { employee: _employeeData, logoUrl: _logoUrl, qrDataUrl: qr };
    const faces = () => `
      <div class="pfs-idcard-print-face" style="width:${w};height:${h}">${renderCardFace(_template, "front", ctx)}</div>
      <div class="pfs-idcard-print-face" style="width:${w};height:${h}">${renderCardFace(_template, "back", ctx)}</div>
    `;
    setInner("printArea", faces());
    // Text/statictext shrink-to-fit measures against whatever font is
    // available *right now* — the very first render can land before the
    // card's webfont has actually loaded, sizing it for text that then
    // overflows and gets cut off by CSS ellipsis once the real font shows
    // up. Re-render once fonts are confirmed loaded, before the print
    // dialog snapshots the page (too late to fix it afterwards).
    await ensureCardFontsLoaded(_template);
    setInner("printArea", faces());
    window.print();
  }

  // ── All issued badges overview ──────────────────────────────────────────
  async function loadAllBadges() {
    setInner("allBadgesArea", loadingState("Loading badges…"));
    try {
      _allBadges = await badges.list(_companyId, { status: "active" });
      renderAllBadges(filterBadges());
    } catch (e) {
      setInner("allBadgesArea", errorState({ title: "Couldn't load badges", message: e.message, retryId: "allBadgesRetry" }));
      document.getElementById("allBadgesRetry")?.addEventListener("click", loadAllBadges);
    }
  }

  function filterBadges() {
    const term = _badgeSearchTerm.trim().toLowerCase();
    if (!term) return _allBadges;
    return _allBadges.filter((b) => {
      const name = (b.core_employees?.full_name || "").toLowerCase();
      const code = (b.core_employees?.employee_id || "").toLowerCase();
      return name.includes(term) || code.includes(term);
    });
  }

  function renderAllBadges(list) {
    if (!_allBadges.length) {
      setInner("allBadgesArea", emptyState({ icon: "id-card", title: "No active badges", message: "Badges appear here once issued. Revoked badges are hidden from this list." }));
      return;
    }
    if (!list.length) {
      setInner("allBadgesArea", emptyState({ icon: "search", title: "No matching badges", message: "Try a different name or employee ID." }));
      return;
    }
    setInner("allBadgesArea", `
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr><th>Employee</th><th>Token</th><th>Issued</th><th></th></tr></thead>
          <tbody>
            ${list.map(b => {
              const revealed = _revealedTokens.has(b.id);
              return `
              <tr>
                <td>${esc(b.core_employees?.full_name || "—")} ${b.core_employees?.employee_id ? `<span class="text-muted">(${esc(b.core_employees.employee_id)})</span>` : ""}</td>
                <td class="set-token">
                  <div class="idc-token-cell">
                    <span class="idc-token-value">${revealed ? esc(b.badge_token) : "••••••••••••"}</span>
                    <button class="icon-btn icon-btn-sm" data-toggle-token="${esc(b.id)}" type="button" title="${revealed ? "Hide token" : "View token"}" aria-label="${revealed ? "Hide token" : "View token"}"><i data-lucide="${revealed ? "eye-off" : "eye"}"></i></button>
                    <button class="icon-btn icon-btn-sm" data-copy-token="${esc(b.id)}" type="button" title="Copy token" aria-label="Copy token"><i data-lucide="copy"></i></button>
                  </div>
                </td>
                <td>${esc(fmtDateTime(b.issued_at))}</td>
                <td>
                  <div class="idc-row-actions">
                    <button class="icon-btn" data-view-badge="${esc(b.employee_id)}" type="button" title="View card" aria-label="View card"><i data-lucide="eye"></i></button>
                    <button class="btn" data-download-badge="${esc(b.employee_id)}" type="button">Download</button>
                    <button class="btn btn-danger" data-revoke-badge="${esc(b.id)}" type="button">Revoke</button>
                  </div>
                </td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    `);
    refreshIcons();
    document.querySelectorAll("[data-toggle-token]").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.toggleToken;
        if (_revealedTokens.has(id)) _revealedTokens.delete(id); else _revealedTokens.add(id);
        renderAllBadges(filterBadges());
      });
    });
    document.querySelectorAll("[data-copy-token]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const badge = _allBadges.find((b) => b.id === btn.dataset.copyToken);
        if (!badge) return;
        try {
          await navigator.clipboard.writeText(badge.badge_token);
          toast("success", "Copied", "Badge token copied to clipboard.");
        } catch (e) {
          toast("error", "Couldn't copy", "Please copy the token manually.");
        }
      });
    });
    document.querySelectorAll("[data-view-badge]").forEach(btn => {
      btn.addEventListener("click", () => viewBadgeRowCard(btn.dataset.viewBadge, btn));
    });
    document.querySelectorAll("[data-download-badge]").forEach(btn => {
      btn.addEventListener("click", () => downloadBadgeRowPdf(btn.dataset.downloadBadge, btn));
    });
    document.querySelectorAll("[data-revoke-badge]").forEach(btn => {
      btn.addEventListener("click", () => {
        confirmDialog("Revoke this badge?", "The employee will no longer be able to use it to sign in or out. This cannot be undone.", async () => {
          try {
            await badges.revoke(btn.dataset.revokeBadge);
            toast("success", "Badge revoked");
            if (_activeBadge?.id === btn.dataset.revokeBadge) _activeBadge = null;
            loadAllBadges();
          } catch (e) {
            toast("error", "Couldn't revoke badge", e.message || "Please try again.");
          }
        }, { confirmLabel: "Revoke Badge" });
      });
    });
  }

  // ── Access-blocked rendering (see index.html for rationale) ────────────
  function renderAccessBlocked(e) {
    const msg = e?.message || "";
    document.body.innerHTML = `
      <div class="pfs-shell">
        <div class="pfs-main" style="width:100%">
          <div class="pfs-topbar">
            <h1>ID Cards</h1>
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
            <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><i data-lucide="log-out"></i></button>
          </div>
          <div class="pfs-content" id="content"></div>
        </div>
      </div>
      <div id="toastwrap" aria-live="polite"></div>`;
    initTheme();
    initTopbar();

    let html;
    if (msg.includes("not enabled")) html = moduleDisabledState();
    else if (msg.includes("permission") || msg.includes("No access")) html = permissionDeniedState(msg);
    else if (msg.includes("profile") || msg.includes("session")) html = permissionDeniedState(msg || "Your account isn't set up for this module yet.");
    else html = errorState({ title: "Couldn't load ID Cards", message: msg, retryId: "blockedRetry" });

    setInner("content", html);
    document.getElementById("blockedRetry")?.addEventListener("click", () => window.location.reload());
  }
</script>
