<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Employee Sign In/Out — SmartCore Presence &amp; Fire Safety</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/systems/presence-fire-safety/shared/presence-fire-safety.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="/systems/presence-fire-safety/shared/jsqr-lib.js"></script>
</head>
<body>
<div class="pfs-shell">
  <nav class="pfs-sidebar" id="pfsNav" aria-label="Main navigation"></nav>
  <div id="sidebarOverlay"></div>

  <div class="pfs-main">
    <div class="pfs-topbar">
      <button class="hamburger icon-btn" id="hamburger" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <h1>Employee Sign In/Out</h1>
      <label class="sr-only" for="siteSwitcher">Search sites by name or location</label>
      <div class="pfs-site-search-wrap">
        <input type="text" id="siteSwitcher" class="form-input" placeholder="Search sites…" aria-label="Search sites by name or location" autocomplete="off"/>
        <div class="pfs-site-search-dropdown" style="display:none"></div>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>

    <div class="pfs-content" id="content">
      <div id="offlineArea"></div>
      <div id="kioskEvacBanner"></div>
      <div id="kioskBody"></div>
    </div>
  </div>
</div>
<div id="toastwrap" aria-live="polite"></div>

<style>
  /* This page is a single fixed screen — no page-level scrollbar, content
     centered in whatever space is left below the topbar. */
  html, body { height: 100%; overflow: hidden; }
  .pfs-shell { height: 100vh; }
  .pfs-main { display: flex; flex-direction: column; height: 100vh; }
  .pfs-content { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #kioskBody { flex: 1; min-height: 0; display: flex; }
  #kioskBody > * { margin: auto; width: 100%; }
  /* .pfs-kiosk is positioned by JS (positionKiosk(), see the module script)
     rather than pure CSS centering — it needs to center within whatever
     space is actually free (below the sticky topbar and the evacuation
     banner, above the custom keyboard when open), and clamp so it never
     rises above that safe top edge. Plain viewport-relative centering
     doesn't know the banner is there and can end up overlapping it for
     short content; centering only within #kioskBody's own box (tried
     before this) avoided that but looked visibly high relative to the
     whole screen since the banner only takes space from the top. JS
     measuring both real element heights and clamping is the only way to
     satisfy "centered when there's room" and "never covers the banner" at
     the same time. --pfs-kiosk-top/--pfs-kiosk-max-height are the two
     values it computes and writes here. */
  #kioskBody > .pfs-kiosk {
    position: fixed; top: var(--pfs-kiosk-top, 50%); left: 50%;
    transform: translate(-50%, -50%);
    transition: top .2s ease, max-height .2s ease;
    margin: 0; width: calc(100% - 48px); min-height: 0;
    max-height: var(--pfs-kiosk-max-height, calc(100% - 24px));
    overflow-y: auto; justify-content: flex-start;
  }
  /* While the custom keyboard is open (typing), free up screen space for
     the field actually being used — the evacuation banner and (Employee
     tab) the QR scanner column are irrelevant mid-search anyway. */
  body.pfs-vk-typing #kioskEvacBanner,
  body.pfs-vk-typing #qrScanColumn,
  body.pfs-vk-typing .kiosk-or {
    display: none;
  }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
  .pfs-tabs { display:flex; gap:8px; margin-bottom: 22px; background: var(--card2); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .pfs-tab { flex:1; border:none; background:transparent; color: var(--text2); padding: 10px 18px; border-radius: 999px; font-weight:700; font-size: 14px; min-height: 44px; }
  .pfs-tab[aria-selected="true"] { background: var(--accent); color:#fff; }
  .pfs-tab:disabled { opacity:.4; cursor:not-allowed; }
  .kiosk-card { width: min(480px, 100%); }
  .kiosk-card-wide { width: min(920px, 96vw); }
  /* Scan QR + Manual Lookup side by side on tablet-width+ screens, so both
     fit on one view with no scrolling — stacked with a horizontal "or" on
     narrow screens where a row genuinely won't fit. */
  .kiosk-columns { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; width:100%; }
  .kiosk-col { width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }
  .kiosk-or { display:flex; align-items:center; gap:10px; color:var(--text3); font-size:13px; width:100%; max-width:420px; }
  .kiosk-or::before, .kiosk-or::after { content:""; flex:1; height:1px; background:var(--line); }
  @media (min-width: 700px) {
    .kiosk-columns { flex-direction:row; align-items:center; justify-content:center; gap:36px; flex-wrap:wrap; }
    .kiosk-col { flex:1 1 320px; max-width:400px; }
    .kiosk-col .pfs-qr-frame { width: min(400px, 100%); }
    .kiosk-or { flex-direction:column; width:auto; max-width:none; align-self:stretch; }
    .kiosk-or::before, .kiosk-or::after { width:1px; height:auto; }
  }
  /* Small icon-only flip control overlaid on the QR frame itself, instead of
     a full-width "Switch camera" button taking up its own row below it. */
  .pfs-qr-flip-btn {
    position:absolute; top:10px; left:10px; z-index:2;
    width:40px; height:40px; border-radius:999px; padding:0;
    background:rgba(10,12,20,.6); border:1px solid rgba(255,255,255,.28); color:#fff;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(6px);
  }
  .pfs-qr-flip-btn:hover, .pfs-qr-flip-btn:focus-visible { background:rgba(10,12,20,.85); border-color:#fff; }
  .pfs-qr-flip-btn i { width:19px; height:19px; }
  .kiosk-search { width:100%; }
  .kiosk-results { display:flex; flex-direction:column; gap:8px; margin-top:14px; width:100%; max-height: 340px; overflow-y:auto; }
  .kiosk-result-btn { display:flex; align-items:center; gap:12px; width:100%; text-align:left; background: var(--card2); border:1px solid var(--line); border-radius: 12px; padding: 12px 16px; color: var(--text); min-height: 52px; }
  .kiosk-result-btn:hover, .kiosk-result-btn:focus-visible { border-color: var(--accent); }
  .kiosk-result-name { font-weight:700; font-size:14.5px; }
  .kiosk-chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .kiosk-chip-row:not(:empty) { margin-top:8px; }
  .kiosk-chip-row .set-selected-chip { margin-top:0; }
  .kiosk-phone-row { display:flex; gap:8px; }
  /* The <select> itself keeps native option text ("+44 United Kingdom") so
     the OPEN dropdown lists full country names — but its own text is made
     invisible and a small overlay span shows just the dial code, so the
     CLOSED box stays short instead of truncating mid-word. */
  .kiosk-phone-country-wrap { position: relative; flex: 0 0 84px; }
  .kiosk-phone-country-wrap .kiosk-phone-country { width: 100%; color: transparent; }
  .kiosk-phone-country-display {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    pointer-events: none; font-size: 16px; color: var(--text);
  }
  .kiosk-phone-row .form-input:last-child { flex: 1; min-width: 0; }
  #kvVehicle, #kcVehicle { text-transform: uppercase; }
  .kiosk-result-meta { font-size:12px; color: var(--text3); }
  .kiosk-actions { display:flex; flex-direction:column; gap:12px; width:100%; }
  .kiosk-actions .btn { width:100%; }
  .code-row { display:flex; gap:8px; width:100%; margin-top: 10px; }
  .code-row .form-input { flex:1; }
  .pfs-divider { display:flex; align-items:center; gap:10px; color: var(--text3); font-size:12px; margin: 16px 0; width:100%; }
  .pfs-divider::before, .pfs-divider::after { content:""; flex:1; height:1px; background: var(--line); }
</style>

<script type="module">
  import { requirePresenceModuleAccess, hasPermission, listSites, setSelectedSiteId, ensureSiteSelected } from "/systems/presence-fire-safety/shared/auth.js";
  import { employees, badges, presence, settings, visitors, contractors } from "/systems/presence-fire-safety/shared/api.js";
  import { renderNav, initMobileNav, initTopbar, renderSiteSwitcher } from "/systems/presence-fire-safety/shared/nav.js";
  import { initTheme } from "/systems/presence-fire-safety/shared/theme.js";
  import { isQrScanningSupported, startQrScanner } from "/systems/presence-fire-safety/shared/qr.js";
  import { renderPhotoCaptureStep } from "/systems/presence-fire-safety/shared/camera.js";
  import { initSoundFromSettings } from "/systems/presence-fire-safety/shared/sound.js";
  import { enforceKioskGuard, initKioskToggle, renderKioskEvacuationBanner, isKioskModeActive, initIdleScreensaver } from "/systems/presence-fire-safety/shared/kiosk.js";
  import { initVirtualKeyboard, focusWithKeyboard } from "/systems/presence-fire-safety/shared/virtual-keyboard.js";
  import {
    esc, toast, fmtDateTime, initials,
    loadingState, emptyState, errorState, permissionDeniedState, moduleDisabledState,
    offlineBanner, setInner,
  } from "/systems/presence-fire-safety/shared/ui.js";

  initTheme();

  let _profile = null;
  let _companyId = null;
  let _siteId = null;
  let _canSignOthers = false;
  let _canManageVisitors = false;
  let _canManageContractors = false;
  let _companySettings = null;
  let _qrSupported = isQrScanningSupported();
  let _scanner = null;          // { stop, switchCamera } while the scan tab is active
  let _selected = null;         // the identified employee { id, full_name, job_title, ... }
  let _currentStatus = null;    // 'in' | 'out' | null (unknown)
  let _submitting = false;
  let _requestId = null;        // held across retries of the SAME attempt (idempotency)
  let _searchDebounce = null;
  let _camera = null;           // active camera controller for the visitor/contractor photo step
  let _kioskTab = "employee";   // which top-level Kiosk Mode section is active
  let _empPanelId = "kioskBody"; // container the employee scan/manual sub-tabs render into
  let _kioskResizeObserver = null; // re-attached to .pfs-kiosk on every re-render, see positionKiosk()
  let _kvCurrentVisits = [];    // currently-signed-in visitors, fetched fresh each time the Visitor tab renders
  let _kvDebounce = null;
  let _kcCurrentVisits = [];    // currently-signed-in contractors, fetched fresh each time the Contractor tab renders
  let _kcDebounce = null;

  try {
    const { profile } = await requirePresenceModuleAccess();
    if (enforceKioskGuard("employee-signin")) throw new Error("__kiosk_redirect__");
    _profile = profile;
    _companyId = profile.company_id;
    _canSignOthers = hasPermission("presence.sign_others_in_out");
    _canManageVisitors = hasPermission("presence.manage_visitors");
    _canManageContractors = hasPermission("presence.manage_contractors");

    renderNav("employee-signin", profile);
    initMobileNav();
    initTopbar();
    initKioskToggle({ companyId: _companyId, currentPage: "employee-signin" });
    renderKioskEvacuationBanner("kioskEvacBanner");
    setUpKioskPositioning();
    wireOfflineBanner();
    initSoundFromSettings(_companyId);

    const siteList = await listSites(_companyId);
    _siteId = await ensureSiteSelected(_companyId);
    renderSiteSwitcher(document.getElementById("siteSwitcher"), siteList, _siteId, (newSiteId) => {
      setSelectedSiteId(newSiteId);
      _siteId = newSiteId;
      toast("info", "Site changed", "Sign-ins will now be recorded at the newly selected site.");
    });

    _companySettings = await settings.get(_companyId).catch(() => null);

    if (!_siteId) {
      setInner("kioskBody", emptyState({ icon: "map-pin", title: "No site configured", message: "Ask an administrator to set up a site before signing in." }));
    } else if (isKioskModeActive()) {
      renderKioskShell();
      // Custom on-screen keyboard, kiosk mode only — a physical keyboard is
      // normal for regular admin use of this same screen. Android's native
      // keyboard resizes/reflows the whole page when it appears, squishing
      // this layout; suppressing it in favour of our own fixed-bottom one
      // keeps the layout stable and gives touch-appropriate key sizes.
      initVirtualKeyboard();
    } else {
      renderEmployeePanel();
    }

    // Not gated on the separate "Kiosk Mode" toggle — this screen is a
    // fixed, full-screen sign-in UI whether or not that's switched on, so
    // it's just as exposed to burn-in either way. The company setting below
    // is the only on/off control.
    if (_siteId && _companySettings?.kiosk_screensaver_enabled !== false) {
      initIdleScreensaver({
        idleMs: 60000,
        text: "Touch to sign in",
        onIdle: () => { stopScanner(); stopCamera(); },
        onResume: () => { returnToStart(); },
      });
    }
  } catch (e) {
    if (e.message !== "__kiosk_redirect__") renderAccessBlocked(e);
  }

  // ── Kiosk panel positioning ──────────────────────────────────────────
  // Centers .pfs-kiosk within whatever space is actually free — below the
  // sticky topbar and the evacuation banner (when shown), above the custom
  // keyboard (when open) — and clamps so it never rises above that safe top
  // edge, which plain viewport-centering doesn't know to avoid. Recomputed
  // whenever any of those elements actually change size, via ResizeObserver
  // (also fires continuously during the reveal/keyboard CSS transitions, not
  // just at the start/end, so the position tracks smoothly rather than
  // snapping).
  function positionKiosk() {
    const kiosk = document.querySelector("#kioskBody > .pfs-kiosk");
    const topbar = document.querySelector(".pfs-topbar");
    const banner = document.getElementById("kioskEvacBanner");
    if (!kiosk) return;
    const topbarBottom = topbar?.getBoundingClientRect().bottom || 0;
    const bannerBottom = banner?.getBoundingClientRect().bottom || 0;
    const safeTop = Math.max(topbarBottom, bannerBottom, 0) + 16;
    const kbHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pfs-vkeyboard-height")) || 0;
    const safeBottom = window.innerHeight - kbHeight - 16;
    const kioskHeight = kiosk.getBoundingClientRect().height || 0;
    const centerTop = (safeTop + safeBottom) / 2;
    const minTop = safeTop + kioskHeight / 2; // clamp: box's own top edge never rises above safeTop
    const root = document.documentElement.style;
    root.setProperty("--pfs-kiosk-top", `${Math.max(centerTop, minTop)}px`);
    root.setProperty("--pfs-kiosk-max-height", `${Math.max(safeBottom - safeTop, 100)}px`);
  }

  function setUpKioskPositioning() {
    const topbar = document.querySelector(".pfs-topbar");
    const banner = document.getElementById("kioskEvacBanner");
    if (topbar) new ResizeObserver(positionKiosk).observe(topbar);
    if (banner) new ResizeObserver(positionKiosk).observe(banner);
    window.addEventListener("resize", positionKiosk);
    // .pfs-kiosk itself is replaced (setInner) on every tab switch/step, so
    // its own ResizeObserver target has to be re-attached each time rather
    // than observed once.
    _kioskResizeObserver = new ResizeObserver(positionKiosk);
    new MutationObserver(() => {
      const kiosk = document.querySelector("#kioskBody > .pfs-kiosk");
      if (!kiosk) return;
      _kioskResizeObserver.disconnect();
      _kioskResizeObserver.observe(kiosk);
      positionKiosk();
    }).observe(document.getElementById("kioskBody"), { childList: true });
  }

  // ── Kiosk shell: one screen, Employee / Visitor / Contractor tabs at the
  // top (Employee/Visitor/Contractor sections stay in the same view — no
  // separate "home"/menu screen to navigate back to). Outside Kiosk Mode,
  // employee-signin.html skips straight to renderEmployeePanel() below.
  function renderKioskShell() {
    stopScanner();
    stopCamera();
    const sections = [
      { id: "employee", label: "Employee" },
      _canManageVisitors ? { id: "visitor", label: "Visitor" } : null,
      (_canManageContractors && _companySettings?.contractor_management_enabled !== false) ? { id: "contractor", label: "Contractor" } : null,
    ].filter(Boolean);
    if (!sections.some(s => s.id === _kioskTab)) _kioskTab = sections[0]?.id || "employee";

    setInner("kioskBody", `
      <div class="pfs-kiosk">
        <div class="pfs-tabs kiosk-card" role="tablist" aria-label="Kiosk section">
          ${sections.map(s => `<button type="button" class="pfs-tab" data-ktab="${s.id}" role="tab" aria-selected="${_kioskTab === s.id}">${esc(s.label)}</button>`).join("")}
        </div>
        <div id="kioskPanel"></div>
      </div>`);

    document.querySelectorAll("[data-ktab]").forEach(btn => {
      btn.addEventListener("click", () => { _kioskTab = btn.dataset.ktab; renderKioskShell(); });
    });

    _empPanelId = "kioskPanel";
    if (_kioskTab === "employee") renderEmployeePanel();
    else if (_kioskTab === "visitor") renderVisitorKioskFlow();
    else if (_kioskTab === "contractor") renderContractorKioskFlow();
  }

  /** Returns to the kiosk's persistent tab shell (kiosk mode) or the plain
   *  employee sign-in panel (normal admin sign-in) after cancel/success/error. */
  function returnToStart() {
    if (isKioskModeActive()) renderKioskShell();
    else renderEmployeePanel();
  }

  // ── Employee panel — Scan QR and Manual Lookup shown together in one
  // view (rather than as separate tabs), each section only appearing when
  // it's actually usable: the QR scanner only if this browser supports
  // camera-based scanning, manual search/code lookup only if the company
  // hasn't disabled them. Renders into _empPanelId — "kioskBody" directly
  // for the plain admin sign-in page, or the kiosk shell's "kioskPanel" when
  // Kiosk Mode's Employee tab is active.
  function renderEmployeePanel() {
    stopScanner();
    const allowManual = _companySettings?.allow_manual_employee_lookup !== false;
    const allowCode = !!_companySettings?.allow_employee_code_lookup;
    const showScan = _qrSupported;
    // _empPanelId === "kioskBody" means we're the top-level page content (plain
    // admin sign-in), so we need the full-page ".pfs-kiosk" wrapper ourselves.
    // Otherwise we're nested inside the kiosk shell's "kioskPanel", which is
    // already inside that wrapper — adding a second one would nest two
    // min-height:100vh flex boxes and break the layout.
    const nested = _empPanelId !== "kioskBody";

    if (!showScan && !allowManual && !allowCode) {
      setInner(_empPanelId, emptyState({ icon: "ban", title: "Sign-in disabled", message: "Ask an administrator to enable QR scanning, manual lookup, or code lookup for this company." }));
      return;
    }

    const showLookup = allowManual || allowCode;
    const bothShown = showScan && showLookup;

    const scanColumn = showScan ? `
      <div class="kiosk-col" id="qrScanColumn">
        <div class="pfs-qr-frame" style="margin:0 auto">
          <video id="qrVideo" playsinline muted aria-label="Camera preview for badge scanning"></video>
          <button type="button" class="pfs-qr-flip-btn" id="switchCamBtn" aria-label="Switch camera" title="Switch camera"><i data-lucide="refresh-cw"></i></button>
        </div>
        <p class="text-muted" style="margin-top:14px">Hold your badge QR code up to the camera.</p>
        <div id="scanStatus" role="status" aria-live="polite"></div>
      </div>` : "";

    const lookupColumn = showLookup ? `
      <div class="kiosk-col">
        ${allowManual ? `
          <label class="form-label" for="empSearch">Search by name or employee ID</label>
          <input class="form-input kiosk-search" id="empSearch" type="text" placeholder="Start typing a name…" autocomplete="off"/>
          <div class="kiosk-results" id="empResults"></div>` : ""}
        ${allowManual && allowCode ? `<div class="pfs-divider">or</div>` : ""}
        ${allowCode ? `
          <label class="form-label" for="empCode">Enter employee code</label>
          <div class="code-row">
            <input class="form-input" id="empCode" type="text" placeholder="e.g. EMP-0042" autocomplete="off"/>
            <button class="btn btn-primary" id="codeGoBtn">Go</button>
          </div>
          <div id="codeStatus" role="status" aria-live="polite"></div>` : ""}
      </div>` : "";

    const panelMarkup = `
      <div id="tabPanel" class="kiosk-card${bothShown ? " kiosk-card-wide" : ""}">
        <div class="kiosk-columns">
          ${scanColumn}
          ${bothShown ? `<div class="kiosk-or"><span>or</span></div>` : ""}
          ${lookupColumn}
        </div>
      </div>`;
    setInner(_empPanelId, nested ? panelMarkup : `<div class="pfs-kiosk">${panelMarkup}</div>`);

    if (showScan) {
      const video = document.getElementById("qrVideo");
      _scanner = startQrScanner(video, {
        onDetect: (value) => onBadgeScanned(value),
        onError: (err) => {
          if (err.message === "QR_SCANNING_UNSUPPORTED") {
            _qrSupported = false;
            toast("info", "QR scanning unavailable", "Your browser doesn't support camera-based scanning. Use the search below instead.");
            renderEmployeePanel();
          } else if (err.name === "NotAllowedError" || err.name === "PermissionDeniedError") {
            setInner("scanStatus", `<p class="form-error">Camera access was blocked. Allow camera access for this site, or use the search below instead.</p>`);
          } else {
            setInner("scanStatus", `<p class="form-error">Camera error: ${esc(err.message || "could not access camera")}. Try the search below instead.</p>`);
          }
        },
      });
      document.getElementById("switchCamBtn").addEventListener("click", () => _scanner?.switchCamera());
    }

    if (allowManual) {
      const input = document.getElementById("empSearch");
      input.addEventListener("input", () => {
        clearTimeout(_searchDebounce);
        const q = input.value.trim();
        _searchDebounce = setTimeout(() => runSearch(q), 300);
      });
      if (!showScan) focusWithKeyboard(input);
    }

    if (allowCode) {
      const codeInput = document.getElementById("empCode");
      const go = async () => {
        const code = codeInput.value.trim();
        if (!code) return;
        try {
          const emp = await employees.byCode(_companyId, code);
          if (!emp) { setInner("codeStatus", `<p class="form-error">No employee found with that code.</p>`); return; }
          await selectEmployee(emp, "manual");
        } catch (e) {
          setInner("codeStatus", `<p class="form-error">${esc(e.message || "Lookup failed")}</p>`);
        }
      };
      document.getElementById("codeGoBtn").addEventListener("click", go);
      codeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
    }
  }

  async function onBadgeScanned(token) {
    if (_selected) return; // already resolving/showing a confirm screen
    try {
      const badge = await badges.byToken(_companyId, token);
      if (!badge) {
        setInner("scanStatus", `<p class="form-error">Badge not recognised. Try again or use the search below.</p>`);
        return;
      }
      await selectEmployee(badge.core_employees, "qr");
    } catch (e) {
      setInner("scanStatus", `<p class="form-error">${esc(e.message || "Could not look up that badge.")}</p>`);
    }
  }

  async function runSearch(query) {
    const results = document.getElementById("empResults");
    if (!results) return;
    if (!query) { results.innerHTML = ""; return; }
    try {
      const rows = await employees.search(_companyId, query, { limit: 10 });
      results.innerHTML = rows.length ? rows.map(r => `
        <button type="button" class="kiosk-result-btn" data-id="${esc(r.id)}">
          <div class="avatar avatar-sm">${esc(initials(r.full_name))}</div>
          <div>
            <div class="kiosk-result-name">${esc(r.full_name)}</div>
            <div class="kiosk-result-meta">${esc(r.job_title || "")}${r.employee_id ? " · " + esc(r.employee_id) : ""}</div>
          </div>
        </button>`).join("") : `<p class="text-muted">No matches.</p>`;
      results.querySelectorAll(".kiosk-result-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const row = rows.find(r => r.id === btn.dataset.id);
          if (row) handleManualSelect(row);
        });
      });
    } catch (e) {
      results.innerHTML = `<p class="form-error">${esc(e.message || "Search failed")}</p>`;
    }
  }

  function handleManualSelect(row) {
    if (row.id !== _profile.id && !_canSignOthers) {
      // Signing others in/out requires presence.sign_others_in_out — this
      // path is hidden by simply refusing to proceed rather than letting the
      // request reach the server and fail there.
      toast("error", "Not permitted", "You don't have permission to sign in other employees. You can only sign yourself in/out.");
      return;
    }
    selectEmployee(row, "manual");
  }

  // ── Identify -> confirm ───────────────────────────────────────────────
  async function selectEmployee(emp, method) {
    if (!emp) return;
    if (emp.id !== _profile.id && !_canSignOthers) {
      toast("error", "Not permitted", "You don't have permission to sign in other employees.");
      return;
    }
    stopScanner();
    _selected = emp;
    _requestId = null; // a freshly identified employee always starts a new attempt
    setInner("tabPanel", loadingState("Checking current status…"));
    try {
      _currentStatus = (await presence.myCurrentStatus(emp.id))?.current_status ?? null;
    } catch {
      _currentStatus = null;
    }
    renderConfirm(method);
  }

  function renderConfirm(method) {
    const isSelf = _selected.id === _profile.id;
    const statusBadge = _currentStatus === "in" ? `<span class="badge badge-green">Currently In</span>`
      : _currentStatus === "out" ? `<span class="badge badge-grey">Currently Out</span>`
      : `<span class="badge badge-yellow">Status Unknown</span>`;

    const actionButtons = _currentStatus === "in"
      ? `<button class="btn btn-danger" id="confirmBtn" data-direction="out">Confirm Sign Out</button>`
      : _currentStatus === "out"
      ? `<button class="btn btn-primary" id="confirmBtn" data-direction="in">Confirm Sign In</button>`
      : `<button class="btn btn-primary" id="confirmIn" data-direction="in">Sign In</button>
         <button class="btn btn-danger" id="confirmOut" data-direction="out">Sign Out</button>`;

    setInner("tabPanel", `
      <div class="kiosk-identity">
        <div class="avatar">${esc(initials(_selected.full_name))}</div>
        <h2>${esc(_selected.full_name)}</h2>
        <p>${esc(_selected.job_title || "")}</p>
        ${statusBadge}
        ${!isSelf ? `<p class="text-muted" style="margin-top:6px">Signing in on behalf of this employee.</p>` : ""}
      </div>
      <div class="kiosk-actions">
        ${actionButtons}
        <button class="btn" id="cancelBtn">Cancel</button>
      </div>
      <div id="confirmStatus" role="status" aria-live="polite"></div>`);

    ["confirmBtn", "confirmIn", "confirmOut"].forEach(id => {
      document.getElementById(id)?.addEventListener("click", (e) => submitSignEvent(e.currentTarget.dataset.direction, method));
    });
    document.getElementById("cancelBtn").addEventListener("click", () => {
      _selected = null; _currentStatus = null; _requestId = null;
      returnToStart();
    });
  }

  async function submitSignEvent(direction, method) {
    if (_submitting) return; // guard against double-submit while a request is in flight
    _submitting = true;
    if (!_requestId) _requestId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`;

    const btns = document.querySelectorAll("#confirmBtn, #confirmIn, #confirmOut, #cancelBtn");
    btns.forEach(b => b.disabled = true);
    setInner("confirmStatus", loadingState("Recording…"));

    const isSelf = _selected.id === _profile.id;
    const recordMethod = method === "qr" ? "qr" : (isSelf ? "manual" : "admin");

    try {
      if (isSelf) {
        await presence.signSelf({ siteId: _siteId, direction, method: recordMethod, requestId: _requestId });
      } else {
        await presence.signOthersByEmployee({ siteId: _siteId, employeeId: _selected.id, direction, method: recordMethod, requestId: _requestId });
      }
      renderSuccess(direction);
    } catch (e) {
      btns.forEach(b => b.disabled = false);
      setInner("confirmStatus", errorState({
        title: "Couldn't record this",
        message: e.message || "Please try again.",
        retryId: "retrySubmit",
      }));
      // Reuse the SAME _requestId on retry so the server can de-duplicate a
      // partially-succeeded network request; only a fresh employee selection
      // or Cancel generates a new one.
      document.getElementById("retrySubmit")?.addEventListener("click", () => submitSignEvent(direction, method));
    } finally {
      _submitting = false;
    }
  }

  function renderSuccess(direction) {
    const name = esc(_selected.full_name);
    setInner("tabPanel", `
      <div class="kiosk-identity">
        <div class="success-icon"><i data-lucide="check-circle-2"></i></div>
        <h2>${direction === "in" ? "Signed In" : "Signed Out"}</h2>
        <p>${name} — ${fmtDateTime(new Date())}</p>
      </div>
      <div class="kiosk-actions">
        <button class="btn btn-primary" id="doneBtn">Done</button>
      </div>`);
    document.getElementById("doneBtn").addEventListener("click", resetToStart);
    toast("success", direction === "in" ? "Signed in" : "Signed out", name);
    // Auto-return to the scan/search screen after a short pause so the kiosk
    // is ready for the next person without requiring a tap.
    setTimeout(resetToStart, 4000);
  }

  function resetToStart() {
    _selected = null; _currentStatus = null; _requestId = null;
    returnToStart();
  }

  function stopScanner() {
    if (_scanner) { _scanner.stop(); _scanner = null; }
  }

  function stopCamera() {
    if (_camera) { _camera.stop(); _camera = null; }
  }

  // ── Shared: multi-select host search (visitor "who are you here to see?",
  // contractor "who are you working with?") — search-as-you-type; each pick
  // adds a removable chip and clears the box so another host can be
  // searched for straight away, rather than a single replaceable value. ──
  function wireMultiHostSearch(inputId, resultsId, chipsId, onChange) {
    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);
    const chipsEl = document.getElementById(chipsId);
    let selected = []; // [{ id, name }]
    let debounce;

    function renderChips() {
      chipsEl.innerHTML = selected.map(h => `
        <span class="set-selected-chip">${esc(h.name)} <button type="button" data-id="${esc(h.id)}" aria-label="Remove ${esc(h.name)}">✕</button></span>`).join("");
      chipsEl.querySelectorAll("button[data-id]").forEach(btn => {
        btn.addEventListener("click", () => {
          selected = selected.filter(h => h.id !== btn.dataset.id);
          renderChips();
          onChange(selected.map(h => h.id));
        });
      });
    }

    input.addEventListener("input", () => {
      clearTimeout(debounce);
      const q = input.value.trim();
      if (!q) { results.innerHTML = ""; return; }
      debounce = setTimeout(async () => {
        try {
          const rows = (await employees.search(_companyId, q, { limit: 6 })).filter(r => !selected.some(h => h.id === r.id));
          results.innerHTML = rows.length ? rows.map(r => `
            <button type="button" class="kiosk-result-btn" data-id="${esc(r.id)}" data-name="${esc(r.full_name)}">
              <div class="avatar avatar-sm">${esc(initials(r.full_name))}</div>
              <div><div class="kiosk-result-name">${esc(r.full_name)}</div><div class="kiosk-result-meta">${esc(r.job_title || "")}</div></div>
            </button>`).join("") : `<p class="text-muted">No matches.</p>`;
          results.querySelectorAll(".kiosk-result-btn").forEach(btn => {
            btn.addEventListener("click", () => {
              selected.push({ id: btn.dataset.id, name: btn.dataset.name });
              renderChips();
              onChange(selected.map(h => h.id));
              input.value = "";
              results.innerHTML = "";
              input.focus();
            });
          });
        } catch { /* host search is optional — fail quietly */ }
      }, 300);
    });
  }

  // ── Shared: phone field with a dial-code select ─────────────────────────
  // United Kingdom first (covers England/Scotland/Wales/N. Ireland, all
  // dial +44 — there's no separate code per home nation), then Ireland and
  // the other most-used countries, before the rest alphabetically.
  const PHONE_COUNTRIES = [
    { code: "+44", label: "United Kingdom" },
    { code: "+353", label: "Ireland" },
    { code: "+1", label: "United States" },
    { code: "+1", label: "Canada" },
    { code: "+61", label: "Australia" },
    { code: "+64", label: "New Zealand" },
    { code: "+33", label: "France" },
    { code: "+49", label: "Germany" },
    { code: "+34", label: "Spain" },
    { code: "+39", label: "Italy" },
    { code: "+31", label: "Netherlands" },
    { code: "+32", label: "Belgium" },
    { code: "+351", label: "Portugal" },
    { code: "+27", label: "South Africa" },
    { code: "+971", label: "United Arab Emirates" },
    { code: "+91", label: "India" },
    { code: "+86", label: "China" },
    { code: "+81", label: "Japan" },
    { code: "+65", label: "Singapore" },
  ];

  function phoneFieldHtml(idPrefix, label) {
    return `
      <label class="form-label" for="${idPrefix}Phone" style="margin-top:10px">${esc(label)}</label>
      <div class="kiosk-phone-row">
        <div class="kiosk-phone-country-wrap">
          <select class="form-input kiosk-phone-country" id="${idPrefix}PhoneCountry" aria-label="Country code">
            ${PHONE_COUNTRIES.map((c, i) => `<option value="${esc(c.code)}" ${i === 0 ? "selected" : ""}>${esc(c.code)} ${esc(c.label)}</option>`).join("")}
          </select>
          <span class="kiosk-phone-country-display" id="${idPrefix}PhoneCountryDisplay" aria-hidden="true">${esc(PHONE_COUNTRIES[0].code)}</span>
        </div>
        <input class="form-input" id="${idPrefix}Phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="7700 900000"/>
      </div>`;
  }

  /** Wires the country-code overlay (so the closed select shows just the
   *  dial code) and restricts the number field to digits only — call once
   *  right after the phoneFieldHtml() markup is in the DOM. */
  function wirePhoneField(idPrefix) {
    const countrySelect = document.getElementById(`${idPrefix}PhoneCountry`);
    const display = document.getElementById(`${idPrefix}PhoneCountryDisplay`);
    countrySelect?.addEventListener("change", () => { if (display) display.textContent = countrySelect.value; });
    const phoneInput = document.getElementById(`${idPrefix}Phone`);
    phoneInput?.addEventListener("input", () => {
      const digitsOnly = phoneInput.value.replace(/[^0-9]/g, "");
      if (digitsOnly !== phoneInput.value) {
        const pos = phoneInput.selectionStart - (phoneInput.value.length - digitsOnly.length);
        phoneInput.value = digitsOnly;
        phoneInput.setSelectionRange(pos, pos);
      }
    });
  }

  /** Forces a vehicle registration field to always store/display capitals. */
  function wireVehicleField(idPrefix) {
    const el = document.getElementById(`${idPrefix}Vehicle`);
    el?.addEventListener("input", () => {
      const upper = el.value.toUpperCase();
      if (upper !== el.value) {
        const pos = el.selectionStart;
        el.value = upper;
        el.setSelectionRange(pos, pos);
      }
    });
  }

  /** Combines the dial code + number into one string for the phone field,
   *  or "" if nothing was entered — same shape either way regardless of
   *  which country is selected. */
  function combinedPhone(idPrefix) {
    const number = document.getElementById(`${idPrefix}Phone`).value.trim();
    if (!number) return "";
    const code = document.getElementById(`${idPrefix}PhoneCountry`).value;
    return `${code} ${number}`;
  }

  // ── Visitor kiosk flow ──────────────────────────────────────────────────
  // Name-first: typing your first + last name checks it against who's
  // currently signed in. A match reveals a sign-out confirmation; no match
  // smoothly reveals the rest of the sign-in form instead of showing it all
  // upfront, since most people only need the two name fields to sign out.
  function renderVisitorKioskFlow() {
    stopScanner();
    let hostIds = [];
    setInner("kioskPanel", `
        <div class="card kiosk-card">
          <h2 style="margin-top:0">Visitor Sign In / Out</h2>
          <p class="text-muted" style="margin-top:-6px">Enter your name to sign in — or to sign out if you're already here.</p>
          <label class="form-label" for="kvFirst">First name *</label>
          <input class="form-input" id="kvFirst" autocomplete="off"/>
          <label class="form-label" for="kvLast" style="margin-top:10px">Last name *</label>
          <input class="form-input" id="kvLast" autocomplete="off"/>
          <div id="kvResult"></div>
          <div id="kvMoreWrap" class="kiosk-reveal" aria-hidden="true">
            <label class="form-label" for="kvOrg" style="margin-top:10px">Organisation</label>
            <input class="form-input" id="kvOrg" autocomplete="off"/>
            <label class="form-label" for="kvEmail" style="margin-top:10px">Email</label>
            <input class="form-input" id="kvEmail" type="email" autocomplete="off"/>
            ${phoneFieldHtml("kv", "Phone")}
            <label class="form-label" for="kvVehicle" style="margin-top:10px">Vehicle registration</label>
            <input class="form-input" id="kvVehicle" autocomplete="off"/>
            <label class="form-label" for="kvHost" style="margin-top:10px">Who are you here to see? (optional)</label>
            <div class="kiosk-chip-row" id="kvHostChips"></div>
            <input class="form-input" id="kvHost" autocomplete="off" placeholder="Search employees…" style="margin-top:8px"/>
            <div class="kiosk-results" id="kvHostResults"></div>
            <label class="form-label" for="kvReason" style="margin-top:10px">Visit reason</label>
            <input class="form-input" id="kvReason" autocomplete="off"/>
            <label class="set-checkbox-field" style="margin-top:14px"><input type="checkbox" id="kvTerms"/> I accept the site visitor terms</label>
            <div id="kvError" class="form-error" role="alert"></div>
            <div class="kiosk-actions" style="margin-top:16px">
              <button class="btn btn-primary" id="kvNextBtn" type="button">Continue</button>
            </div>
          </div>
        </div>`);
    wireMultiHostSearch("kvHost", "kvHostResults", "kvHostChips", (ids) => { hostIds = ids; });
    wirePhoneField("kv");
    wireVehicleField("kv");

    _kvCurrentVisits = [];
    visitors.currentVisits(_companyId, _siteId).then(rows => { _kvCurrentVisits = rows; }).catch(() => { _kvCurrentVisits = []; });

    const firstInput = document.getElementById("kvFirst");
    const lastInput = document.getElementById("kvLast");
    firstInput.addEventListener("input", onVisitorNameInput);
    lastInput.addEventListener("input", onVisitorNameInput);
    focusWithKeyboard(firstInput);

    document.getElementById("kvNextBtn").addEventListener("click", () => {
      const firstName = document.getElementById("kvFirst").value.trim();
      const lastName = document.getElementById("kvLast").value.trim();
      const organisation = document.getElementById("kvOrg").value.trim();
      const email = document.getElementById("kvEmail").value.trim();
      const phone = combinedPhone("kv");
      const vehicleRegistration = document.getElementById("kvVehicle").value.trim();
      const visitReason = document.getElementById("kvReason").value.trim();
      const acceptTerms = document.getElementById("kvTerms").checked;
      const errBox = document.getElementById("kvError");
      if (!firstName || !lastName) { errBox.textContent = "First and last name are required."; return; }
      if (!acceptTerms) { errBox.textContent = "Please accept the site visitor terms to continue."; return; }
      errBox.textContent = "";
      const form = { firstName, lastName, organisation, email, phone, vehicleRegistration, hostEmployeeIds: hostIds, visitReason, acceptTerms };
      if (_companySettings?.visitor_photo_enabled) {
        renderKioskPhotoStep("visitor", form);
      } else {
        submitKioskVisitor(form, null);
      }
    });
  }

  // Only touches the UI once typing actually pauses — clearing the timer on
  // every keystroke means nothing visibly changes (no collapsing an
  // already-revealed form, no flickering checking indicator) while the
  // visitor is still typing or fixing a typo, only once they stop.
  function onVisitorNameInput() {
    clearTimeout(_kvDebounce);
    const first = document.getElementById("kvFirst").value.trim();
    const last = document.getElementById("kvLast").value.trim();
    if (!first || !last) { resetVisitorStep(); return; }
    _kvDebounce = setTimeout(() => checkVisitorName(first, last), 500);
  }

  function resetVisitorStep() {
    const resultEl = document.getElementById("kvResult");
    const moreWrap = document.getElementById("kvMoreWrap");
    if (!resultEl || !moreWrap) return;
    resultEl.innerHTML = "";
    moreWrap.classList.remove("kiosk-reveal-in");
    moreWrap.setAttribute("aria-hidden", "true");
  }

  function checkVisitorName(first, last) {
    const resultEl = document.getElementById("kvResult");
    const moreWrap = document.getElementById("kvMoreWrap");
    if (!resultEl || !moreWrap) return;
    moreWrap.classList.remove("kiosk-reveal-in");
    moreWrap.setAttribute("aria-hidden", "true");
    resultEl.innerHTML = `<div class="kiosk-checking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    // A short extra beat so "checking" actually registers as a step rather
    // than an instant flash, then resolve to a sign-out card or the form.
    setTimeout(() => resolveVisitorMatch(first, last), 300);
  }

  function resolveVisitorMatch(first, last) {
    const resultEl = document.getElementById("kvResult");
    const moreWrap = document.getElementById("kvMoreWrap");
    if (!resultEl || !moreWrap) return; // panel navigated away while the timer was pending
    // Stale check: the name fields may have changed again during the
    // "checking" beat above — a newer, already-queued check will supersede
    // this one, so bail out rather than showing a result for an old name.
    const f2 = document.getElementById("kvFirst")?.value.trim();
    const l2 = document.getElementById("kvLast")?.value.trim();
    if (f2 !== first || l2 !== last) return;
    const norm = (s) => s.trim().toLowerCase();
    const match = _kvCurrentVisits.find(v =>
      norm(v.presence_fire_safety_visitors?.first_name || "") === norm(first) &&
      norm(v.presence_fire_safety_visitors?.last_name || "") === norm(last));
    if (match) {
      resultEl.innerHTML = "";
      renderVisitorFoundCard(match);
    } else {
      resultEl.innerHTML = "";
      moreWrap.classList.add("kiosk-reveal-in");
      moreWrap.setAttribute("aria-hidden", "false");
    }
  }

  function renderVisitorFoundCard(visit) {
    const v = visit.presence_fire_safety_visitors || {};
    const name = `${v.first_name || ""} ${v.last_name || ""}`.trim();
    setInner("kvResult", `
      <div class="kiosk-identity kiosk-pop-in">
        <div class="avatar" id="kvFoundAvatar">${esc(initials(name))}</div>
        <h2>${esc(name)}</h2>
        ${v.organisation ? `<p>${esc(v.organisation)}</p>` : ""}
        <span class="badge badge-green">Currently signed in</span>
        ${visit.signed_in_at ? `<p class="text-muted" style="margin-top:6px">Since ${fmtDateTime(new Date(visit.signed_in_at))}</p>` : ""}
      </div>
      <div class="kiosk-actions">
        <button class="btn btn-danger" id="kvSignOutBtn">Confirm Sign Out</button>
        <button class="btn" id="kvNotMeBtn">Not you? Use a different name</button>
      </div>
      <div id="kvSignOutStatus" role="status" aria-live="polite"></div>`);
    document.getElementById("kvSignOutBtn").addEventListener("click", () => submitVisitorSignOut(visit));
    document.getElementById("kvNotMeBtn").addEventListener("click", () => {
      document.getElementById("kvFirst").value = "";
      document.getElementById("kvLast").value = "";
      document.getElementById("kvResult").innerHTML = "";
      document.getElementById("kvFirst").focus();
    });
    if (v.photo_path) {
      visitors.photoSignedUrl(_companyId, v.photo_path).then(({ data }) => {
        const av = document.getElementById("kvFoundAvatar");
        if (av && data?.signedUrl) av.outerHTML = `<img class="avatar" id="kvFoundAvatar" src="${esc(data.signedUrl)}" alt="" style="object-fit:cover"/>`;
      }).catch(() => {});
    }
  }

  async function submitVisitorSignOut(visit) {
    const signOutBtn = document.getElementById("kvSignOutBtn");
    const notMeBtn = document.getElementById("kvNotMeBtn");
    if (signOutBtn) signOutBtn.disabled = true;
    if (notMeBtn) notMeBtn.disabled = true;
    setInner("kvSignOutStatus", loadingState("Signing out…"));
    try {
      await visitors.signOut(_companyId, visit.id);
      const v = visit.presence_fire_safety_visitors || {};
      renderKioskSuccess(`${v.first_name || ""} ${v.last_name || ""}`.trim(), "Visitor signed out");
    } catch (e) {
      if (signOutBtn) signOutBtn.disabled = false;
      if (notMeBtn) notMeBtn.disabled = false;
      setInner("kvSignOutStatus", errorState({ title: "Couldn't sign out", message: e.message, retryId: "kvSignOutRetry" }));
      document.getElementById("kvSignOutRetry")?.addEventListener("click", () => submitVisitorSignOut(visit));
    }
  }

  async function submitKioskVisitor(form, photoBlob) {
    setInner("kioskPanel", loadingState("Signing in…"));
    try {
      const visit = await visitors.createVisit({
        siteId: _siteId, firstName: form.firstName, lastName: form.lastName,
        organisation: form.organisation || null, email: form.email || null, phone: form.phone || null,
        vehicleRegistration: form.vehicleRegistration || null, hostEmployeeIds: form.hostEmployeeIds,
        visitReason: form.visitReason || null, acceptTerms: form.acceptTerms, signInNow: true,
      });
      if (photoBlob && visit?.visitor_id) {
        try {
          const path = await visitors.uploadPhoto(_companyId, visit.visitor_id, photoBlob);
          await visitors.setPhoto(visit.visitor_id, path);
        } catch {
          toast("error", "Photo not saved", "The visitor was signed in, but the photo couldn't be uploaded.");
        }
      }
      renderKioskSuccess(`${form.firstName} ${form.lastName}`, "Visitor signed in");
    } catch (e) {
      setInner("kioskPanel", errorState({ title: "Couldn't sign in visitor", message: e.message, retryId: "kvRetry" }));
      document.getElementById("kvRetry")?.addEventListener("click", () => submitKioskVisitor(form, photoBlob));
    }
  }

  // ── Contractor kiosk flow ─────────────────────────────────────────────
  // Same name-first pattern as the visitor flow above, keyed on the
  // contact's own first + last name.
  function renderContractorKioskFlow() {
    stopScanner();
    let hostIds = [];
    setInner("kioskPanel", `
        <div class="card kiosk-card">
          <h2 style="margin-top:0">Contractor Sign In / Out</h2>
          <p class="text-muted" style="margin-top:-6px">Enter your name to sign in — or to sign out if you're already here.</p>
          <label class="form-label" for="kcFirst">First name *</label>
          <input class="form-input" id="kcFirst" autocomplete="off"/>
          <label class="form-label" for="kcLast" style="margin-top:10px">Last name *</label>
          <input class="form-input" id="kcLast" autocomplete="off"/>
          <div id="kcResult"></div>
          <div id="kcMoreWrap" class="kiosk-reveal" aria-hidden="true">
            <label class="form-label" for="kcBusiness" style="margin-top:10px">Business name *</label>
            <input class="form-input" id="kcBusiness" autocomplete="off"/>
            <label class="form-label" for="kcEmail" style="margin-top:10px">Email</label>
            <input class="form-input" id="kcEmail" type="email" autocomplete="off"/>
            ${phoneFieldHtml("kc", "Phone")}
            <label class="form-label" for="kcVehicle" style="margin-top:10px">Vehicle registration</label>
            <input class="form-input" id="kcVehicle" autocomplete="off"/>
            <label class="form-label" for="kcHost" style="margin-top:10px">Host / who are you working with? (optional)</label>
            <div class="kiosk-chip-row" id="kcHostChips"></div>
            <input class="form-input" id="kcHost" autocomplete="off" placeholder="Search employees…" style="margin-top:8px"/>
            <div class="kiosk-results" id="kcHostResults"></div>
            <label class="form-label" for="kcWorkPurpose" style="margin-top:10px">Work purpose</label>
            <input class="form-input" id="kcWorkPurpose" autocomplete="off"/>
            <label class="form-label" for="kcPermit" style="margin-top:10px">Permit reference</label>
            <input class="form-input" id="kcPermit" autocomplete="off"/>
            <label class="set-checkbox-field" style="margin-top:14px"><input type="checkbox" id="kcInduction"/> Site induction confirmed</label>
            <div id="kcError" class="form-error" role="alert"></div>
            <div class="kiosk-actions" style="margin-top:16px">
              <button class="btn btn-primary" id="kcNextBtn" type="button">Continue</button>
            </div>
          </div>
        </div>`);
    wireMultiHostSearch("kcHost", "kcHostResults", "kcHostChips", (ids) => { hostIds = ids; });
    wirePhoneField("kc");
    wireVehicleField("kc");

    _kcCurrentVisits = [];
    contractors.currentVisits(_companyId, _siteId).then(rows => { _kcCurrentVisits = rows; }).catch(() => { _kcCurrentVisits = []; });

    const firstInput = document.getElementById("kcFirst");
    const lastInput = document.getElementById("kcLast");
    firstInput.addEventListener("input", onContractorNameInput);
    lastInput.addEventListener("input", onContractorNameInput);
    focusWithKeyboard(firstInput);

    document.getElementById("kcNextBtn").addEventListener("click", () => {
      const firstName = document.getElementById("kcFirst").value.trim();
      const lastName = document.getElementById("kcLast").value.trim();
      const businessName = document.getElementById("kcBusiness").value.trim();
      const email = document.getElementById("kcEmail").value.trim();
      const phone = combinedPhone("kc");
      const vehicleRegistration = document.getElementById("kcVehicle").value.trim();
      const workPurpose = document.getElementById("kcWorkPurpose").value.trim();
      const permitReference = document.getElementById("kcPermit").value.trim();
      const inductionConfirmed = document.getElementById("kcInduction").checked;
      const errBox = document.getElementById("kcError");
      if (!firstName || !lastName) { errBox.textContent = "First and last name are required."; return; }
      if (!businessName) { errBox.textContent = "Business name is required."; return; }
      errBox.textContent = "";
      const contactName = `${firstName} ${lastName}`.trim();
      const form = { businessName, contactName, phone, email, vehicleRegistration, hostEmployeeIds: hostIds, workPurpose, permitReference, inductionConfirmed };
      if (_companySettings?.visitor_photo_enabled) {
        renderKioskPhotoStep("contractor", form);
      } else {
        submitKioskContractor(form, null);
      }
    });
  }

  // Same "only touch the UI once typing pauses" approach as the visitor
  // flow above — see onVisitorNameInput for why.
  function onContractorNameInput() {
    clearTimeout(_kcDebounce);
    const first = document.getElementById("kcFirst").value.trim();
    const last = document.getElementById("kcLast").value.trim();
    if (!first || !last) { resetContractorStep(); return; }
    _kcDebounce = setTimeout(() => checkContractorName(first, last), 500);
  }

  function resetContractorStep() {
    const resultEl = document.getElementById("kcResult");
    const moreWrap = document.getElementById("kcMoreWrap");
    if (!resultEl || !moreWrap) return;
    resultEl.innerHTML = "";
    moreWrap.classList.remove("kiosk-reveal-in");
    moreWrap.setAttribute("aria-hidden", "true");
  }

  function checkContractorName(first, last) {
    const resultEl = document.getElementById("kcResult");
    const moreWrap = document.getElementById("kcMoreWrap");
    if (!resultEl || !moreWrap) return;
    moreWrap.classList.remove("kiosk-reveal-in");
    moreWrap.setAttribute("aria-hidden", "true");
    resultEl.innerHTML = `<div class="kiosk-checking"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    setTimeout(() => resolveContractorMatch(first, last), 300);
  }

  function resolveContractorMatch(first, last) {
    const resultEl = document.getElementById("kcResult");
    const moreWrap = document.getElementById("kcMoreWrap");
    if (!resultEl || !moreWrap) return;
    const f2 = document.getElementById("kcFirst")?.value.trim();
    const l2 = document.getElementById("kcLast")?.value.trim();
    if (f2 !== first || l2 !== last) return; // stale — a newer check is already queued
    const norm = (s) => s.trim().toLowerCase();
    const target = norm(`${first} ${last}`);
    const match = _kcCurrentVisits.find(v => norm(v.presence_fire_safety_contractors?.contact_name || "") === target);
    if (match) {
      resultEl.innerHTML = "";
      renderContractorFoundCard(match);
    } else {
      resultEl.innerHTML = "";
      moreWrap.classList.add("kiosk-reveal-in");
      moreWrap.setAttribute("aria-hidden", "false");
    }
  }

  function renderContractorFoundCard(visit) {
    const c = visit.presence_fire_safety_contractors || {};
    setInner("kcResult", `
      <div class="kiosk-identity kiosk-pop-in">
        <div class="avatar" id="kcFoundAvatar">${esc(initials(c.contact_name))}</div>
        <h2>${esc(c.contact_name || "")}</h2>
        ${c.business_name ? `<p>${esc(c.business_name)}</p>` : ""}
        <span class="badge badge-green">Currently signed in</span>
        ${visit.signed_in_at ? `<p class="text-muted" style="margin-top:6px">Since ${fmtDateTime(new Date(visit.signed_in_at))}</p>` : ""}
      </div>
      <div class="kiosk-actions">
        <button class="btn btn-danger" id="kcSignOutBtn">Confirm Sign Out</button>
        <button class="btn" id="kcNotMeBtn">Not you? Use a different name</button>
      </div>
      <div id="kcSignOutStatus" role="status" aria-live="polite"></div>`);
    document.getElementById("kcSignOutBtn").addEventListener("click", () => submitContractorSignOut(visit));
    document.getElementById("kcNotMeBtn").addEventListener("click", () => {
      document.getElementById("kcFirst").value = "";
      document.getElementById("kcLast").value = "";
      document.getElementById("kcResult").innerHTML = "";
      document.getElementById("kcFirst").focus();
    });
    if (c.photo_path) {
      contractors.photoSignedUrl(_companyId, c.photo_path).then(({ data }) => {
        const av = document.getElementById("kcFoundAvatar");
        if (av && data?.signedUrl) av.outerHTML = `<img class="avatar" id="kcFoundAvatar" src="${esc(data.signedUrl)}" alt="" style="object-fit:cover"/>`;
      }).catch(() => {});
    }
  }

  async function submitContractorSignOut(visit) {
    const signOutBtn = document.getElementById("kcSignOutBtn");
    const notMeBtn = document.getElementById("kcNotMeBtn");
    if (signOutBtn) signOutBtn.disabled = true;
    if (notMeBtn) notMeBtn.disabled = true;
    setInner("kcSignOutStatus", loadingState("Signing out…"));
    try {
      await contractors.signOut(_companyId, visit.id);
      const c = visit.presence_fire_safety_contractors || {};
      renderKioskSuccess(c.contact_name || c.business_name || "", "Contractor signed out");
    } catch (e) {
      if (signOutBtn) signOutBtn.disabled = false;
      if (notMeBtn) notMeBtn.disabled = false;
      setInner("kcSignOutStatus", errorState({ title: "Couldn't sign out", message: e.message, retryId: "kcSignOutRetry" }));
      document.getElementById("kcSignOutRetry")?.addEventListener("click", () => submitContractorSignOut(visit));
    }
  }

  async function submitKioskContractor(form, photoBlob) {
    setInner("kioskPanel", loadingState("Signing in…"));
    try {
      const visit = await contractors.createVisit({
        siteId: _siteId, businessName: form.businessName, contactName: form.contactName || null,
        phone: form.phone || null, email: form.email || null, vehicleRegistration: form.vehicleRegistration || null,
        hostEmployeeIds: form.hostEmployeeIds, workPurpose: form.workPurpose || null,
        permitReference: form.permitReference || null, inductionConfirmed: form.inductionConfirmed, signInNow: true,
      });
      if (photoBlob && visit?.contractor_id) {
        try {
          const path = await contractors.uploadPhoto(_companyId, visit.contractor_id, photoBlob);
          await contractors.setPhoto(visit.contractor_id, path);
        } catch {
          toast("error", "Photo not saved", "The contractor was signed in, but the photo couldn't be uploaded.");
        }
      }
      renderKioskSuccess(form.contactName || form.businessName, "Contractor signed in");
    } catch (e) {
      setInner("kioskPanel", errorState({ title: "Couldn't sign in contractor", message: e.message, retryId: "kcRetry" }));
      document.getElementById("kcRetry")?.addEventListener("click", () => submitKioskContractor(form, photoBlob));
    }
  }

  // ── Shared photo step + success screen for visitor/contractor kiosk flows ─
  function renderKioskPhotoStep(kind, form) {
    setInner("kioskPanel", `<div class="card kiosk-card" id="camContainer"></div>`);
    _camera = renderPhotoCaptureStep(document.getElementById("camContainer"), {
      title: "Take a photo for the visitor badge",
      onCaptured: (blob) => { stopCamera(); kind === "visitor" ? submitKioskVisitor(form, blob) : submitKioskContractor(form, blob); },
      onSkip: () => { stopCamera(); kind === "visitor" ? submitKioskVisitor(form, null) : submitKioskContractor(form, null); },
    });
  }

  function renderKioskSuccess(name, label) {
    setInner("kioskPanel", `
        <div class="kiosk-identity">
          <div class="success-icon"><i data-lucide="check-circle-2"></i></div>
          <h2>${esc(label)}</h2>
          <p>${esc(name)} — ${fmtDateTime(new Date())}</p>
        </div>
        <div class="kiosk-actions">
          <button class="btn btn-primary" id="kioskDoneBtn">Done</button>
        </div>`);
    document.getElementById("kioskDoneBtn").addEventListener("click", () => renderKioskShell());
    toast("success", label, name);
    setTimeout(() => renderKioskShell(), 4000);
  }

  // ── Access-blocked rendering (see index.html for rationale) ────────────
  function renderAccessBlocked(e) {
    const msg = e?.message || "";
    document.body.innerHTML = `
      <div class="pfs-shell">
        <div class="pfs-main" style="width:100%">
          <div class="pfs-topbar">
            <h1>Presence &amp; Fire Safety</h1>
            <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
            <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><i data-lucide="log-out"></i></button>
          </div>
          <div class="pfs-content" id="content"></div>
        </div>
      </div>
      <div id="toastwrap" aria-live="polite"></div>`;
    initTheme();
    initTopbar();

    let html;
    if (msg.includes("not enabled")) html = moduleDisabledState();
    else if (msg.includes("permission") || msg.includes("No access")) html = permissionDeniedState(msg);
    else if (msg.includes("profile") || msg.includes("session")) html = permissionDeniedState(msg || "Your account isn't set up for this module yet.");
    else html = errorState({ title: "Couldn't load Presence & Fire Safety", message: msg, retryId: "blockedRetry" });

    setInner("content", html);
    document.getElementById("blockedRetry")?.addEventListener("click", () => window.location.reload());
  }

  function wireOfflineBanner() {
    const render = () => setInner("offlineArea", navigator.onLine ? "" : offlineBanner());
    render();
    window.addEventListener("online", render);
    window.addEventListener("offline", render);
  }

  window.addEventListener("beforeunload", () => { stopScanner(); stopCamera(); });
</script>
</body>
</html>
