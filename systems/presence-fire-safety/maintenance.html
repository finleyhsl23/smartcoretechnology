<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Under Maintenance — SmartCore Presence &amp; Fire Safety</title>
  <link rel="icon" type="image/png" href="/SmartCore Official Logos/SC Icon - Black Background.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/systems/presence-fire-safety/shared/presence-fire-safety.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body {
      background: var(--bg); color: var(--text); font-family: var(--font);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow: hidden;
    }
    .maint-card {
      position: relative; max-width: 480px; width: 100%; text-align: center;
      padding: 48px 36px; border-radius: 22px;
      background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 24px 70px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.16);
      overflow: hidden;
    }
    [data-theme="light"] .maint-card {
      background: linear-gradient(160deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
      border: 1px solid rgba(255,255,255,.7);
      box-shadow: 0 24px 70px rgba(30,41,59,.14), inset 0 1px 0 rgba(255,255,255,.7);
    }
    .maint-card::before, .maint-card::after { content:""; position:absolute; border-radius:50%; filter:blur(55px); z-index:-1; pointer-events:none; }
    .maint-card::before { width:220px; height:220px; background:var(--accent); opacity:.3; top:-80px; right:-60px; }
    .maint-card::after { width:200px; height:200px; background:var(--warn); opacity:.22; bottom:-70px; left:-60px; }
    .maint-logo {
      width: 64px; height: 64px; border-radius: 16px; background: #1e5cff;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 22px;
      box-shadow: 0 8px 24px rgba(30,92,255,.35);
    }
    .maint-logo img { width: 36px; height: 36px; object-fit: contain; }
    .maint-icon {
      width: 46px; height: 46px; border-radius: 50%; background: rgba(245,158,11,.14);
      color: var(--warn); display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
    }
    .maint-icon i { width: 24px; height: 24px; }
    .maint-card h1 { font-size: 22px; font-weight: 800; margin: 0 0 10px; }
    .maint-card p { font-size: 14.5px; line-height: 1.6; color: var(--text2); margin: 0 0 6px; }
    .maint-sub { font-size: 12.5px !important; color: var(--text3) !important; margin-top: 18px !important; }
  </style>
</head>
<body>
  <div class="maint-card">
    <div class="maint-logo"><img src="/systems/presence-fire-safety/shared/assets/sc-icon-transparent-white.png" alt="SmartCore"/></div>
    <div class="maint-icon"><i data-lucide="wrench"></i></div>
    <h1>This kiosk is temporarily unavailable</h1>
    <p>SmartCore Technology is currently making improvements to this device. It'll be back to normal shortly — thanks for your patience.</p>
    <p class="maint-sub">If this is urgent, please sign in/out manually and let your site's fire marshal know.</p>
  </div>

  <script type="module">
    import { initIdleScreensaver } from "/systems/presence-fire-safety/shared/kiosk.js";
    import { initTheme } from "/systems/presence-fire-safety/shared/theme.js";

    initTheme();
    window.lucide?.createIcons?.();
    // Same idle screensaver as the working kiosk screens — this page is
    // still a public-facing device sitting on one screen for hours, so it
    // still needs the burn-in protection even while showing a maintenance
    // message instead of the sign-in UI.
    initIdleScreensaver({ idleMs: 60000, text: "SmartCore — under maintenance" });
  </script>
</body>
</html>
