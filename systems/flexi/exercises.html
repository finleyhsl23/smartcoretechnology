<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Exercise Library — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
<style>
.ex-video-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:0;overflow:hidden}
.ex-video-wrap iframe,.ex-video-wrap video{width:100%;height:100%;display:block;border:0}
.ex-video-toggle{display:flex;gap:8px;margin-bottom:12px}
.ex-video-toggle button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--fx-line);background:var(--fx-card2);color:var(--fx-text2);font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s}
.ex-video-toggle button:hover:not(.active){border-color:var(--fx-line-hi);color:var(--fx-text)}
.ex-video-toggle button.active{background:var(--fx-grad);border-color:transparent;color:#fff}
.ex-card-actions{display:flex;gap:8px;margin-top:10px}
.ex-file-hint{font-size:11.5px;color:var(--fx-text3)}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Exercise Library</h1><div class="fx-topbar-sub" id="countLabel"></div></div>
      <div class="fx-topbar-spacer"></div>
      <input class="fx-input" id="searchInput" placeholder="Search exercises…" style="max-width:200px"/>
      <select class="fx-select" id="categoryFilter" style="max-width:140px">
        <option value="">All categories</option>
        <option value="strength">Strength</option><option value="cardio">Cardio</option><option value="core">Core</option>
        <option value="mobility">Mobility</option><option value="plyometric">Plyometric</option><option value="other">Other</option>
      </select>
      <button class="fx-btn fx-btn-primary" id="addBtn">+ Add Exercise</button>
    </header>
    <main class="fx-content">
      <div class="fx-grid fx-grid-3" id="exGrid"></div>
    </main>
  </div>
</div>

<div class="fx-modal" id="addModal">
  <div class="fx-modal-box">
    <div class="fx-modal-head"><h3 id="modalTitle">Add Exercise</h3><button class="fx-modal-close" data-close>✕</button></div>
    <p class="fx-file-hint" id="cloneNotice" style="display:none;margin-bottom:12px">This is a built-in exercise — saving will create your own copy of it with the video attached.</p>
    <div class="fx-field"><label>Name</label><input class="fx-input" id="exName"/></div>
    <div class="fx-form-row">
      <div class="fx-field"><label>Category</label>
        <select class="fx-select" id="exCategory"><option value="strength">Strength</option><option value="cardio">Cardio</option><option value="core">Core</option><option value="mobility">Mobility</option><option value="plyometric">Plyometric</option><option value="other">Other</option></select>
      </div>
      <div class="fx-field"><label>Muscle group</label><input class="fx-input" id="exMuscle"/></div>
    </div>
    <div class="fx-field"><label>Equipment</label><input class="fx-input" id="exEquipment"/></div>
    <div class="fx-field"><label>Instructions</label><textarea class="fx-textarea" id="exInstructions"></textarea></div>

    <div class="fx-field">
      <label>Demo video</label>
      <div class="ex-video-toggle">
        <button type="button" id="videoModeYoutube" class="active">YouTube link</button>
        <button type="button" id="videoModeUpload">Upload a video</button>
      </div>
      <input class="fx-input" id="exVideoUrl" placeholder="https://youtube.com/watch?v=…"/>
      <input class="fx-input" id="exVideoFile" type="file" accept="video/*" capture="environment" style="display:none"/>
      <div class="fx-file-hint" id="videoHint">Paste a YouTube link, or switch to "Upload a video" to record/select a clip of yourself demonstrating it.</div>
    </div>

    <div class="fx-form-msg" id="exMsg"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="saveExBtn">Add Exercise</button>
  </div>
</div>

<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, escapeHtml, setLoading, showMessage, openModal, closeModal, toast, emptyState, tileGradient, enhanceSelect } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "exercises" });
renderNav({ activeKey: "exercises", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();
enhanceSelect(document.getElementById("categoryFilter"), { placeholder: "Search categories…" });

let all = [];
let editingId = null;   // exercise id being edited in place (owned by this company)
let cloningFrom = null; // built-in exercise id being cloned into a new company copy

function youtubeEmbedUrl(url) {
  const m = String(url || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : null;
}
function renderVideo(url) {
  if (!url) return "";
  const yt = youtubeEmbedUrl(url);
  return `<div class="ex-video-wrap">${yt ? `<iframe src="${yt}" allowfullscreen loading="lazy"></iframe>` : `<video src="${escapeHtml(url)}" controls preload="metadata"></video>`}</div>`;
}

async function load() {
  const { data } = await sb().from("smartcore_flexi_exercises").select("*").order("name");
  all = data || [];
  render();
}
function render() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const cat = document.getElementById("categoryFilter").value;
  // Once this company has its own clone of a built-in exercise (made via
  // "Add My Video"), the original built-in card is redundant — hide it
  // rather than showing both. The shared global row itself is untouched
  // (and can't be, by RLS) so other companies still see it fine.
  const clonedIds = new Set(all.filter(x => x.cloned_from_id).map(x => x.cloned_from_id));
  const visible = all.filter(x => !clonedIds.has(x.id));
  const rows = visible.filter(x => (!cat || x.category === cat) && (!q || x.name.toLowerCase().includes(q)));
  document.getElementById("countLabel").textContent = `${visible.length} exercises in your library`;
  const grid = document.getElementById("exGrid");
  grid.innerHTML = !rows.length ? emptyState("◒", "No exercises found", "") : rows.map(x => `
    <div class="fx-card fx-card-flush">
      ${x.video_url ? renderVideo(x.video_url) : `
        <div class="fx-tile" style="background:${tileGradient(x.id)};border-radius:0">
          <div class="fx-tile-eyebrow">${escapeHtml(x.category)}</div>
          <div class="fx-tile-title">${escapeHtml(x.name)}</div>
        </div>
      `}
      <div style="padding:16px">
        ${x.video_url ? `<strong style="font-size:14px">${escapeHtml(x.name)}</strong><div style="color:var(--fx-text3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-top:2px">${escapeHtml(x.category)}</div>` : ""}
        <div style="color:var(--fx-text3);font-size:12.5px;margin:8px 0">${escapeHtml(x.muscle_group || "")}${x.equipment ? " · " + escapeHtml(x.equipment) : ""}</div>
        <div style="font-size:12.5px;color:var(--fx-text2)">${escapeHtml(x.instructions || "")}</div>
        <div class="ex-card-actions">
          <button class="fx-btn fx-btn-sm" data-edit="${x.id}">${x.company_id ? "Edit" : "Add My Video"}</button>
          ${x.company_id ? `<button class="fx-btn fx-btn-sm fx-btn-danger" data-del="${x.id}">Delete</button>` : `<span class="fx-badge fx-badge-blue" style="align-self:center">Built-in</span>`}
        </div>
      </div>
    </div>
  `).join("");
  grid.querySelectorAll("[data-del]").forEach(btn => btn.addEventListener("click", async () => {
    if (!confirm("Delete this exercise?")) return;
    await sb().from("smartcore_flexi_exercises").delete().eq("id", btn.dataset.del);
    load();
  }));
  grid.querySelectorAll("[data-edit]").forEach(btn => btn.addEventListener("click", () => openEdit(all.find(x => x.id === btn.dataset.edit))));
}
document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("categoryFilter").addEventListener("change", render);

function resetForm() {
  ["exName","exMuscle","exEquipment","exInstructions","exVideoUrl"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("exCategory").value = "strength";
  document.getElementById("exVideoFile").value = "";
  setVideoMode("youtube");
  document.getElementById("cloneNotice").style.display = "none";
  document.getElementById("exMsg").textContent = "";
  enhanceSelect(document.getElementById("exCategory"));
}

function setVideoMode(mode) {
  const isUpload = mode === "upload";
  document.getElementById("videoModeYoutube").classList.toggle("active", !isUpload);
  document.getElementById("videoModeUpload").classList.toggle("active", isUpload);
  document.getElementById("exVideoUrl").style.display = isUpload ? "none" : "";
  document.getElementById("exVideoFile").style.display = isUpload ? "" : "none";
  document.getElementById("videoHint").textContent = isUpload
    ? "Record on your phone or pick a video file — it's uploaded privately and only your clients can view it."
    : "Paste a YouTube link, or switch to \"Upload a video\" to record/select a clip of yourself demonstrating it.";
}
document.getElementById("videoModeYoutube").addEventListener("click", () => setVideoMode("youtube"));
document.getElementById("videoModeUpload").addEventListener("click", () => setVideoMode("upload"));

document.getElementById("addBtn").addEventListener("click", () => {
  editingId = null; cloningFrom = null;
  resetForm();
  document.getElementById("modalTitle").textContent = "Add Exercise";
  document.getElementById("saveExBtn").textContent = "Add Exercise";
  openModal("addModal");
});

function openEdit(ex) {
  if (!ex) return;
  resetForm();
  document.getElementById("exName").value = ex.name || "";
  document.getElementById("exCategory").value = ex.category || "strength";
  enhanceSelect(document.getElementById("exCategory"));
  document.getElementById("exMuscle").value = ex.muscle_group || "";
  document.getElementById("exEquipment").value = ex.equipment || "";
  document.getElementById("exInstructions").value = ex.instructions || "";
  document.getElementById("exVideoUrl").value = youtubeEmbedUrl(ex.video_url || "") ? ex.video_url : "";
  if (ex.company_id) {
    editingId = ex.id; cloningFrom = null;
    document.getElementById("modalTitle").textContent = "Edit Exercise";
    document.getElementById("saveExBtn").textContent = "Save Changes";
  } else {
    editingId = null; cloningFrom = ex.id;
    document.getElementById("modalTitle").textContent = "Add My Video";
    document.getElementById("saveExBtn").textContent = "Save My Copy";
    document.getElementById("cloneNotice").style.display = "";
  }
  openModal("addModal");
}

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal("addModal")));

function normalizeExName(s) {
  return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}
function levenshtein(a, b) {
  const dp = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++) {
    for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[a.length][b.length];
}
function findSimilarExercises(name, excludeId) {
  const norm = normalizeExName(name);
  if (!norm) return [];
  return all.filter(x => {
    if (excludeId && x.id === excludeId) return false;
    const xNorm = normalizeExName(x.name);
    if (!xNorm) return false;
    if (xNorm === norm || xNorm.includes(norm) || norm.includes(xNorm)) return true;
    return levenshtein(xNorm, norm) <= 2;
  });
}

document.getElementById("saveExBtn").addEventListener("click", async (e) => {
  const name = document.getElementById("exName").value.trim();
  if (!name) { showMessage("exMsg", "Name is required.", "error"); return; }
  // Only warn when creating a genuinely new exercise — editing or cloning an
  // existing one obviously "matches" itself.
  if (!editingId && !cloningFrom) {
    const similar = findSimilarExercises(name);
    if (similar.length) {
      const list = similar.map(x => x.name).join(", ");
      const proceed = confirm(`The following exercises already exist: ${list}. Are you sure you want to make a new one?`);
      if (!proceed) return;
    }
  }
  const uploadMode = document.getElementById("videoModeUpload").classList.contains("active");
  const file = document.getElementById("exVideoFile").files[0];

  setLoading(e.target, true, "Saving…");
  const fields = {
    name,
    category: document.getElementById("exCategory").value,
    muscle_group: document.getElementById("exMuscle").value.trim() || null,
    equipment: document.getElementById("exEquipment").value.trim() || null,
    instructions: document.getElementById("exInstructions").value.trim() || null,
  };
  if (!uploadMode) {
    const url = document.getElementById("exVideoUrl").value.trim();
    if (url) fields.video_url = url;
  }

  try {
    let exerciseId = editingId;
    if (editingId) {
      const { error } = await sb().from("smartcore_flexi_exercises").update(fields).eq("id", editingId);
      if (error) throw error;
    } else {
      const { data, error } = await sb().from("smartcore_flexi_exercises").insert({
        ...fields, company_id: profile.company_id, created_by: profile.id,
        cloned_from_id: cloningFrom || null,
      }).select().single();
      if (error) throw error;
      exerciseId = data.id;
    }

    if (uploadMode && file) {
      const ext = (file.name.split(".").pop() || "mp4").toLowerCase();
      const path = `${profile.company_id}/exercises/${exerciseId}/${Date.now()}.${ext}`;
      const { error: upErr } = await sb().storage.from("flexi-media").upload(path, file, { upsert: true, contentType: file.type || "video/mp4" });
      if (upErr) throw upErr;
      const { data: signed, error: signErr } = await sb().storage.from("flexi-media").createSignedUrl(path, 60 * 60 * 24 * 365);
      if (signErr) throw signErr;
      await sb().from("smartcore_flexi_exercises").update({ video_url: signed.signedUrl }).eq("id", exerciseId);
    }
  } catch (err) {
    setLoading(e.target, false);
    showMessage("exMsg", err.message || "Something went wrong.", "error");
    return;
  }
  setLoading(e.target, false);
  closeModal("addModal");
  toast(editingId ? "Exercise updated" : "Exercise added", "success");
  load();
});
load();
</script>
</body>
</html>
