<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Locations — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Locations</h1><div class="fx-topbar-sub" id="countLabel">Sites your business trains clients from</div></div>
      <div class="fx-topbar-spacer"></div>
      <input class="fx-input" id="searchInput" placeholder="Search locations…" style="max-width:200px"/>
      <button class="fx-btn fx-btn-primary" id="addBtn">+ Add Location</button>
    </header>
    <main class="fx-content">
      <div class="fx-grid fx-grid-3" id="grid"></div>
    </main>
  </div>
</div>

<div class="fx-modal" id="addModal">
  <div class="fx-modal-box">
    <div class="fx-modal-head"><h3 id="locModalTitle">Add Location</h3><button class="fx-modal-close" data-close>✕</button></div>
    <div class="fx-field"><label>Name</label><input class="fx-input" id="locName" placeholder="e.g. City Centre Studio"/></div>
    <div class="fx-field"><label>Address line 1</label><input class="fx-input" id="locAddr1"/></div>
    <div class="fx-form-row">
      <div class="fx-field"><label>City</label><input class="fx-input" id="locCity"/></div>
      <div class="fx-field"><label>Postcode</label><input class="fx-input" id="locPostcode"/></div>
    </div>
    <label class="fx-checkbox-row" style="margin-bottom:14px"><input type="checkbox" id="locPrimary"/> Set as primary location</label>
    <div class="fx-form-msg" id="locMsg"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="saveLocBtn">Add Location</button>
  </div>
</div>

<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, escapeHtml, setLoading, showMessage, openModal, closeModal, toast, emptyState, tileGradient } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "locations" });
renderNav({ activeKey: "locations", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

let all = [];
let editingLocId = null;
function render() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const rows = all.filter(l => !q || l.name.toLowerCase().includes(q) || (l.city || "").toLowerCase().includes(q));
  document.getElementById("countLabel").textContent = `${all.length} location${all.length === 1 ? "" : "s"}`;
  const grid = document.getElementById("grid");
  grid.innerHTML = !rows.length ? emptyState("◇", "No locations found", "Add your first site above.") : rows.map(l => `
    <div class="fx-card fx-card-flush">
      <div class="fx-tile" style="background:${tileGradient(l.id)};border-radius:0">
        <svg class="fx-tile-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.9 7-11.4a7 7 0 1 0-14 0C5 15.1 12 21 12 21Z"/><circle cx="12" cy="9.7" r="2.5"/></svg>
        <div class="fx-tile-eyebrow">${l.is_primary ? "Primary site" : "Location"}</div>
        <div class="fx-tile-title">${escapeHtml(l.name)}</div>
      </div>
      <div style="padding:16px">
        <div style="color:var(--fx-text3);font-size:12.5px;margin-bottom:10px">${escapeHtml([l.address_line_1, l.city, l.postcode].filter(Boolean).join(", ") || "No address set")}</div>
        <div style="display:flex;gap:6px">
          <button class="fx-btn fx-btn-sm" data-edit-loc="${l.id}">Edit</button>
          <button class="fx-btn fx-btn-sm fx-btn-danger" data-del-loc="${l.id}">Delete</button>
        </div>
      </div>
    </div>
  `).join("");
  grid.querySelectorAll("[data-edit-loc]").forEach(btn => btn.addEventListener("click", () => openEdit(btn.dataset.editLoc)));
  grid.querySelectorAll("[data-del-loc]").forEach(btn => btn.addEventListener("click", async () => {
    if (!confirm("Delete this location? Clients and bookings referencing it will keep their history but lose the location link.")) return;
    const { error } = await sb().from("smartcore_flexi_locations").delete().eq("id", btn.dataset.delLoc);
    if (error) { toast(error.message, "error"); return; }
    toast("Location deleted", "success");
    load();
  }));
}
async function load() {
  const { data } = await sb().from("smartcore_flexi_locations").select("*").order("is_primary", { ascending: false });
  all = data || [];
  render();
}
document.getElementById("searchInput").addEventListener("input", render);

function resetLocForm() {
  ["locName","locAddr1","locCity","locPostcode"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("locPrimary").checked = false;
  document.getElementById("locMsg").textContent = "";
}
document.getElementById("addBtn").addEventListener("click", () => {
  editingLocId = null;
  resetLocForm();
  document.getElementById("locModalTitle").textContent = "Add Location";
  document.getElementById("saveLocBtn").textContent = "Add Location";
  openModal("addModal");
});
function openEdit(id) {
  const l = all.find(x => x.id === id);
  if (!l) return;
  editingLocId = id;
  document.getElementById("locName").value = l.name || "";
  document.getElementById("locAddr1").value = l.address_line_1 || "";
  document.getElementById("locCity").value = l.city || "";
  document.getElementById("locPostcode").value = l.postcode || "";
  document.getElementById("locPrimary").checked = !!l.is_primary;
  document.getElementById("locMsg").textContent = "";
  document.getElementById("locModalTitle").textContent = "Edit Location";
  document.getElementById("saveLocBtn").textContent = "Save Changes";
  openModal("addModal");
}
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal("addModal")));
document.getElementById("saveLocBtn").addEventListener("click", async (e) => {
  const name = document.getElementById("locName").value.trim();
  if (!name) { showMessage("locMsg", "Name is required.", "error"); return; }
  setLoading(e.target, true, editingLocId ? "Saving…" : "Adding…");
  const fields = {
    name,
    address_line_1: document.getElementById("locAddr1").value.trim() || null,
    city: document.getElementById("locCity").value.trim() || null,
    postcode: document.getElementById("locPostcode").value.trim() || null,
    is_primary: document.getElementById("locPrimary").checked,
  };
  const { error } = editingLocId
    ? await sb().from("smartcore_flexi_locations").update(fields).eq("id", editingLocId)
    : await sb().from("smartcore_flexi_locations").insert({ ...fields, company_id: profile.company_id });
  setLoading(e.target, false);
  if (error) { showMessage("locMsg", error.message, "error"); return; }
  closeModal("addModal");
  toast(editingLocId ? "Location updated" : "Location added", "success");
  load();
});

load();
</script>
</body>
</html>
