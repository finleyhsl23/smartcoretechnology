<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Dashboard — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
<style>
.dash-hero{
  position:relative;overflow:hidden;border-radius:20px;padding:26px 28px;margin-bottom:22px;
  background:linear-gradient(135deg,#ff7a45,#ff5a36,#ff3d7f);color:#fff;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:var(--fx-glow)
}
.dash-hero::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 85% -10%,rgba(255,255,255,.28),transparent 55%)}
.dash-hero-text{position:relative;flex:1;min-width:220px}
.dash-hero-text h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px;color:#fff}
.dash-hero-text div{color:rgba(255,255,255,.85);font-size:13px}
.dash-quick{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.dash-quick a{
  display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:11px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.16);color:#fff;text-decoration:none;backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.25);transition:background .15s,transform .15s
}
.dash-quick a:hover{background:rgba(255,255,255,.26);transform:translateY(-1px)}
.dash-quick svg{width:15px;height:15px}

.dash-stat{display:flex;align-items:center;gap:14px}
.dash-stat-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dash-stat-icon svg{width:20px;height:20px}
.dash-stat-body{min-width:0}
.dash-stat .fx-stat-label{margin-bottom:2px}

.dash-cols{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;align-items:start}
@media(max-width:900px){.dash-cols{grid-template-columns:1fr}}

.sched-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--fx-line);cursor:pointer;transition:background .15s;border-radius:8px}
.sched-row:hover{background:var(--fx-card2)}
.sched-row:last-child{border-bottom:none}
.sched-time{font-weight:800;font-size:13px;width:54px;flex-shrink:0}
.sched-body{flex:1;min-width:0}
.sched-body strong{font-size:13.5px}
.sched-loc{font-size:11.5px;color:var(--fx-text3)}

.feed-row{display:flex;align-items:center;gap:11px;padding:9px 0}
.feed-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;flex-shrink:0}
.feed-body{flex:1;min-width:0;font-size:12.5px}
.feed-time{font-size:11px;color:var(--fx-text3);flex-shrink:0}
</style>
</head>
<body>

<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Dashboard</h1><div class="fx-topbar-sub" id="todayLabel"></div></div>
    </header>
    <main class="fx-content">

      <div class="dash-hero">
        <div class="dash-hero-text">
          <h1 id="greeting">Welcome back</h1>
          <div id="heroSub">Here's what's happening today.</div>
        </div>
        <div class="dash-quick">
          <a href="clients.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add Client</a>
          <a href="calendar.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><line x1="3.5" y1="10" x2="20.5" y2="10"/></svg>Book Session</a>
          <a href="checkins.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.3l2.6 2.6L16.5 9"/></svg>Send Check-In</a>
          <a href="classes.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8.5" r="3"/><circle cx="16" cy="9" r="2.6"/></svg>Take Attendance</a>
        </div>
      </div>

      <div class="fx-grid fx-grid-4">
        <div class="fx-card dash-stat">
          <div class="dash-stat-icon" style="background:linear-gradient(135deg,#ff7a45,#ff3d7f)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c0-3.5 2.8-6.3 6.2-6.3s6.2 2.8 6.2 6.3"/><circle cx="17.5" cy="8.5" r="2.5"/><path d="M15.6 13.9c2.5.5 4.4 2.7 4.4 5.4"/></svg></div>
          <div class="dash-stat-body"><div class="fx-stat-label">Active Clients</div><div class="fx-stat-val fx-tabular" id="statClients">—</div></div>
        </div>
        <div class="fx-card dash-stat">
          <div class="dash-stat-icon" style="background:linear-gradient(135deg,#6366f1,#a855f7)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><line x1="3.5" y1="10" x2="20.5" y2="10"/></svg></div>
          <div class="dash-stat-body"><div class="fx-stat-label">Sessions Today</div><div class="fx-stat-val fx-tabular" id="statSessions">—</div></div>
        </div>
        <div class="fx-card dash-stat">
          <div class="dash-stat-icon" style="background:linear-gradient(135deg,#0ea5b7,#2563eb)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 5.5h15a1 1 0 0 1 1 1V16a1 1 0 0 1-1 1H9.8l-4.3 3.6V17H4.5a1 1 0 0 1-1-1V6.5a1 1 0 0 1 1-1Z"/></svg></div>
          <div class="dash-stat-body"><div class="fx-stat-label">Unread Messages</div><div class="fx-stat-val fx-tabular" id="statMessages">—</div></div>
        </div>
        <div class="fx-card dash-stat">
          <div class="dash-stat-icon" style="background:linear-gradient(135deg,#16a34a,#0d9488)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5 12 3 3 7.5v9L12 21l9-4.5v-9Z"/><path d="M3 7.5 12 12l9-4.5"/><line x1="12" y1="12" x2="12" y2="21"/></svg></div>
          <div class="dash-stat-body"><div class="fx-stat-label">Revenue This Month</div><div class="fx-stat-val fx-tabular" id="statRevenue">—</div></div>
        </div>
      </div>

      <div class="dash-cols" style="margin-top:8px">
        <div>
          <div class="fx-section-head">
            <h2>Today's Schedule</h2>
            <div class="fx-section-head-spacer"></div>
            <a href="calendar.html" class="fx-btn fx-btn-sm">Full Calendar →</a>
          </div>
          <div class="fx-card" id="scheduleCard"></div>
        </div>

        <div>
          <div class="fx-section-head"><h2>Recent Activity</h2></div>
          <div class="fx-card" id="activityCard">
            <div style="color:var(--fx-text3);font-size:13px">Loading…</div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, fmtMoney, fmtTime, fmtDateTime, escapeHtml, emptyState, animateNumber, tileGradient, initials } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "dashboard" });
renderNav({ activeKey: "dashboard", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

const firstName = (profile.full_name || "").split(" ")[0] || "there";
document.getElementById("greeting").textContent = `Welcome back, ${firstName}`;
document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
document.getElementById("heroSub").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

const todayStart = new Date(); todayStart.setHours(0,0,0,0);
const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);

const [{ count: clientCount }, { data: bookings }, { count: unread }, { data: payments }] = await Promise.all([
  sb().from("smartcore_flexi_clients").select("id", { count: "exact", head: true }).eq("status", "active"),
  sb().from("smartcore_flexi_bookings").select("*, smartcore_flexi_clients(full_name), smartcore_flexi_locations(name)")
    .gte("starts_at", todayStart.toISOString()).lte("starts_at", todayEnd.toISOString())
    .neq("status", "cancelled").order("starts_at"),
  sb().from("smartcore_flexi_messages").select("id", { count: "exact", head: true }).eq("sender_type", "client").is("read_at", null),
  sb().from("smartcore_flexi_payments").select("amount_pence").eq("status", "paid").gte("created_at", monthStart.toISOString()),
]);

animateNumber(document.getElementById("statClients"), clientCount ?? 0);
animateNumber(document.getElementById("statSessions"), (bookings || []).length);
animateNumber(document.getElementById("statMessages"), unread ?? 0);
const revenuePence = (payments || []).reduce((s, p) => s + (p.amount_pence || 0), 0);
animateNumber(document.getElementById("statRevenue"), revenuePence / 100, { format: n => fmtMoney(n * 100) });

const scheduleCard = document.getElementById("scheduleCard");
if (!bookings?.length) {
  scheduleCard.innerHTML = emptyState("📅", "Nothing scheduled today", "Book a session from the Calendar page.");
} else {
  scheduleCard.innerHTML = bookings.map(b => `
    <div class="sched-row" onclick="location.href='calendar.html'">
      <div class="sched-time fx-tabular">${fmtTime(b.starts_at)}</div>
      <div class="sched-body">
        <strong>${escapeHtml(b.smartcore_flexi_clients?.full_name || (b.session_type === "class" ? "Class" : "Session"))}</strong>
        ${b.session_type === "class" ? '<span class="fx-badge fx-badge-blue" style="margin-left:6px">class</span>' : ""}
        <div class="sched-loc">${escapeHtml(b.smartcore_flexi_locations?.name || "")}</div>
      </div>
      <span class="fx-badge ${b.status === "completed" ? "fx-badge-green" : "fx-badge-accent"}">${escapeHtml(b.status)}</span>
    </div>
  `).join("");
}

const { data: recentLogs } = await sb()
  .from("smartcore_flexi_workout_logs")
  .select("*, smartcore_flexi_clients(full_name)")
  .order("completed_at", { ascending: false })
  .limit(6);

const activityCard = document.getElementById("activityCard");
if (!recentLogs?.length) {
  activityCard.innerHTML = emptyState("📈", "No activity yet", "Client workout completions will show up here.");
} else {
  activityCard.innerHTML = recentLogs.map(l => {
    const name = l.smartcore_flexi_clients?.full_name || "A client";
    return `
    <div class="feed-row">
      <div class="feed-avatar" style="background:${tileGradient(l.client_id)}">${initials(name)}</div>
      <div class="feed-body"><strong>${escapeHtml(name)}</strong> completed a workout</div>
      <div class="feed-time">${fmtDateTime(l.completed_at)}</div>
    </div>
  `;
  }).join("");
}
</script>
</body>
</html>
