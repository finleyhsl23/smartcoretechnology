<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dashboard — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
</head>
<body>

<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div>
        <h1 id="greeting">Dashboard</h1>
        <div class="fx-topbar-sub" id="todayLabel"></div>
      </div>
    </header>
    <main class="fx-content">

      <div class="fx-grid fx-grid-4">
        <div class="fx-card fx-stat">
          <div class="fx-stat-label">Active Clients</div>
          <div class="fx-stat-val fx-tabular" id="statClients">—</div>
        </div>
        <div class="fx-card fx-stat">
          <div class="fx-stat-label">Sessions Today</div>
          <div class="fx-stat-val fx-tabular" id="statSessions">—</div>
        </div>
        <div class="fx-card fx-stat">
          <div class="fx-stat-label">Unread Messages</div>
          <div class="fx-stat-val fx-tabular" id="statMessages">—</div>
        </div>
        <div class="fx-card fx-stat">
          <div class="fx-stat-label">Revenue This Month</div>
          <div class="fx-stat-val fx-tabular" id="statRevenue">—</div>
        </div>
      </div>

      <div class="fx-section-head">
        <h2>Today's Schedule</h2>
        <div class="fx-section-head-spacer"></div>
        <a href="calendar.html" class="fx-btn fx-btn-sm">Full Calendar →</a>
      </div>
      <div class="fx-table-wrap">
        <table class="fx-table" id="scheduleTable">
          <thead><tr><th>Time</th><th>Client</th><th>Type</th><th>Location</th><th>Status</th></tr></thead>
          <tbody id="scheduleBody"><tr><td colspan="5" style="text-align:center;color:var(--fx-text3);padding:24px">Loading…</td></tr></tbody>
        </table>
      </div>

      <div class="fx-section-head">
        <h2>Recent Client Activity</h2>
      </div>
      <div class="fx-card" id="activityCard">
        <div style="color:var(--fx-text3);font-size:13px">Loading…</div>
      </div>

    </main>
  </div>
</div>

<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, fmtMoney, fmtTime, fmtDateTime, escapeHtml, emptyState } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "dashboard" });
renderNav({ activeKey: "dashboard", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

document.getElementById("greeting").textContent = `Welcome back, ${(profile.full_name || "").split(" ")[0] || "there"}`;
document.getElementById("todayLabel").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });

const todayStart = new Date(); todayStart.setHours(0,0,0,0);
const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);
const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);

const [{ count: clientCount }, { data: bookings }, { count: unread }, { data: payments }] = await Promise.all([
  sb().from("smartcore_flexi_clients").select("id", { count: "exact", head: true }).eq("status", "active"),
  sb().from("smartcore_flexi_bookings").select("*, smartcore_flexi_clients(full_name), smartcore_flexi_locations(name)")
    .gte("starts_at", todayStart.toISOString()).lte("starts_at", todayEnd.toISOString())
    .neq("status", "cancelled").order("starts_at"),
  sb().from("smartcore_flexi_messages").select("id", { count: "exact", head: true }).eq("sender_type", "client").is("read_at", null),
  sb().from("smartcore_flexi_payments").select("amount_pence").eq("status", "paid").gte("created_at", monthStart.toISOString()),
]);

document.getElementById("statClients").textContent = clientCount ?? 0;
document.getElementById("statSessions").textContent = (bookings || []).length;
document.getElementById("statMessages").textContent = unread ?? 0;
document.getElementById("statRevenue").textContent = fmtMoney((payments || []).reduce((s, p) => s + (p.amount_pence || 0), 0));

const scheduleBody = document.getElementById("scheduleBody");
if (!bookings?.length) {
  scheduleBody.innerHTML = `<tr><td colspan="5">${emptyState("📅", "Nothing scheduled today", "Book a session from the Calendar page.")}</td></tr>`;
} else {
  scheduleBody.innerHTML = bookings.map(b => `
    <tr onclick="location.href='calendar.html'">
      <td class="fx-tabular">${fmtTime(b.starts_at)}</td>
      <td>${escapeHtml(b.smartcore_flexi_clients?.full_name || "—")}</td>
      <td><span class="fx-badge ${b.session_type === "class" ? "fx-badge-blue" : "fx-badge-grey"}">${b.session_type === "class" ? "Class" : "1:1"}</span></td>
      <td>${escapeHtml(b.smartcore_flexi_locations?.name || "—")}</td>
      <td><span class="fx-badge ${b.status === "completed" ? "fx-badge-green" : "fx-badge-accent"}">${escapeHtml(b.status)}</span></td>
    </tr>
  `).join("");
}

const { data: recentLogs } = await sb()
  .from("smartcore_flexi_workout_logs")
  .select("*, smartcore_flexi_clients(full_name)")
  .order("completed_at", { ascending: false })
  .limit(6);

const activityCard = document.getElementById("activityCard");
if (!recentLogs?.length) {
  activityCard.innerHTML = emptyState("📈", "No activity yet", "Client workout completions will show up here.");
} else {
  activityCard.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">` + recentLogs.map(l => `
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px">
      <span><strong>${escapeHtml(l.smartcore_flexi_clients?.full_name || "A client")}</strong> completed a workout</span>
      <span style="color:var(--fx-text3);font-size:12px">${fmtDateTime(l.completed_at)}</span>
    </div>
  `).join("") + `</div>`;
}
</script>
</body>
</html>
