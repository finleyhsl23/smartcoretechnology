<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Waivers — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
<style>
.waiver-card{position:relative;transition:box-shadow .2s}
.waiver-card.glow-active{box-shadow:0 0 0 1px rgba(22,163,74,.55),0 0 14px rgba(13,148,136,.22)}
.wv-section-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.wv-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:8px;cursor:pointer;transition:background .15s}
.wv-row:hover{background:var(--fx-card2)}
.wv-row-name{font-size:13px;font-weight:700}
.wv-row-sub{font-size:11.5px;color:var(--fx-text3)}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Waivers &amp; PAR-Q</h1><div class="fx-topbar-sub">Digital liability &amp; health-screening forms</div></div>
      <div class="fx-topbar-spacer"></div>
      <input class="fx-input" id="searchInput" placeholder="Search waivers…" style="max-width:200px"/>
      <button class="fx-btn fx-btn-primary" id="addBtn">+ New Waiver</button>
    </header>
    <main class="fx-content">
      <div id="list"></div>
    </main>
  </div>
</div>

<div class="fx-modal" id="addModal">
  <div class="fx-modal-box">
    <div class="fx-modal-head"><h3>New Waiver</h3><button class="fx-modal-close" data-close>✕</button></div>
    <div class="fx-field"><label>Title</label><input class="fx-input" id="wTitle" placeholder="e.g. PAR-Q Health Screening"/></div>
    <div class="fx-field"><label>Body text</label><textarea class="fx-textarea" id="wBody" style="min-height:140px" placeholder="Paste your waiver/liability/PAR-Q text here…"></textarea></div>
    <div class="fx-form-msg" id="wMsg"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="saveWBtn">Create Waiver</button>
  </div>
</div>

<div class="fx-modal" id="waiverListModal">
  <div class="fx-modal-box" style="max-width:460px">
    <div class="fx-modal-head"><h3 id="waiverListTitle">Waiver</h3><button class="fx-modal-close" data-close-list>✕</button></div>
    <div id="waiverListBody"></div>
  </div>
</div>

<div class="fx-modal" id="signatureModal">
  <div class="fx-modal-box" style="max-width:380px">
    <div class="fx-modal-head"><h3 id="sigModalTitle">Signature</h3><button class="fx-modal-close" data-close-sig>✕</button></div>
    <img id="sigModalImg" src="" alt="Signature" style="width:100%;background:#fff;border-radius:10px;border:1px solid var(--fx-line)"/>
  </div>
</div>

<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, escapeHtml, setLoading, showMessage, openModal, closeModal, toast, emptyState, initials, fmtDate } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "waivers" });
renderNav({ activeKey: "waivers", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

let allWaivers = [];
async function load() {
  const { data: waivers } = await sb().from("smartcore_flexi_waivers").select("*").order("created_at", { ascending: false });
  allWaivers = waivers || [];
  render();
}
async function render() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const waivers = !q ? allWaivers : allWaivers.filter(w => w.title.toLowerCase().includes(q));
  const { count: totalClients } = await sb().from("smartcore_flexi_clients").select("id", { count: "exact", head: true }).eq("status", "active");

  const list = document.getElementById("list");
  if (!allWaivers.length) { list.innerHTML = emptyState("📝", "No waivers yet", "Create your first waiver above."); return; }
  if (!waivers.length) { list.innerHTML = emptyState("📝", "No waivers match", ""); return; }

  const cards = await Promise.all(waivers.map(async w => {
    const { count: signed } = await sb().from("smartcore_flexi_waiver_signatures").select("id", { count: "exact", head: true }).eq("waiver_id", w.id);
    const pct = totalClients ? Math.min(100, Math.round(((signed || 0) / totalClients) * 100)) : 0;
    return `
      <div class="fx-card waiver-card ${w.active ? "glow-active" : ""}" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
          <div>
            <strong>${escapeHtml(w.title)}</strong>
            <p style="color:var(--fx-text3);font-size:12.5px;margin-top:6px;max-width:60ch">${escapeHtml((w.body || "").slice(0, 160))}${w.body?.length > 160 ? "…" : ""}</p>
          </div>
          <span class="fx-badge ${w.active ? "fx-badge-green" : "fx-badge-grey"}">${w.active ? "active" : "inactive"}</span>
        </div>
        <div class="fx-progress-track" style="margin-top:12px"><div class="fx-progress-fill" style="width:${pct}%"></div></div>
        <div style="margin-top:6px;font-size:12.5px;color:var(--fx-text2)">${signed || 0} of ${totalClients || 0} active clients signed</div>
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="fx-btn fx-btn-sm" data-list="${w.id}">View List</button>
          <button class="fx-btn fx-btn-sm" data-toggle="${w.id}" data-active="${w.active}">${w.active ? "Deactivate" : "Reactivate"}</button>
        </div>
      </div>
    `;
  }));
  list.innerHTML = cards.join("");
  list.querySelectorAll("[data-toggle]").forEach(btn => btn.addEventListener("click", async () => {
    await sb().from("smartcore_flexi_waivers").update({ active: btn.dataset.active !== "true" }).eq("id", btn.dataset.toggle);
    load();
  }));
  list.querySelectorAll("[data-list]").forEach(btn => btn.addEventListener("click", () => {
    openWaiverList(allWaivers.find(w => w.id === btn.dataset.list));
  }));
}

document.querySelectorAll("[data-close-list]").forEach(b => b.addEventListener("click", () => closeModal("waiverListModal")));
document.querySelectorAll("[data-close-sig]").forEach(b => b.addEventListener("click", () => closeModal("signatureModal")));

function openSignature(url, name) {
  document.getElementById("sigModalTitle").textContent = name || "Signature";
  document.getElementById("sigModalImg").src = url;
  openModal("signatureModal");
}

function waiverListRow(client, sig) {
  return `
    <div class="wv-row" data-goto="${client.id}">
      <div class="fx-avatar" style="width:30px;height:30px;font-size:11px">${initials(client.full_name)}</div>
      <div style="flex:1;min-width:0">
        <div class="wv-row-name">${escapeHtml(client.full_name)}</div>
        ${sig ? `<div class="wv-row-sub">Signed ${fmtDate(sig.signed_at)}</div>` : ""}
      </div>
      ${sig?.signature_image_url ? `<button type="button" class="fx-btn fx-btn-sm" data-view-sig="${escapeHtml(sig.signature_image_url)}" data-sig-name="${escapeHtml(sig.signature_name || client.full_name)}">View</button>` : ""}
    </div>
  `;
}

document.getElementById("waiverListBody").addEventListener("click", (e) => {
  const viewBtn = e.target.closest("[data-view-sig]");
  if (viewBtn) { e.stopPropagation(); openSignature(viewBtn.dataset.viewSig, viewBtn.dataset.sigName); return; }
  const row = e.target.closest("[data-goto]");
  if (row) location.href = `client-detail.html?id=${row.dataset.goto}`;
});

async function openWaiverList(waiver) {
  if (!waiver) return;
  document.getElementById("waiverListTitle").textContent = waiver.title;
  const body = document.getElementById("waiverListBody");
  body.innerHTML = `<div style="text-align:center;padding:20px;color:var(--fx-text3)">Loading…</div>`;
  openModal("waiverListModal");

  const [{ data: clients }, { data: sigs }] = await Promise.all([
    sb().from("smartcore_flexi_clients").select("id, full_name").eq("status", "active").order("full_name"),
    sb().from("smartcore_flexi_waiver_signatures").select("client_id, signed_at, signature_image_url, signature_name").eq("waiver_id", waiver.id),
  ]);

  const sigByClient = new Map((sigs || []).map(s => [s.client_id, s]));
  const signedClients = (clients || []).filter(c => sigByClient.has(c.id));
  const notSignedClients = (clients || []).filter(c => !sigByClient.has(c.id));

  body.innerHTML = `
    <div style="margin-bottom:18px">
      <div class="wv-section-label" style="color:var(--fx-green)">Signed (${signedClients.length})</div>
      ${signedClients.length ? signedClients.map(c => waiverListRow(c, sigByClient.get(c.id))).join("") : `<div class="wv-row-sub">No one yet.</div>`}
    </div>
    <div>
      <div class="wv-section-label" style="color:var(--fx-red)">Not Signed (${notSignedClients.length})</div>
      ${notSignedClients.length ? notSignedClients.map(c => waiverListRow(c, null)).join("") : `<div class="wv-row-sub">Everyone's signed 🎉</div>`}
    </div>
  `;
}
document.getElementById("searchInput").addEventListener("input", render);

document.getElementById("addBtn").addEventListener("click", () => { document.getElementById("wMsg").textContent = ""; openModal("addModal"); });
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal("addModal")));
document.getElementById("saveWBtn").addEventListener("click", async (e) => {
  const title = document.getElementById("wTitle").value.trim();
  const body = document.getElementById("wBody").value.trim();
  if (!title || !body) { showMessage("wMsg", "Title and body are required.", "error"); return; }
  setLoading(e.target, true, "Creating…");
  const { error } = await sb().from("smartcore_flexi_waivers").insert({ company_id: profile.company_id, title, body });
  setLoading(e.target, false);
  if (error) { showMessage("wMsg", error.message, "error"); return; }
  closeModal("addModal");
  toast("Waiver created", "success");
  load();
});

load();
</script>
</body>
</html>
