<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Classes — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Group Classes</h1><div class="fx-topbar-sub">Scheduled classes &amp; booked seats</div></div>
      <div class="fx-topbar-spacer"></div>
      <button class="fx-btn fx-btn-primary" id="addBtn">+ Schedule Class</button>
    </header>
    <main class="fx-content">
      <div class="fx-grid fx-grid-3" id="classGrid"></div>
    </main>
  </div>
</div>

<div class="fx-modal" id="addModal">
  <div class="fx-modal-box">
    <div class="fx-modal-head"><h3>Schedule Class</h3><button class="fx-modal-close" data-close>✕</button></div>
    <div class="fx-field"><label>Class name</label><input class="fx-input" id="clsName" placeholder="e.g. Saturday Bootcamp"/></div>
    <div class="fx-form-row">
      <div class="fx-field"><label>Starts</label><input class="fx-input" id="clsStart" type="datetime-local"/></div>
      <div class="fx-field"><label>Duration (min)</label><input class="fx-input" id="clsDuration" type="number" value="45"/></div>
    </div>
    <div class="fx-field"><label>Capacity</label><input class="fx-input" id="clsCapacity" type="number" value="12"/></div>
    <div class="fx-form-msg" id="clsMsg"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="saveClsBtn">Schedule</button>
  </div>
</div>

<div class="fx-modal" id="attendModal">
  <div class="fx-modal-box">
    <div class="fx-modal-head"><h3 id="attendTitle">Attendance</h3><button class="fx-modal-close" data-close-attend>✕</button></div>
    <div id="attendList"></div>
  </div>
</div>

<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, escapeHtml, fmtDateTime, setLoading, showMessage, openModal, closeModal, toast, emptyState, tileGradient } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "classes" });
renderNav({ activeKey: "classes", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

async function load() {
  const { data: sessions } = await sb().from("smartcore_flexi_class_sessions").select("*").gte("starts_at", new Date(Date.now() - 86400000).toISOString()).order("starts_at");
  const grid = document.getElementById("classGrid");
  if (!sessions?.length) { grid.innerHTML = emptyState("◫", "No classes scheduled", "Schedule your first class above."); return; }

  const counts = {};
  for (const s of sessions) {
    const { count } = await sb().from("smartcore_flexi_bookings").select("id", { count: "exact", head: true }).eq("class_session_id", s.id).eq("status", "confirmed");
    counts[s.id] = count || 0;
  }

  grid.innerHTML = sessions.map(s => `
    <div class="fx-card fx-card-flush">
      <div class="fx-tile" style="background:${tileGradient(s.id)};border-radius:0">
        <svg class="fx-tile-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8.5" r="3"/><circle cx="16" cy="9" r="2.6"/><path d="M2.8 20.2c0-3.3 2.6-5.9 5.7-5.9s5.7 2.6 5.7 5.9"/><path d="M14.6 15c2.4.4 4.2 2.5 4.2 5"/></svg>
        <div class="fx-tile-eyebrow">${fmtDateTime(s.starts_at)}</div>
        <div class="fx-tile-title">${escapeHtml(s.name)}</div>
      </div>
      <div style="padding:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span class="fx-badge ${s.status === "cancelled" ? "fx-badge-red" : "fx-badge-accent"}">${s.status}</span>
          <span class="fx-tabular" style="font-size:12.5px;color:var(--fx-text2)">${counts[s.id]} / ${s.capacity} booked</span>
        </div>
        <div class="fx-progress-track"><div class="fx-progress-fill" style="width:${Math.min(100, (counts[s.id]/s.capacity)*100)}%"></div></div>
        <div style="display:flex;gap:8px;margin-top:12px">
          <button class="fx-btn fx-btn-sm fx-btn-primary" data-attend="${s.id}" data-name="${escapeHtml(s.name)}">Take Attendance</button>
          ${s.status === "scheduled" ? `<button class="fx-btn fx-btn-sm fx-btn-danger" data-cancel="${s.id}">Cancel Class</button>` : ""}
        </div>
      </div>
    </div>
  `).join("");

  grid.querySelectorAll("[data-cancel]").forEach(btn => btn.addEventListener("click", async () => {
    if (!confirm("Cancel this class?")) return;
    await sb().from("smartcore_flexi_class_sessions").update({ status: "cancelled" }).eq("id", btn.dataset.cancel);
    load();
  }));
  grid.querySelectorAll("[data-attend]").forEach(btn => btn.addEventListener("click", () => openAttendance(btn.dataset.attend, btn.dataset.name)));
}

async function openAttendance(sessionId, name) {
  document.getElementById("attendTitle").textContent = `Attendance — ${name}`;
  const list = document.getElementById("attendList");
  list.innerHTML = `<p style="color:var(--fx-text3);font-size:13px">Loading…</p>`;
  openModal("attendModal");
  const { data: bookings } = await sb().from("smartcore_flexi_bookings")
    .select("*, smartcore_flexi_clients(full_name)")
    .eq("class_session_id", sessionId).neq("status", "cancelled").order("created_at");
  list.innerHTML = !bookings?.length
    ? `<p style="color:var(--fx-text3);font-size:13px;padding:8px 0">No one has booked this class yet.</p>`
    : bookings.map(b => `
      <label class="fx-card" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer">
        <input type="checkbox" data-attend-booking="${b.id}" ${b.attended ? "checked" : ""}/>
        <span style="flex:1">${escapeHtml(b.smartcore_flexi_clients?.full_name || "—")}</span>
        <span class="fx-badge ${b.attended ? "fx-badge-green" : "fx-badge-grey"}" data-attend-badge="${b.id}">${b.attended ? "Attended" : "Not yet"}</span>
      </label>
    `).join("");
  list.querySelectorAll("[data-attend-booking]").forEach(cb => cb.addEventListener("change", async () => {
    const id = cb.dataset.attendBooking;
    const attended = cb.checked;
    const { error } = await sb().from("smartcore_flexi_bookings").update({
      attended, attended_at: attended ? new Date().toISOString() : null,
      status: attended ? "completed" : "confirmed",
    }).eq("id", id);
    if (error) { toast(error.message, "error"); cb.checked = !attended; return; }
    const badge = list.querySelector(`[data-attend-badge="${id}"]`);
    badge.textContent = attended ? "Attended" : "Not yet";
    badge.className = `fx-badge ${attended ? "fx-badge-green" : "fx-badge-grey"}`;
  }));
}

document.getElementById("addBtn").addEventListener("click", () => { document.getElementById("clsMsg").textContent = ""; openModal("addModal"); });
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal("addModal")));
document.querySelectorAll("[data-close-attend]").forEach(b => b.addEventListener("click", () => closeModal("attendModal")));
document.getElementById("saveClsBtn").addEventListener("click", async (e) => {
  const name = document.getElementById("clsName").value.trim();
  const start = document.getElementById("clsStart").value;
  if (!name || !start) { showMessage("clsMsg", "Name and start time are required.", "error"); return; }
  const starts_at = new Date(start);
  const ends_at = new Date(starts_at.getTime() + (parseInt(document.getElementById("clsDuration").value) || 45) * 60000);
  setLoading(e.target, true, "Scheduling…");
  const { error } = await sb().from("smartcore_flexi_class_sessions").insert({
    company_id: profile.company_id, trainer_id: profile.id, name,
    starts_at: starts_at.toISOString(), ends_at: ends_at.toISOString(),
    capacity: parseInt(document.getElementById("clsCapacity").value) || 12,
  });
  setLoading(e.target, false);
  if (error) { showMessage("clsMsg", error.message, "error"); return; }
  closeModal("addModal");
  toast("Class scheduled", "success");
  load();
});

load();
</script>
</body>
</html>
