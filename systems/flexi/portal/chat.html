<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chat — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
<style>
/* Below the desktop breakpoint, chat behaves like a real app frame — fixed
   top and bottom, message thread scrolling in between — instead of the
   normal scrolling-page layout every other portal page uses. At and above
   the desktop breakpoint we deliberately touch nothing on #fxApp/.fx-portal-tabs
   so chat inherits the exact same sidebar-grid shell as every other portal
   page; only .fx-chat-shell opts into the shared "content" grid area. */
@media(max-width:759px){
  #fxApp.fx-portal{display:flex;flex-direction:column;height:100dvh;min-height:100dvh;padding-bottom:0}
  .fx-portal-top{flex-shrink:0}
  .fx-chat-shell{flex:1;display:flex;flex-direction:column;min-height:0}
  .fx-portal-tabs{position:static;max-width:none;border-radius:0}
}
.fx-chat-messages{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.fx-chat-row{display:flex;gap:8px;align-items:flex-end}
.fx-chat-row.mine{flex-direction:row-reverse}
.fx-bubble{max-width:78%}
.fx-chat-input-row{flex-shrink:0;padding:12px 16px;border-top:1px solid var(--fx-line);display:flex;gap:10px;background:var(--fx-card)}
.fx-chat-input-row .fx-input{flex:1;border-radius:99px;padding:12px 18px}
.fx-chat-send{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.fx-chat-send svg{width:19px;height:19px}
@media(min-width:760px){
  .fx-chat-shell{grid-area:content;display:flex;flex-direction:column;min-height:0;padding:0}
  .fx-chat-messages{padding:24px 36px}
  .fx-chat-input-row{padding:16px 32px}
}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top"><div style="flex:1"><h1>Chat</h1></div><button class="fx-icon-btn" id="themeToggle">🌙</button></div>
  <div class="fx-chat-shell">
    <div class="fx-chat-messages" id="chatMessages"></div>
    <div class="fx-chat-input-row">
      <input class="fx-input" id="chatInput" placeholder="Message your trainer…"/>
      <button class="fx-btn fx-btn-primary fx-chat-send" id="sendBtn" title="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="M13 5l7 7-7 7"/></svg></button>
    </div>
  </div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab active" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<script type="module">
import { requireClientAccess, api } from "../shared/client-auth.js";
import { revealApp, setupThemeToggle, escapeHtml, fmtDateTime, toast, emptyState } from "../shared/ui.js";

const client = await requireClientAccess();
setupThemeToggle();
revealApp();

async function load() {
  const { messages } = await api("messages");
  const el = document.getElementById("chatMessages");
  el.innerHTML = !messages?.length ? emptyState("💬", "Say hello to your trainer", "") : messages.map(m => {
    const mine = m.sender_type === "client";
    return `
    <div class="fx-chat-row ${mine ? "mine" : ""}">
      ${!mine ? `<div class="fx-avatar" style="width:28px;height:28px;font-size:11px;background:var(--fx-grad);flex-shrink:0">T</div>` : ""}
      <div class="fx-bubble ${mine ? "fx-bubble-mine" : "fx-bubble-theirs"}">
        ${escapeHtml(m.body)}
        <div class="fx-bubble-meta">${fmtDateTime(m.created_at)}${mine ? ` · ${m.read_at ? "Read" : "Sent"}` : ""}</div>
      </div>
    </div>`;
  }).join("");
  el.scrollTop = el.scrollHeight;
}

document.getElementById("sendBtn").addEventListener("click", send);
document.getElementById("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
async function send() {
  const input = document.getElementById("chatInput");
  const body = input.value.trim();
  if (!body) return;
  input.value = "";
  try { await api("send_message", { body }); } catch (e) { toast(e.message, "error"); return; }
  load();
}

load();
</script>
</body>
</html>
