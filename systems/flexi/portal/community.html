<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Community — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top">
    <a href="dashboard.html" class="fx-icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none">←</a>
    <div style="flex:1"><h1>Community</h1></div>
    <button class="fx-icon-btn" id="themeToggle">🌙</button>
  </div>
  <div class="fx-portal-content">
    <div class="fx-section-head" style="margin-top:0"><h2 style="font-size:14px">Challenges</h2></div>
    <div id="challenges" style="margin-bottom:24px"></div>

    <div class="fx-section-head"><h2 style="font-size:14px">Updates</h2></div>
    <div class="fx-card" style="margin-bottom:14px">
      <textarea class="fx-textarea" id="postBody" placeholder="Share something with the group…" style="min-height:50px;margin-bottom:10px"></textarea>
      <button class="fx-btn fx-btn-primary fx-btn-block" id="postBtn">Post</button>
    </div>
    <div id="posts"></div>
  </div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<script type="module">
import { requireClientAccess, api, applyPortalFeatureGating } from "../shared/client-auth.js";
import { revealApp, setupThemeToggle, escapeHtml, fmtDateTime, fmtDate, toast, emptyState } from "../shared/ui.js";

const client = await requireClientAccess();
applyPortalFeatureGating(client.disabled_features);
setupThemeToggle();
revealApp();

async function loadChallenges() {
  const { challenges } = await api("challenges_list");
  const el = document.getElementById("challenges");
  if (!challenges?.length) { el.innerHTML = emptyState("🏆", "No challenges running", ""); return; }

  const blocks = challenges.map(ch => {
    const entries = ch.entries || [];
    const mine = entries.find(e => e.client_id === client.id);
    return `
      <div class="fx-card fx-card-accent" style="margin-bottom:12px">
        <strong>${escapeHtml(ch.name)}</strong>
        <div style="color:var(--fx-text3);font-size:11.5px;margin:2px 0 10px">${fmtDate(ch.start_date)} – ${ch.end_date ? fmtDate(ch.end_date) : "ongoing"}</div>
        ${(entries || []).slice(0,5).map((e,i) => `
          <div style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0;${e.client_id === client.id ? "font-weight:700;color:var(--fx-accent)" : ""}">
            <span>${i+1}. ${escapeHtml(e.smartcore_flexi_clients?.full_name || "—")}</span><span class="fx-tabular">${e.value} ${escapeHtml(ch.metric_label)}</span>
          </div>
        `).join("") || `<p style="color:var(--fx-text3);font-size:12px">No entries yet — be the first!</p>`}
        <div style="display:flex;gap:8px;margin-top:10px">
          <input class="fx-input" type="number" placeholder="Your ${ch.metric_label}" data-entry-input="${ch.id}" value="${mine?.value ?? ""}"/>
          <button class="fx-btn fx-btn-sm fx-btn-primary" data-entry-save="${ch.id}">Update</button>
        </div>
      </div>
    `;
  });
  el.innerHTML = blocks.join("");
  el.querySelectorAll("[data-entry-save]").forEach(btn => btn.addEventListener("click", async () => {
    const chId = btn.dataset.entrySave;
    const value = parseFloat(el.querySelector(`[data-entry-input="${chId}"]`).value) || 0;
    try { await api("update_challenge_entry", { challenge_id: chId, value }); } catch (e) { toast(e.message, "error"); return; }
    toast("Updated", "success");
    loadChallenges();
  }));
}

async function loadPosts() {
  const { posts } = await api("community_posts");
  const el = document.getElementById("posts");
  el.innerHTML = !posts?.length ? emptyState("💬", "No posts yet", "") : posts.map(p => `
    <div class="fx-card fx-card-accent" style="margin-bottom:8px">
      <div style="font-size:12px;font-weight:700;margin-bottom:4px">${escapeHtml(p.core_employees?.full_name || p.smartcore_flexi_clients?.full_name || "Someone")}</div>
      <div style="font-size:13px">${escapeHtml(p.body)}</div>
      <div style="font-size:11px;color:var(--fx-text3);margin-top:6px">${fmtDateTime(p.created_at)}</div>
    </div>
  `).join("");
}

document.getElementById("postBtn").addEventListener("click", async () => {
  const body = document.getElementById("postBody").value.trim();
  if (!body) return;
  try { await api("post_community", { body }); } catch (e) { toast(e.message, "error"); return; }
  document.getElementById("postBody").value = "";
  loadPosts();
});

loadChallenges();
loadPosts();
</script>
</body>
</html>
