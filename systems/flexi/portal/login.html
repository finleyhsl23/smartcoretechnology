<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Sign In — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
<style>
.step{display:none}
.step.active{display:block}
.code-chip{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:2px;background:var(--fx-accent-dim);color:var(--fx-accent-d);padding:8px 14px;border-radius:99px;margin-bottom:20px}
.code-chip button{background:none;border:none;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline;letter-spacing:normal;font-size:11px;padding:0}
</style>
</head>
<body>
<div style="max-width:380px;margin:0 auto;padding:80px 20px">
  <div style="text-align:center;margin-bottom:28px">
    <div style="width:44px;height:44px;border-radius:12px;background:var(--fx-grad);box-shadow:var(--fx-glow);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin:0 auto 12px">F</div>
    <h1 style="font-size:20px">Sign in to Flexi</h1>
    <p style="color:var(--fx-text3);font-size:13px;margin-top:6px" id="subtitle">Your training, in your pocket.</p>
  </div>

  <!-- Step 1: trainer code -->
  <div class="step active" id="step1">
    <div class="fx-card">
      <div class="fx-field"><label>Trainer code</label><input class="fx-input" id="trainerCode" placeholder="e.g. K7M2XQ" style="text-transform:uppercase;letter-spacing:2px;font-weight:700"/>
        <div class="fx-hint">Given to you by your trainer, in your welcome email.</div>
      </div>
      <div class="fx-form-msg" id="step1Msg"></div>
      <button class="fx-btn fx-btn-primary fx-btn-block" id="continueBtn">Continue</button>
    </div>
  </div>

  <!-- Step 2: email + passcode -->
  <div class="step" id="step2">
    <div class="code-chip"><span id="codeDisplay"></span><button id="changeCodeBtn">Change</button></div>
    <div class="fx-card">
      <div class="fx-field"><label>Email</label><input class="fx-input" id="email" type="email" autocomplete="email"/></div>
      <div class="fx-field"><label>Passcode</label><input class="fx-input" id="passcode" placeholder="5-character code" style="text-transform:uppercase;letter-spacing:2px;font-weight:700" autocomplete="one-time-code"/>
        <div class="fx-hint">The 5-character code your trainer emailed you.</div>
      </div>
      <div class="fx-form-msg" id="step2Msg"></div>
      <button class="fx-btn fx-btn-primary fx-btn-block" id="loginBtn">Sign In</button>
    </div>
  </div>

  <p style="text-align:center;font-size:12.5px;color:var(--fx-text3);margin-top:16px">No account? Ask your trainer to add you — you'll get an email with everything you need.</p>
</div>

<script type="module">
import { storeSession, getToken } from "../shared/client-auth.js";
import { setLoading, showMessage } from "../shared/ui.js";

if (getToken()) window.location.replace("dashboard.html");

let trainerCode = "";

function goToStep2() {
  const code = document.getElementById("trainerCode").value.trim().toUpperCase();
  if (!code) { showMessage("step1Msg", "Enter your trainer code.", "error"); return; }
  trainerCode = code;
  document.getElementById("codeDisplay").textContent = code;
  document.getElementById("step1").classList.remove("active");
  document.getElementById("step2").classList.add("active");
  document.getElementById("subtitle").textContent = "Now sign in with your email and passcode.";
  document.getElementById("email").focus();
}

document.getElementById("continueBtn").addEventListener("click", goToStep2);
document.getElementById("trainerCode").addEventListener("keydown", e => { if (e.key === "Enter") goToStep2(); });

document.getElementById("changeCodeBtn").addEventListener("click", () => {
  document.getElementById("step2").classList.remove("active");
  document.getElementById("step1").classList.add("active");
  document.getElementById("subtitle").textContent = "Your training, in your pocket.";
});

async function login() {
  const email = document.getElementById("email").value.trim();
  const passcode = document.getElementById("passcode").value.trim();
  if (!email || !passcode) { showMessage("step2Msg", "Enter your email and passcode.", "error"); return; }

  const btn = document.getElementById("loginBtn");
  setLoading(btn, true, "Signing in…");
  showMessage("step2Msg", "", "info");

  try {
    const res = await fetch("/api/flexi/portal-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ trainer_code: trainerCode, email, passcode }),
    });
    const data = await res.json();
    if (!res.ok) { showMessage("step2Msg", data.error || "Sign in failed.", "error"); setLoading(btn, false); return; }
    storeSession(data.session_token, data.client);
    window.location.href = "dashboard.html";
  } catch (e) {
    showMessage("step2Msg", "Network error — please try again.", "error");
    setLoading(btn, false);
  }
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("passcode").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
