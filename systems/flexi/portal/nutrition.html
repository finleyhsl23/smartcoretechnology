<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Nutrition — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
<style>
.slot-rec{border:1px solid var(--fx-line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--fx-card2)}
.slot-rec-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.slot-rec-head strong{font-size:13px;text-transform:capitalize}
.slot-rec-target{font-size:11.5px;color:var(--fx-text3)}
.rec-meal-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--fx-line);font-size:13px}
.rec-meal-row:last-child{border-bottom:none}
.rec-meal-row .rm-meta{margin-left:auto;color:var(--fx-text3);font-size:11px;text-align:right}
.log-tabs{display:flex;gap:6px;margin-bottom:14px}
.log-tabs button{flex:1;padding:9px;border-radius:9px;border:1px solid var(--fx-line);background:var(--fx-card2);color:var(--fx-text2);font-size:12.5px;font-weight:700;cursor:pointer}
.log-tabs button.active{background:var(--fx-grad);border-color:transparent;color:#fff}
.log-tabs button:hover:not(.active){border-color:var(--fx-line-hi);color:var(--fx-text)}
.lib-search-row{max-height:260px;overflow-y:auto;border:1px solid var(--fx-line);border-radius:12px;padding:6px;margin-top:10px}
.lib-meal-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:9px;font-size:13px}
.lib-meal-row:hover{background:var(--fx-card2)}
.lib-meal-row .lm-meta{margin-left:auto;color:var(--fx-text3);font-size:11px}
.recipe-block ul,.recipe-block ol{padding-left:20px;margin:6px 0 14px}
.recipe-block li{font-size:13px;color:var(--fx-text2);margin-bottom:4px}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top">
    <a href="dashboard.html" class="fx-icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none">←</a>
    <div style="flex:1"><h1>Nutrition</h1></div>
    <button class="fx-icon-btn" id="themeToggle">🌙</button><div class="fx-music-wrap" style="display:none" id="fxMusicWrap"><button class="fx-icon-btn" id="fxMusicToggle" title="Background music">🎵</button></div><button class="fx-icon-btn" id="clientLogoutBtn" title="Sign out">🚪</button>
  </div>
  <div class="fx-portal-content">
    <div id="planCard" style="margin-bottom:16px"></div>
    <div id="recommendedWrap" style="margin-bottom:20px"></div>

    <div class="fx-card" style="margin-bottom:20px">
      <h3 style="font-size:13.5px;margin-bottom:10px">Log Food</h3>
      <div class="log-tabs">
        <button type="button" class="active" id="tabLibrary">From My Meal Library</button>
        <button type="button" id="tabCustom">Add My Own</button>
      </div>

      <div id="libraryPane">
        <input class="fx-input" id="libSearch" placeholder="Search meals…"/>
        <div class="lib-search-row" id="libList"></div>
      </div>

      <div id="customPane" style="display:none">
        <div class="fx-field"><label>Meal</label>
          <select class="fx-select" id="meal"><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option><option value="snack">Snack</option></select>
        </div>
        <div class="fx-field"><label>Description</label><input class="fx-input" id="description" placeholder="e.g. Grilled chicken breast"/></div>
        <div class="fx-form-row">
          <div class="fx-field"><label>Quantity</label><input class="fx-input" id="foodQty" type="number" value="100"/></div>
          <div class="fx-field"><label>Unit</label><select class="fx-select" id="foodQtyUnit"><option value="g">g</option><option value="kg">kg</option><option value="oz">oz</option><option value="lb">lb</option></select></div>
        </div>
        <button type="button" class="fx-btn fx-btn-sm fx-btn-block" id="autoCalcBtn" style="margin-bottom:14px">🔍 Search Food</button>
        <div class="fx-form-msg" id="autoCalcMsg" style="margin-bottom:8px"></div>
        <div class="lib-search-row" id="foodMatchList" style="display:none;margin-bottom:14px"></div>
        <div class="fx-form-row">
          <div class="fx-field"><label>Calories</label><input class="fx-input" id="calories" type="number"/></div>
          <div class="fx-field"><label>Protein (g)</label><input class="fx-input" id="customProtein" type="number"/></div>
        </div>
        <div class="fx-form-row">
          <div class="fx-field"><label>Carbs (g)</label><input class="fx-input" id="customCarbs" type="number"/></div>
          <div class="fx-field"><label>Fat (g)</label><input class="fx-input" id="customFat" type="number"/></div>
        </div>
        <button class="fx-btn fx-btn-primary fx-btn-block" id="logBtn">Add to Diary</button>
      </div>
    </div>

    <div class="fx-section-head" style="margin-top:0"><h2 style="font-size:14px">Today's Diary</h2></div>
    <div id="foodList"></div>
  </div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<div class="fx-modal" id="recipeModal">
  <div class="fx-modal-box" style="max-width:480px">
    <div class="fx-modal-head"><h3 id="recipeTitle">Meal</h3><button class="fx-modal-close" data-close-recipe>✕</button></div>
    <div id="recipeBody" class="recipe-block"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="recipeLogBtn">Log This Meal</button>
  </div>
</div>

<script type="module">
import { requireClientAccess, api, applyPortalFeatureGating } from "../shared/client-auth.js";
import { revealApp, setupThemeToggle, setupBackgroundMedia, escapeHtml, toast, showMessage, setLoading, openModal, closeModal, emptyState, enhanceSelect } from "../shared/ui.js";
import { searchFood, scaleNutrition, toGrams } from "../shared/nutrition-lookup.js";

const client = await requireClientAccess();
applyPortalFeatureGating(client.disabled_features);
setupBackgroundMedia(client.background_tracks);
setupThemeToggle();
revealApp();
enhanceSelect(document.getElementById("meal"));
enhanceSelect(document.getElementById("foodQtyUnit"));

let allLibraryMeals = [];

const { plan, meal_plan } = await api("nutrition_plan");
document.getElementById("planCard").innerHTML = plan ? `
  <div class="fx-card">
    <strong>${escapeHtml(plan.name)}</strong>
    <div class="fx-grid fx-grid-4" style="margin-top:12px">
      <div><div style="font-size:10.5px;color:var(--fx-text3);text-transform:uppercase">Kcal</div><div style="font-weight:700">${plan.daily_calories || "—"}</div></div>
      <div><div style="font-size:10.5px;color:var(--fx-text3);text-transform:uppercase">Protein</div><div style="font-weight:700">${plan.protein_g || 0}g</div></div>
      <div><div style="font-size:10.5px;color:var(--fx-text3);text-transform:uppercase">Carbs</div><div style="font-weight:700">${plan.carbs_g || 0}g</div></div>
      <div><div style="font-size:10.5px;color:var(--fx-text3);text-transform:uppercase">Fat</div><div style="font-weight:700">${plan.fat_g || 0}g</div></div>
    </div>
  </div>
` : emptyState("🥗", "No active nutrition plan", "Your trainer hasn't set one up yet.");

if (meal_plan) {
  const SLOT_LABELS = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snack: "Snack" };
  const bySlot = {};
  (meal_plan.items || []).forEach(it => { (bySlot[it.meal_slot] = bySlot[it.meal_slot] || []).push(it); });
  const targetBySlot = {};
  (meal_plan.slot_targets || []).forEach(t => { targetBySlot[t.slot] = t; });

  const slots = Object.keys(SLOT_LABELS).filter(s => bySlot[s]?.length || targetBySlot[s]);
  const wrap = document.getElementById("recommendedWrap");
  if (slots.length) {
    wrap.innerHTML = `<div class="fx-section-head" style="margin-top:0"><h2 style="font-size:14px">Recommended — ${escapeHtml(meal_plan.name)}</h2></div>` +
      slots.map(slot => {
        const t = targetBySlot[slot];
        const targetText = t ? [t.target_calories && `${t.target_calories} kcal`, t.target_protein_g && `${t.target_protein_g}g protein`].filter(Boolean).join(" · ") : "";
        return `
        <div class="slot-rec">
          <div class="slot-rec-head"><strong>${SLOT_LABELS[slot]}</strong>${targetText ? `<span class="slot-rec-target">Target: ${escapeHtml(targetText)}</span>` : ""}</div>
          ${(bySlot[slot] || []).map(it => {
            const m = it.smartcore_flexi_meals;
            if (!m) return "";
            return `
            <div class="rec-meal-row">
              <span>${escapeHtml(m.name)}</span>
              <span class="rm-meta">${m.calories || "—"} kcal<br/>P${m.protein_g || 0}g</span>
              <button class="fx-btn fx-btn-sm" data-view-rec data-meal='${JSON.stringify(m).replace(/'/g, "&#39;")}' data-slot="${slot}">View</button>
            </div>
          `;
          }).join("") || `<p style="color:var(--fx-text3);font-size:12px">No options set for this meal yet.</p>`}
        </div>
      `;
      }).join("");
    wrap.querySelectorAll("[data-view-rec]").forEach(btn => btn.addEventListener("click", () => openRecipe(JSON.parse(btn.dataset.meal), btn.dataset.slot)));
  }
}

function formatIngredient(ing) {
  const parts = [];
  if (ing.qty) parts.push(ing.qty + (ing.unit ? ing.unit : ""));
  parts.push(ing.name);
  return parts.join(" ");
}
function ingredientLines(m) {
  if (m.ingredients_structured?.length) return m.ingredients_structured.map(formatIngredient);
  return (m.ingredients || "").split("\n").filter(Boolean);
}
function openRecipe(m, slot) {
  document.getElementById("recipeTitle").textContent = m.name;
  const ingredients = ingredientLines(m);
  const steps = (m.instructions || "").split("\n").filter(Boolean);
  document.getElementById("recipeBody").innerHTML = `
    <div class="fx-tabular" style="font-size:13.5px;font-weight:700;margin-bottom:14px">${m.calories || "—"} kcal · P ${m.protein_g || 0}g · C ${m.carbs_g || 0}g · F ${m.fat_g || 0}g</div>
    ${ingredients.length ? `<h4 style="font-size:12.5px;margin-bottom:4px">Ingredients</h4><ul>${ingredients.map(i => `<li>${escapeHtml(i)}</li>`).join("")}</ul>` : ""}
    ${steps.length ? `<h4 style="font-size:12.5px;margin-bottom:4px">Instructions</h4><ol>${steps.map(s => `<li>${escapeHtml(s)}</li>`).join("")}</ol>` : ""}
    ${!ingredients.length && !steps.length ? `<p style="color:var(--fx-text3);font-size:12.5px">No recipe details added.</p>` : ""}
  `;
  document.getElementById("recipeLogBtn").dataset.mealId = m.id;
  document.getElementById("recipeLogBtn").dataset.slot = slot || "snack";
  openModal("recipeModal");
}
document.querySelectorAll("[data-close-recipe]").forEach(b => b.addEventListener("click", () => closeModal("recipeModal")));
document.getElementById("recipeLogBtn").addEventListener("click", async (e) => {
  try { await api("log_food", { meal_id: e.target.dataset.mealId, meal: e.target.dataset.slot }); }
  catch (err) { toast(err.message, "error"); return; }
  closeModal("recipeModal");
  toast("Logged", "success");
  loadFood();
});

// ---- Log tabs ----
document.getElementById("tabLibrary").addEventListener("click", () => setTab("library"));
document.getElementById("tabCustom").addEventListener("click", () => setTab("custom"));
function setTab(tab) {
  document.getElementById("tabLibrary").classList.toggle("active", tab === "library");
  document.getElementById("tabCustom").classList.toggle("active", tab === "custom");
  document.getElementById("libraryPane").style.display = tab === "library" ? "" : "none";
  document.getElementById("customPane").style.display = tab === "custom" ? "" : "none";
}

async function loadLibrary() {
  const { meals } = await api("meal_library_list");
  allLibraryMeals = meals || [];
  renderLibraryList(allLibraryMeals);
}
function renderLibraryList(list) {
  const el = document.getElementById("libList");
  el.innerHTML = !list.length ? `<p style="color:var(--fx-text3);font-size:12.5px;padding:8px">No meals in the library yet.</p>` : list.map(m => `
    <div class="lib-meal-row">
      <span>${escapeHtml(m.name)}</span>
      <span class="lm-meta">${m.calories || "—"} kcal</span>
      <button class="fx-btn fx-btn-sm" data-lib-view data-meal='${JSON.stringify(m).replace(/'/g, "&#39;")}'>View &amp; Log</button>
    </div>
  `).join("");
  el.querySelectorAll("[data-lib-view]").forEach(btn => btn.addEventListener("click", () => openRecipe(JSON.parse(btn.dataset.meal), "snack")));
}
document.getElementById("libSearch").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  renderLibraryList(!q ? allLibraryMeals : allLibraryMeals.filter(m => m.name.toLowerCase().includes(q)));
});
loadLibrary();

async function loadFood() {
  const { logs } = await api("food_logs_today");
  const el = document.getElementById("foodList");
  el.innerHTML = !logs?.length ? emptyState("🍽️", "Nothing logged today", "") : logs.map(f => `
    <div class="fx-card fx-card-accent" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div><span class="fx-badge fx-badge-grey" style="text-transform:capitalize">${escapeHtml(f.meal)}</span> <span style="font-size:13px">${escapeHtml(f.description)}</span></div>
      <span class="fx-tabular" style="font-size:11.5px;color:var(--fx-text3)">${f.calories ? f.calories + " kcal" : ""}${f.protein_g ? " · P" + f.protein_g + "g" : ""}</span>
    </div>
  `).join("");
}

function renderFoodMatches(foods) {
  const el = document.getElementById("foodMatchList");
  if (!foods.length) { el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "";
  el.innerHTML = foods.map((f, i) => `
    <div class="lib-meal-row" style="cursor:pointer" data-pick-food="${i}">
      <span>${f.source === "branded" ? "🏪 " : ""}${escapeHtml(f.name)}${f.brand ? ` <span style="color:var(--fx-text3);font-size:11px">(${escapeHtml(f.brand)})</span>` : ""}</span>
      <span class="lm-meta">${f.per100g.calories ?? "—"} kcal/100g</span>
    </div>
  `).join("") + (foods.some(f => f.source === "branded")
    ? `<div style="padding:6px 8px;font-size:10.5px;color:var(--fx-text3)">🏪 Shop products via <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener" style="color:inherit">Open Food Facts</a></div>`
    : "");
  el.querySelectorAll("[data-pick-food]").forEach(row => row.addEventListener("click", () => {
    const qty = parseFloat(document.getElementById("foodQty").value) || 100;
    const unit = document.getElementById("foodQtyUnit").value;
    const grams = toGrams(qty, unit);
    const food = foods[parseInt(row.dataset.pickFood, 10)];
    const scaled = scaleNutrition(food.per100g, grams);
    document.getElementById("calories").value = scaled.calories ?? "";
    document.getElementById("customProtein").value = scaled.protein_g ?? "";
    document.getElementById("customCarbs").value = scaled.carbs_g ?? "";
    document.getElementById("customFat").value = scaled.fat_g ?? "";
    document.getElementById("description").value = food.name;
    el.style.display = "none";
    el.innerHTML = "";
    showMessage("autoCalcMsg", `Using "${food.name}" (${qty}${unit}) — values filled in below, feel free to adjust.`, "success");
  }));
}

document.getElementById("autoCalcBtn").addEventListener("click", async (e) => {
  const name = document.getElementById("description").value.trim();
  if (!name) { showMessage("autoCalcMsg", "Type what you ate first.", "error"); return; }
  setLoading(e.target, true, "Searching…");
  try {
    const foods = await searchFood(name);
    if (!foods.length) {
      showMessage("autoCalcMsg", `No match found for "${name}" — enter the values manually.`, "error");
      renderFoodMatches([]);
    } else {
      showMessage("autoCalcMsg", `${foods.length} match${foods.length > 1 ? "es" : ""} found — pick the right one below.`, "success");
      renderFoodMatches(foods);
    }
  } catch (err) {
    showMessage("autoCalcMsg", err.message || "Lookup failed.", "error");
  }
  setLoading(e.target, false);
});

document.getElementById("logBtn").addEventListener("click", async (e) => {
  const description = document.getElementById("description").value.trim();
  if (!description) { toast("Add a description", "error"); return; }
  setLoading(e.target, true, "Logging…");
  try {
    await api("log_food", {
      meal: document.getElementById("meal").value,
      description,
      calories: parseInt(document.getElementById("calories").value) || null,
      protein_g: parseInt(document.getElementById("customProtein").value) || null,
      carbs_g: parseInt(document.getElementById("customCarbs").value) || null,
      fat_g: parseInt(document.getElementById("customFat").value) || null,
    });
  } catch (e) { setLoading(document.getElementById("logBtn"), false); toast(e.message, "error"); return; }
  setLoading(document.getElementById("logBtn"), false);
  ["description","calories","customProtein","customCarbs","customFat"].forEach(id => document.getElementById(id).value = "");
  document.getElementById("foodQty").value = 100;
  document.getElementById("foodQtyUnit").value = "g";
  document.getElementById("autoCalcMsg").textContent = "";
  document.getElementById("foodMatchList").style.display = "none";
  document.getElementById("foodMatchList").innerHTML = "";
  toast("Logged", "success");
  loadFood();
});

loadFood();
</script>
</body>
</html>
