<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Book — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top"><div style="flex:1"><h1>Book</h1></div><button class="fx-icon-btn" id="themeToggle">🌙</button></div>
  <div class="fx-portal-content">
    <div class="fx-section-head" style="margin-top:0"><h2 style="font-size:14px">Your Upcoming Sessions</h2></div>
    <div id="myBookings" style="margin-bottom:24px"></div>

    <div class="fx-section-head"><h2 style="font-size:14px">Available Classes</h2></div>
    <div id="availableClasses"></div>
  </div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab active" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<script type="module">
import { requireClientAccess } from "../shared/client-auth.js";
import { sb } from "../shared/supabase.js";
import { revealApp, setupThemeToggle, escapeHtml, fmtDateTime, toast, emptyState } from "../shared/ui.js";

const client = await requireClientAccess();
setupThemeToggle();
revealApp();

async function loadMyBookings() {
  const { data } = await sb().from("smartcore_flexi_bookings").select("*").eq("client_id", client.id).gte("starts_at", new Date(Date.now() - 3600000).toISOString()).neq("status", "cancelled").order("starts_at");
  const el = document.getElementById("myBookings");
  el.innerHTML = !data?.length ? emptyState("📅", "Nothing booked", "Book a class below.") : data.map(b => `
    <div class="fx-card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div><strong>${fmtDateTime(b.starts_at)}</strong><div style="color:var(--fx-text3);font-size:12px">${b.session_type === "class" ? "Group Class" : "1:1 Session"}</div></div>
      ${b.status === "confirmed" ? `<button class="fx-btn fx-btn-sm" data-cancel="${b.id}">Cancel</button>` : `<span class="fx-badge fx-badge-grey">${b.status}</span>`}
    </div>
  `).join("");
  el.querySelectorAll("[data-cancel]").forEach(btn => btn.addEventListener("click", async () => {
    await sb().from("smartcore_flexi_bookings").update({ status: "cancelled" }).eq("id", btn.dataset.cancel);
    toast("Booking cancelled", "success");
    loadMyBookings(); loadClasses();
  }));
}

async function loadClasses() {
  const { data: classes } = await sb().from("smartcore_flexi_class_sessions").select("*").eq("status", "scheduled").gte("starts_at", new Date().toISOString()).order("starts_at");
  const el = document.getElementById("availableClasses");
  if (!classes?.length) { el.innerHTML = emptyState("◫", "No classes scheduled", ""); return; }

  const { data: myBookings } = await sb().from("smartcore_flexi_bookings").select("class_session_id").eq("client_id", client.id).eq("status", "confirmed");
  const bookedIds = new Set((myBookings || []).map(b => b.class_session_id));

  const rows = await Promise.all(classes.map(async c => {
    const { count } = await sb().from("smartcore_flexi_bookings").select("id", { count: "exact", head: true }).eq("class_session_id", c.id).eq("status", "confirmed");
    const full = (count || 0) >= c.capacity;
    const booked = bookedIds.has(c.id);
    return `
      <div class="fx-card" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div><strong>${escapeHtml(c.name)}</strong><div style="color:var(--fx-text3);font-size:12px">${fmtDateTime(c.starts_at)} · ${count || 0}/${c.capacity} booked</div></div>
        ${booked ? '<span class="fx-badge fx-badge-green">Booked</span>' : full ? '<span class="fx-badge fx-badge-red">Full</span>' : `<button class="fx-btn fx-btn-sm fx-btn-primary" data-book="${c.id}">Book</button>`}
      </div>
    `;
  }));
  el.innerHTML = rows.join("");
  el.querySelectorAll("[data-book]").forEach(btn => btn.addEventListener("click", async () => {
    const { error } = await sb().rpc("flexi_book_class", { p_class_session_id: btn.dataset.book, p_client_id: client.id });
    if (error) { toast(error.message, "error"); return; }
    toast("Booked!", "success");
    loadMyBookings(); loadClasses();
  }));
}

loadMyBookings();
loadClasses();
</script>
</body>
</html>
