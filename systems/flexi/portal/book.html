<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Book — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top"><div style="flex:1"><h1>Book</h1></div><button class="fx-icon-btn" id="themeToggle">🌙</button></div>
  <div class="fx-portal-content">
    <div class="fx-section-head" style="margin-top:0"><h2 style="font-size:14px">Your Upcoming Sessions</h2></div>
    <div id="myBookings" style="margin-bottom:24px"></div>

    <div class="fx-section-head"><h2 style="font-size:14px">Available Classes</h2></div>
    <div id="availableClasses"></div>
  </div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab active" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<script type="module">
import { requireClientAccess, api } from "../shared/client-auth.js";
import { revealApp, setupThemeToggle, escapeHtml, fmtDateTime, toast, emptyState } from "../shared/ui.js";

const client = await requireClientAccess();
setupThemeToggle();
revealApp();

async function loadMyBookings() {
  const { bookings } = await api("my_bookings");
  const el = document.getElementById("myBookings");
  el.innerHTML = !bookings?.length ? emptyState("📅", "Nothing booked", "Book a class below.") : bookings.map(b => `
    <div class="fx-card fx-card-accent" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div><strong>${fmtDateTime(b.starts_at)}</strong><div style="color:var(--fx-text3);font-size:12px">${b.session_type === "class" ? "Group Class" : "1:1 Session"}</div></div>
      ${b.status === "confirmed" ? `<button class="fx-btn fx-btn-sm" data-cancel="${b.id}">Cancel</button>` : `<span class="fx-badge fx-badge-grey">${b.status}</span>`}
    </div>
  `).join("");
  el.querySelectorAll("[data-cancel]").forEach(btn => btn.addEventListener("click", async () => {
    try { await api("cancel_booking", { booking_id: btn.dataset.cancel }); } catch (e) { toast(e.message, "error"); return; }
    toast("Booking cancelled", "success");
    loadMyBookings(); loadClasses();
  }));
}

async function loadClasses() {
  const { classes } = await api("available_classes");
  const el = document.getElementById("availableClasses");
  if (!classes?.length) { el.innerHTML = emptyState("◫", "No classes scheduled", ""); return; }

  el.innerHTML = classes.map(c => `
      <div class="fx-card fx-card-accent" style="margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
        <div><strong>${escapeHtml(c.name)}</strong><div style="color:var(--fx-text3);font-size:12px">${fmtDateTime(c.starts_at)} · ${c.booked_count}/${c.capacity} booked</div></div>
        ${c.is_booked ? '<span class="fx-badge fx-badge-green">Booked</span>' : c.booked_count >= c.capacity ? '<span class="fx-badge fx-badge-red">Full</span>' : `<button class="fx-btn fx-btn-sm fx-btn-primary" data-book="${c.id}">Book</button>`}
      </div>
    `).join("");
  el.querySelectorAll("[data-book]").forEach(btn => btn.addEventListener("click", async () => {
    try { await api("book_class", { class_session_id: btn.dataset.book }); } catch (e) { toast(e.message, "error"); return; }
    toast("Booked!", "success");
    loadMyBookings(); loadClasses();
  }));
}

loadMyBookings();
loadClasses();
</script>
</body>
</html>
