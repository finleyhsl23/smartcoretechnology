<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Progress — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top"><div style="flex:1"><h1>Progress</h1></div><button class="fx-icon-btn" id="themeToggle">🌙</button><div class="fx-music-wrap" style="display:none" id="fxMusicWrap"><button class="fx-icon-btn" id="fxMusicToggle" title="Background music">🎵</button></div><button class="fx-icon-btn" id="clientLogoutBtn" title="Sign out">🚪</button></div>
  <div class="fx-portal-content">
    <div class="fx-card" style="margin-bottom:20px">
      <div class="fx-form-row">
        <div class="fx-field"><label>Weight (kg)</label><input class="fx-input" id="weight" type="number" step="0.1"/></div>
        <div class="fx-field"><label>Body fat %</label><input class="fx-input" id="bodyFat" type="number" step="0.1"/></div>
      </div>
      <div class="fx-field"><label>Notes</label><input class="fx-input" id="notes"/></div>
      <div class="fx-field"><label>Progress photo (optional)</label><input class="fx-input" id="photo" type="file" accept="image/*"/></div>
      <details style="margin:4px 0 10px">
        <summary style="cursor:pointer;font-size:12.5px;font-weight:700;color:var(--fx-text2);list-style:none">📏 Body Measurements (optional)</summary>
        <div class="fx-form-row" style="margin-top:10px">
          <div class="fx-field"><label>Chest (cm)</label><input class="fx-input" id="mChest" type="number" step="0.1"/></div>
          <div class="fx-field"><label>Waist (cm)</label><input class="fx-input" id="mWaist" type="number" step="0.1"/></div>
        </div>
        <div class="fx-form-row">
          <div class="fx-field"><label>Hips (cm)</label><input class="fx-input" id="mHips" type="number" step="0.1"/></div>
          <div class="fx-field"><label>Arms (cm)</label><input class="fx-input" id="mArms" type="number" step="0.1"/></div>
        </div>
        <div class="fx-field"><label>Thighs (cm)</label><input class="fx-input" id="mThighs" type="number" step="0.1"/></div>
      </details>
      <div class="fx-form-msg" id="msg"></div>
      <button class="fx-btn fx-btn-primary fx-btn-block" id="logBtn">Log Entry</button>
    </div>
    <div class="fx-section-head" style="margin-top:0"><h2 style="font-size:14px">History</h2></div>
    <div id="history"></div>
  </div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab active" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<script type="module">
import { requireClientAccess, api, applyPortalFeatureGating } from "../shared/client-auth.js";
import { revealApp, setupThemeToggle, setupBackgroundMedia, fmtDate, setLoading, showMessage, toast, emptyState } from "../shared/ui.js";

const client = await requireClientAccess();
applyPortalFeatureGating(client.disabled_features);
setupBackgroundMedia(client.background_tracks);
setupThemeToggle();
revealApp();

const MEASURE_LABELS = { chest: "Chest", waist: "Waist", hips: "Hips", arms: "Arms", thighs: "Thighs" };
function measurementChips(m) {
  if (!m || typeof m !== "object") return "";
  const parts = Object.entries(m).filter(([, v]) => v != null && v !== "").map(([k, v]) => `${MEASURE_LABELS[k] || k} ${v}cm`);
  if (!parts.length) return "";
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">${parts.map(p => `<span class="fx-badge fx-badge-grey">${p}</span>`).join("")}</div>`;
}

async function loadHistory() {
  const { entries } = await api("progress_entries");
  const el = document.getElementById("history");
  el.innerHTML = !entries?.length ? emptyState("📈", "No entries yet", "Log your first one above.") : entries.map(p => `
    <div class="fx-card fx-card-accent" style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between"><strong>${fmtDate(p.logged_at)}</strong><span>${p.weight_kg ? p.weight_kg + " kg" : ""}</span></div>
      ${p.notes ? `<div style="color:var(--fx-text3);font-size:12.5px;margin-top:4px">${p.notes}</div>` : ""}
      ${measurementChips(p.measurements)}
      ${p.photo_urls?.length ? `<div style="display:flex;gap:6px;margin-top:8px">${p.photo_urls.map(u => `<div style="width:56px;height:56px;border-radius:8px;background:var(--fx-card2);overflow:hidden"><img src="${u}" style="width:100%;height:100%;object-fit:cover"/></div>`).join("")}</div>` : ""}
    </div>
  `).join("");
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById("logBtn").addEventListener("click", async (e) => {
  const weight_kg = parseFloat(document.getElementById("weight").value) || null;
  const body_fat_pct = parseFloat(document.getElementById("bodyFat").value) || null;
  const notes = document.getElementById("notes").value.trim() || null;
  const file = document.getElementById("photo").files[0];
  const measurements = {};
  [["chest","mChest"],["waist","mWaist"],["hips","mHips"],["arms","mArms"],["thighs","mThighs"]].forEach(([key, id]) => {
    const v = parseFloat(document.getElementById(id).value);
    if (!isNaN(v)) measurements[key] = v;
  });
  const hasMeasurements = Object.keys(measurements).length > 0;
  if (!weight_kg && !body_fat_pct && !notes && !file && !hasMeasurements) { showMessage("msg", "Add at least one field.", "error"); return; }

  setLoading(e.target, true, "Saving…");
  try {
    const photo_base64 = file ? await fileToBase64(file) : null;
    await api("log_progress", { weight_kg, body_fat_pct, notes, photo_base64, photo_type: file?.type, measurements: hasMeasurements ? measurements : null });
  } catch (err) {
    setLoading(e.target, false);
    showMessage("msg", err.message, "error");
    return;
  }
  setLoading(e.target, false);
  ["weight","bodyFat","notes","photo","mChest","mWaist","mHips","mArms","mThighs"].forEach(id => document.getElementById(id).value = "");
  toast("Progress logged", "success");
  loadHistory();
});

loadHistory();
</script>
</body>
</html>
