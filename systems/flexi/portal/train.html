<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Train — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
<style>
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--fx-line)}
.set-row:last-child{border-bottom:none}
.set-tick{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;min-width:0}
.set-tick input[type=checkbox]{width:22px;height:22px;flex-shrink:0;accent-color:var(--fx-accent)}
.set-num{font-size:12px;color:var(--fx-text3);font-weight:700;width:16px;flex-shrink:0}
.set-target{font-size:13px;color:var(--fx-text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-edit-link{font-size:11.5px;font-weight:700;color:var(--fx-text3);cursor:pointer;flex-shrink:0}
.set-edit-fields{display:none;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:0 0 10px 32px}
.set-edit-fields.open{display:grid}
.demo-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 12px;border-radius:9px;border:1px solid var(--fx-line);background:var(--fx-card2);color:var(--fx-text2);cursor:pointer;margin:4px 0 10px}
.demo-btn:hover{border-color:var(--fx-line-hi);color:var(--fx-text)}
.demo-btn.no-video{cursor:default;color:var(--fx-text3)}
.demo-btn.no-video:hover{border-color:var(--fx-line);color:var(--fx-text3)}
.ex-demo-video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-bottom:10px;display:none}
.ex-demo-video.open{display:block}
.ex-demo-video iframe,.ex-demo-video video{width:100%;height:100%;display:block;border:0}
.program-group{margin-bottom:24px}
.program-group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--fx-text3);margin-bottom:10px}
.workout-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.workout-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.workout-grid{grid-template-columns:repeat(3,1fr)}}
.workout-card{display:flex;align-items:center;gap:14px;cursor:pointer;padding:16px}
.workout-tile{
  width:48px;height:48px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;box-shadow:var(--fx-glow)
}
.workout-info{flex:1;min-width:0}
.workout-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workout-meta{font-size:11.5px;color:var(--fx-text3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workout-cta{flex-shrink:0;color:var(--fx-accent);font-weight:700;font-size:13px}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top"><div style="flex:1"><h1>Train</h1></div><button class="fx-icon-btn" id="themeToggle">🌙</button></div>
  <div class="fx-portal-content">
    <div id="listView"></div>
    <div id="logView" style="display:none"></div>
  </div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab active" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<script type="module">
import { requireClientAccess, api } from "../shared/client-auth.js";
import { revealApp, setupThemeToggle, escapeHtml, setLoading, toast, emptyState, tileGradient } from "../shared/ui.js";

const client = await requireClientAccess();
setupThemeToggle();
revealApp();

function parseLeadingNumber(str) {
  const m = String(str || "").match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : null;
}
function targetLabel(we) {
  const parts = [];
  if (we.target_reps) parts.push(`${escapeHtml(we.target_reps)} reps`);
  if (we.target_weight_kg) parts.push(`${we.target_weight_kg}kg`);
  if (we.target_speed_kmh) parts.push(`${we.target_speed_kmh}km/h`);
  if (we.target_distance_m) parts.push(`${we.target_distance_m >= 1000 ? (we.target_distance_m/1000) + "km" : we.target_distance_m + "m"}`);
  return parts.join(" · ") || "Mark complete";
}

function timeAgo(dateStr) {
  if (!dateStr) return null;
  const days = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 7) return `${days}d ago`;
  if (days < 30) return `${Math.floor(days / 7)}w ago`;
  return `${Math.floor(days / 30)}mo ago`;
}

async function loadList() {
  const { programs } = await api("active_programs");
  const listView = document.getElementById("listView");
  if (!programs?.length) { listView.innerHTML = emptyState("🏋️", "No active program", "Your trainer hasn't assigned one yet."); return; }

  const blocks = programs.map(p => `
      <div class="program-group">
        <div class="program-group-label">${escapeHtml(p.name)}</div>
        ${(p.workouts || []).length ? `<div class="workout-grid">${(p.workouts || []).map(w => {
          const done = timeAgo(w.last_completed_at);
          const meta = [`${w.exercise_count} exercise${w.exercise_count === 1 ? "" : "s"}`, done ? `Last done ${done}` : "Not done yet"].join(" · ");
          return `
          <div class="fx-card workout-card" data-workout="${w.id}" data-name="${escapeHtml(w.name)}">
            <div class="workout-tile" style="background:${tileGradient(w.id)}">🏋️</div>
            <div class="workout-info">
              <div class="workout-name">${escapeHtml(w.name)}</div>
              <div class="workout-meta">${meta}</div>
            </div>
            <div class="workout-cta">Start →</div>
          </div>`;
        }).join("")}</div>` : `<p style="color:var(--fx-text3);font-size:12.5px">No workouts in this program yet.</p>`}
      </div>
    `);
  listView.innerHTML = blocks.join("");
  listView.querySelectorAll("[data-workout]").forEach(el => el.addEventListener("click", () => openWorkout(el.dataset.workout, el.dataset.name)));
}

async function openWorkout(workoutId, name) {
  const { exercises } = await api("workout_exercises", { workout_id: workoutId });
  document.getElementById("listView").style.display = "none";
  const logView = document.getElementById("logView");
  logView.style.display = "";
  logView.innerHTML = `
    <button class="fx-btn fx-btn-sm" id="backBtn" style="margin-bottom:14px">← Back</button>
    <h2 style="font-size:16px;margin-bottom:14px">${escapeHtml(name)}</h2>
    <div id="exList"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="finishBtn" style="margin-top:8px">Finish Workout</button>
  `;
  document.getElementById("backBtn").addEventListener("click", () => { logView.style.display = "none"; document.getElementById("listView").style.display = ""; });

  const exList = document.getElementById("exList");
  exList.innerHTML = (exercises || []).map((we, i) => {
    const videoUrl = we.smartcore_flexi_exercises?.video_url;
    const yt = videoUrl && videoUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
    return `
    <div class="fx-card" style="margin-bottom:14px" data-ex-block="${we.id}" data-exercise-id="${we.exercise_id}">
      <strong>${escapeHtml(we.smartcore_flexi_exercises?.name || "Exercise")}</strong>
      <div style="color:var(--fx-text3);font-size:12px;margin:4px 0 2px">Target: ${we.target_sets || "—"} sets · ${targetLabel(we)}</div>
      <button type="button" class="demo-btn ${videoUrl ? "" : "no-video"}" data-demo-toggle="${we.id}" ${videoUrl ? "" : "disabled"}>
        ${videoUrl ? "▶ See Demo Video" : "No demo video active"}
      </button>
      ${videoUrl ? `<div class="ex-demo-video" id="demo-${we.id}">${yt ? `<iframe data-src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe>` : `<video data-src="${escapeHtml(videoUrl)}" controls preload="none"></video>`}</div>` : ""}
      <div class="sets-container" data-sets="${we.id}"></div>
      <button class="fx-btn fx-btn-sm" data-add-set="${we.id}" style="margin-top:6px">+ Add Set</button>
    </div>
  `;
  }).join("");
  exList.querySelectorAll("[data-demo-toggle]:not([disabled])").forEach(btn => btn.addEventListener("click", () => {
    const box = document.getElementById(`demo-${btn.dataset.demoToggle}`);
    box.classList.toggle("open");
    const media = box.querySelector("[data-src]");
    if (box.classList.contains("open") && media && !media.src) media.src = media.dataset.src;
  }));

  (exercises || []).forEach(we => {
    const n = we.target_sets || 3;
    for (let i = 0; i < n; i++) addSetRow(we.id, we);
  });

  exList.querySelectorAll("[data-add-set]").forEach(btn => btn.addEventListener("click", () => {
    const we = (exercises || []).find(x => x.id === btn.dataset.addSet);
    addSetRow(btn.dataset.addSet, we);
  }));

  document.getElementById("finishBtn").addEventListener("click", async (e) => {
    setLoading(e.target, true, "Saving…");

    const sets = [];
    exList.querySelectorAll("[data-ex-block]").forEach(block => {
      const workout_exercise_id = block.dataset.exBlock;
      const exercise_id = block.dataset.exerciseId;
      block.querySelectorAll(".set-row[data-set]").forEach((row, i) => {
        const done = row.querySelector("[data-set-done]").checked;
        const repsField = row.querySelector("[data-reps]").value;
        const weightField = row.querySelector("[data-weight]").value;
        const rpe = row.querySelector("[data-rpe]").value;
        if (!done && !repsField && !weightField) return;
        sets.push({
          workout_exercise_id, exercise_id,
          set_number: i + 1,
          reps_done: repsField ? parseInt(repsField) : parseLeadingNumber(row.dataset.targetReps),
          weight_used_kg: weightField ? parseFloat(weightField) : (row.dataset.targetWeight ? parseFloat(row.dataset.targetWeight) : null),
          rpe: parseFloat(rpe) || null,
        });
      });
    });

    try {
      await api("log_workout", { workout_id: workoutId, sets });
    } catch (err) {
      setLoading(e.target, false);
      toast(err.message, "error");
      return;
    }

    setLoading(e.target, false);
    toast("Workout logged 💪", "success");
    logView.style.display = "none";
    document.getElementById("listView").style.display = "";
  });
}

function addSetRow(workoutExerciseId, we) {
  const container = document.querySelector(`[data-sets="${workoutExerciseId}"]`);
  const idx = container.children.length + 1;
  const row = document.createElement("div");
  row.className = "set-row-wrap";
  row.innerHTML = `
    <div class="set-row" data-set data-target-reps="${escapeHtml(we?.target_reps || "")}" data-target-weight="${we?.target_weight_kg || ""}">
      <label class="set-tick">
        <input type="checkbox" data-set-done/>
        <span class="set-num">${idx}</span>
        <span class="set-target">${escapeHtml(targetLabel(we || {}))}</span>
      </label>
      <span class="set-edit-link" data-set-edit>Edit</span>
    </div>
    <div class="set-edit-fields">
      <input class="fx-input" type="number" placeholder="Reps" data-reps/>
      <input class="fx-input" type="number" step="0.5" placeholder="kg" data-weight/>
      <input class="fx-input" type="number" step="0.5" placeholder="RPE" data-rpe/>
    </div>
  `;
  container.appendChild(row);
  row.querySelector("[data-set-edit]").addEventListener("click", () => {
    row.querySelector(".set-edit-fields").classList.toggle("open");
  });
}

loadList();
</script>
</body>
</html>
