<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Waivers — Flexi</title>
<link rel="stylesheet" href="../shared/flexi.css"/>
<style>
.sig-pad{width:100%;height:150px;border:1px solid var(--fx-line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair;display:block}
.sig-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.sig-hint{font-size:11.5px;color:var(--fx-text3)}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-portal">
  <div class="fx-portal-top">
    <a href="dashboard.html" class="fx-icon-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none">←</a>
    <div style="flex:1"><h1>Waivers</h1></div>
    <button class="fx-icon-btn" id="themeToggle">🌙</button><div class="fx-music-wrap" style="display:none" id="fxMusicWrap"><button class="fx-icon-btn" id="fxMusicToggle" title="Background music">🎵</button></div><button class="fx-icon-btn" id="clientLogoutBtn" title="Sign out">🚪</button>
  </div>
  <div class="fx-portal-content" id="list"></div>
  <nav class="fx-portal-tabs">
    <a class="fx-portal-tab" href="dashboard.html"><span class="fx-portal-tab-icon">🏠</span>Home</a>
    <a class="fx-portal-tab" href="train.html"><span class="fx-portal-tab-icon">🏋️</span>Train</a>
    <a class="fx-portal-tab" href="book.html"><span class="fx-portal-tab-icon">📅</span>Book</a>
    <a class="fx-portal-tab" href="progress.html"><span class="fx-portal-tab-icon">📈</span>Progress</a>
    <a class="fx-portal-tab" href="chat.html"><span class="fx-portal-tab-icon">💬</span>Chat</a>
  </nav>
</div>

<div class="fx-modal" id="signModal">
  <div class="fx-modal-box">
    <div class="fx-modal-head"><h3 id="signTitle">Waiver</h3><button class="fx-modal-close" data-close>✕</button></div>
    <div id="signBody" style="font-size:13px;color:var(--fx-text2);max-height:180px;overflow-y:auto;margin-bottom:14px;white-space:pre-wrap"></div>
    <div class="fx-field"><label>Type your full name to sign</label><input class="fx-input" id="signName"/></div>
    <div class="fx-field">
      <label>Sign below with your finger or mouse</label>
      <canvas class="sig-pad" id="sigCanvas"></canvas>
      <div class="sig-row"><span class="sig-hint">This becomes part of the signed record.</span><button type="button" class="fx-btn fx-btn-sm" id="clearSigBtn">Clear</button></div>
    </div>
    <div class="fx-form-msg" id="signMsg"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="confirmSignBtn">Sign &amp; Accept</button>
  </div>
</div>

<script type="module">
import { requireClientAccess, api, applyPortalFeatureGating } from "../shared/client-auth.js";
import { revealApp, setupThemeToggle, setupBackgroundMedia, escapeHtml, fmtDateTime, showMessage, setLoading, openModal, closeModal, toast, emptyState } from "../shared/ui.js";

const client = await requireClientAccess();
applyPortalFeatureGating(client.disabled_features);
setupBackgroundMedia(client.background_tracks);
setupThemeToggle();
revealApp();

// ---- Signature pad ----
const canvas = document.getElementById("sigCanvas");
const ctx = canvas.getContext("2d");
let hasSignature = false;
let drawing = false;

function resetCanvas() {
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = rect.width * ratio;
  canvas.height = rect.height * ratio;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(ratio, ratio);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, rect.width, rect.height);
  ctx.strokeStyle = "#1a1a2e";
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  hasSignature = false;
}
function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
canvas.addEventListener("pointerdown", (e) => {
  drawing = true; hasSignature = true;
  const p = pointerPos(e);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!drawing) return;
  const p = pointerPos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});
canvas.addEventListener("pointerup", () => { drawing = false; });
canvas.addEventListener("pointerleave", () => { drawing = false; });
document.getElementById("clearSigBtn").addEventListener("click", resetCanvas);

async function load() {
  const { waivers, signatures: sigs } = await api("waivers_list");
  const signedMap = new Map((sigs || []).map(s => [s.waiver_id, s]));
  const el = document.getElementById("list");
  el.innerHTML = !waivers?.length ? emptyState("📝", "No waivers to sign", "") : waivers.map(w => {
    const sig = signedMap.get(w.id);
    return `
      <div class="fx-card fx-card-accent" style="margin-bottom:10px;${sig ? "" : "cursor:pointer"}" ${sig ? "" : `data-sign="${w.id}" data-title="${escapeHtml(w.title)}"`}>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <strong>${escapeHtml(w.title)}</strong>
          <span class="fx-badge ${sig ? "fx-badge-green" : "fx-badge-amber"}">${sig ? "Signed" : "Tap to sign"}</span>
        </div>
        ${sig ? `<div style="color:var(--fx-text3);font-size:12px;margin-top:4px">Signed ${fmtDateTime(sig.signed_at)}</div>` : ""}
      </div>
    `;
  }).join("");
  el.querySelectorAll("[data-sign]").forEach(card => card.addEventListener("click", () => openSign(card.dataset.sign, card.dataset.title, waivers.find(w => w.id === card.dataset.sign).body)));
}

function openSign(id, title, body) {
  document.getElementById("signTitle").textContent = title;
  document.getElementById("signBody").textContent = body;
  document.getElementById("signName").value = client.full_name || "";
  document.getElementById("signMsg").textContent = "";
  document.getElementById("confirmSignBtn").dataset.waiver = id;
  openModal("signModal");
  requestAnimationFrame(resetCanvas);
}
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal("signModal")));
document.getElementById("confirmSignBtn").addEventListener("click", async (e) => {
  const name = document.getElementById("signName").value.trim();
  if (!name) { showMessage("signMsg", "Type your name to sign.", "error"); return; }
  if (!hasSignature) { showMessage("signMsg", "Please sign using your finger or mouse.", "error"); return; }
  setLoading(e.target, true, "Signing…");
  const signature_base64 = canvas.toDataURL("image/png").split(",")[1];
  try { await api("sign_waiver", { waiver_id: e.target.dataset.waiver, signature_name: name, signature_base64 }); }
  catch (err) { setLoading(e.target, false); showMessage("signMsg", err.message, "error"); return; }
  setLoading(e.target, false);
  closeModal("signModal");
  toast("Signed — thank you", "success");
  load();
});

load();
</script>
</body>
</html>
