<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reports — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
<style>
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{width:70px;font-size:11.5px;color:var(--fx-text3);flex-shrink:0}
.bar-track{flex:1;height:22px;background:var(--fx-card2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;background:var(--fx-accent);border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;min-width:2px}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Reports</h1><div class="fx-topbar-sub">Revenue, retention and activity at a glance</div></div>
    </header>
    <main class="fx-content">
      <div class="fx-grid fx-grid-4" id="statsGrid" style="margin-bottom:28px"></div>
      <div class="fx-section-head"><h2>Revenue — Last 6 Months</h2></div>
      <div class="fx-card" id="revenueChart" style="margin-bottom:28px"></div>
      <div class="fx-section-head"><h2>Clients by Status</h2></div>
      <div class="fx-card" id="statusChart"></div>
    </main>
  </div>
</div>
<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, fmtMoney } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "reports" });
renderNav({ activeKey: "reports", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

const [{ data: clients }, { data: payments }, { count: workoutCount }, { count: bookingCount }] = await Promise.all([
  sb().from("smartcore_flexi_clients").select("status"),
  sb().from("smartcore_flexi_payments").select("amount_pence, created_at").eq("status", "paid"),
  sb().from("smartcore_flexi_workout_logs").select("id", { count: "exact", head: true }),
  sb().from("smartcore_flexi_bookings").select("id", { count: "exact", head: true }).eq("status", "completed"),
]);

const totalRevenue = (payments || []).reduce((s,p) => s + p.amount_pence, 0);
document.getElementById("statsGrid").innerHTML = `
  <div class="fx-card fx-stat"><div class="fx-stat-label">Total Clients</div><div class="fx-stat-val">${(clients||[]).length}</div></div>
  <div class="fx-card fx-stat"><div class="fx-stat-label">Total Revenue</div><div class="fx-stat-val">${fmtMoney(totalRevenue)}</div></div>
  <div class="fx-card fx-stat"><div class="fx-stat-label">Workouts Logged</div><div class="fx-stat-val">${workoutCount ?? 0}</div></div>
  <div class="fx-card fx-stat"><div class="fx-stat-label">Sessions Completed</div><div class="fx-stat-val">${bookingCount ?? 0}</div></div>
`;

const months = [];
for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d); }
const monthTotals = months.map(m => {
  const next = new Date(m); next.setMonth(next.getMonth() + 1);
  return (payments || []).filter(p => { const dt = new Date(p.created_at); return dt >= m && dt < next; }).reduce((s,p) => s + p.amount_pence, 0);
});
const max = Math.max(...monthTotals, 1);
document.getElementById("revenueChart").innerHTML = months.map((m,i) => `
  <div class="bar-row">
    <div class="bar-label">${m.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(monthTotals[i]/max)*100)}%">${monthTotals[i] ? fmtMoney(monthTotals[i]) : ""}</div></div>
  </div>
`).join("");

const statusCounts = { active: 0, paused: 0, archived: 0 };
(clients || []).forEach(c => { statusCounts[c.status] = (statusCounts[c.status] || 0) + 1; });
const maxStatus = Math.max(...Object.values(statusCounts), 1);
document.getElementById("statusChart").innerHTML = Object.entries(statusCounts).map(([k,v]) => `
  <div class="bar-row">
    <div class="bar-label" style="text-transform:capitalize">${k}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(v/maxStatus)*100)}%">${v || ""}</div></div>
  </div>
`).join("");
</script>
</body>
</html>
