<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reports — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
<style>
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bar-label{width:70px;font-size:11.5px;color:var(--fx-text3);flex-shrink:0;text-transform:capitalize}
.bar-track{flex:1;height:22px;background:var(--fx-card2);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:11px;font-weight:700;min-width:2px;transition:width .4s}
.rpt-stat{display:flex;align-items:center;gap:12px}
.rpt-stat-icon{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rpt-stat-icon svg{width:18px;height:18px}
</style>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Reports</h1><div class="fx-topbar-sub">Revenue, retention and activity at a glance</div></div>
    </header>
    <main class="fx-content">
      <div class="fx-grid fx-grid-4" id="statsGrid" style="margin-bottom:28px"></div>
      <div class="fx-section-head"><h2>Revenue — Last 6 Months</h2></div>
      <div class="fx-card" id="revenueChart" style="margin-bottom:28px"></div>
      <div class="fx-section-head"><h2>Clients by Status</h2></div>
      <div class="fx-card" id="statusChart"></div>
    </main>
  </div>
</div>
<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, fmtMoney } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "reports" });
renderNav({ activeKey: "reports", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

const [{ data: clients }, { data: payments }, { count: workoutCount }, { count: bookingCount }] = await Promise.all([
  sb().from("smartcore_flexi_clients").select("status"),
  sb().from("smartcore_flexi_payments").select("amount_pence, created_at").eq("status", "paid"),
  sb().from("smartcore_flexi_workout_logs").select("id", { count: "exact", head: true }),
  sb().from("smartcore_flexi_bookings").select("id", { count: "exact", head: true }).eq("status", "completed"),
]);

const totalRevenue = (payments || []).reduce((s,p) => s + p.amount_pence, 0);
document.getElementById("statsGrid").innerHTML = `
  <div class="fx-card rpt-stat"><div class="rpt-stat-icon" style="background:linear-gradient(135deg,#ff7a45,#ff3d7f)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c0-3.5 2.8-6.3 6.2-6.3s6.2 2.8 6.2 6.3"/><circle cx="17.5" cy="8.5" r="2.5"/><path d="M15.6 13.9c2.5.5 4.4 2.7 4.4 5.4"/></svg></div><div><div class="fx-stat-label">Total Clients</div><div class="fx-stat-val">${(clients||[]).length}</div></div></div>
  <div class="fx-card rpt-stat"><div class="rpt-stat-icon" style="background:linear-gradient(135deg,#16a34a,#0d9488)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7.5 12 3 3 7.5v9L12 21l9-4.5v-9Z"/><path d="M3 7.5 12 12l9-4.5"/><line x1="12" y1="12" x2="12" y2="21"/></svg></div><div><div class="fx-stat-label">Total Revenue</div><div class="fx-stat-val">${fmtMoney(totalRevenue)}</div></div></div>
  <div class="fx-card rpt-stat"><div class="rpt-stat-icon" style="background:linear-gradient(135deg,#6366f1,#a855f7)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="9.5" width="3" height="5" rx="1"/><rect x="18.5" y="9.5" width="3" height="5" rx="1"/><line x1="5.5" y1="12" x2="18.5" y2="12"/><line x1="8" y1="8" x2="8" y2="16"/><line x1="16" y1="8" x2="16" y2="16"/></svg></div><div><div class="fx-stat-label">Workouts Logged</div><div class="fx-stat-val">${workoutCount ?? 0}</div></div></div>
  <div class="fx-card rpt-stat"><div class="rpt-stat-icon" style="background:linear-gradient(135deg,#0ea5b7,#2563eb)"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><line x1="3.5" y1="10" x2="20.5" y2="10"/></svg></div><div><div class="fx-stat-label">Sessions Completed</div><div class="fx-stat-val">${bookingCount ?? 0}</div></div></div>
`;

const months = [];
for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); months.push(d); }
const monthTotals = months.map(m => {
  const next = new Date(m); next.setMonth(next.getMonth() + 1);
  return (payments || []).filter(p => { const dt = new Date(p.created_at); return dt >= m && dt < next; }).reduce((s,p) => s + p.amount_pence, 0);
});
const max = Math.max(...monthTotals, 1);
document.getElementById("revenueChart").innerHTML = months.map((m,i) => `
  <div class="bar-row">
    <div class="bar-label">${m.toLocaleDateString("en-GB",{month:"short",year:"2-digit"})}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(monthTotals[i]/max)*100)}%;background:var(--fx-grad)">${monthTotals[i] ? fmtMoney(monthTotals[i]) : ""}</div></div>
  </div>
`).join("");

const statusCounts = { active: 0, paused: 0, archived: 0 };
(clients || []).forEach(c => { statusCounts[c.status] = (statusCounts[c.status] || 0) + 1; });
const STATUS_COLORS = { active: "linear-gradient(90deg,#16a34a,#0d9488)", paused: "linear-gradient(90deg,#f59e0b,#ef4444)", archived: "linear-gradient(90deg,#64748b,#334155)" };
const maxStatus = Math.max(...Object.values(statusCounts), 1);
document.getElementById("statusChart").innerHTML = Object.entries(statusCounts).map(([k,v]) => `
  <div class="bar-row">
    <div class="bar-label">${k}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.max(4,(v/maxStatus)*100)}%;background:${STATUS_COLORS[k]}">${v || ""}</div></div>
  </div>
`).join("");
</script>
</body>
</html>
