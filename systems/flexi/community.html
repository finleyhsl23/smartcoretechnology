<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<script>try{var t=localStorage.getItem("flexiTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Community — Flexi</title>
<link rel="stylesheet" href="shared/flexi.css"/>
</head>
<body>
<div id="fxLoader"><div class="fx-spinner"></div>Loading…</div>
<div id="fxApp" style="display:none" class="fx-shell">
  <aside class="fx-sidebar" id="fxSidebar"></aside>
  <div class="fx-main">
    <header class="fx-topbar">
      <button class="fx-nav-toggle" id="fxNavToggle">☰</button>
      <div><h1>Community</h1><div class="fx-topbar-sub">Shared updates &amp; challenge leaderboards</div></div>
      <div class="fx-topbar-spacer"></div>
      <button class="fx-btn fx-btn-primary" id="addChallengeBtn">+ New Challenge</button>
    </header>
    <main class="fx-content">
      <div class="fx-section-head"><h2>Post an Update</h2></div>
      <div class="fx-card" style="margin-bottom:28px">
        <div class="fx-field" style="margin-bottom:10px"><textarea class="fx-textarea" id="postBody" placeholder="Share something with all your clients…" style="min-height:60px"></textarea></div>
        <button class="fx-btn fx-btn-primary" id="postBtn">Post</button>
      </div>
      <div id="posts" style="margin-bottom:32px"></div>

      <div class="fx-section-head"><h2>Challenges</h2></div>
      <div id="challenges"></div>
    </main>
  </div>
</div>

<div class="fx-modal" id="addModal">
  <div class="fx-modal-box">
    <div class="fx-modal-head"><h3>New Challenge</h3><button class="fx-modal-close" data-close>✕</button></div>
    <div class="fx-field"><label>Name</label><input class="fx-input" id="chName" placeholder="e.g. October Step Challenge"/></div>
    <div class="fx-field"><label>Metric label</label><input class="fx-input" id="chMetric" placeholder="e.g. Steps, Workouts, Points" value="Points"/></div>
    <div class="fx-form-row">
      <div class="fx-field"><label>Start date</label><input class="fx-input" id="chStart" type="date"/></div>
      <div class="fx-field"><label>End date</label><input class="fx-input" id="chEnd" type="date"/></div>
    </div>
    <div class="fx-form-msg" id="chMsg"></div>
    <button class="fx-btn fx-btn-primary fx-btn-block" id="saveChBtn">Create Challenge</button>
  </div>
</div>

<script type="module">
import { requireFlexiAccess } from "./shared/auth.js";
import { renderNav, wireMobileNavToggle } from "./shared/nav.js";
import { sb } from "./shared/supabase.js";
import { revealApp, setupThemeToggle, escapeHtml, fmtDateTime, fmtDate, setLoading, showMessage, openModal, closeModal, toast, emptyState } from "./shared/ui.js";

const { profile, tier } = await requireFlexiAccess({ feature: "community" });
renderNav({ activeKey: "community", profile, tier });
wireMobileNavToggle();
setupThemeToggle();
revealApp();

async function loadPosts() {
  const { data } = await sb().from("smartcore_flexi_community_posts").select("*, core_employees(full_name), smartcore_flexi_clients(full_name)").order("created_at", { ascending: false }).limit(20);
  const el = document.getElementById("posts");
  el.innerHTML = !data?.length ? emptyState("💬", "No posts yet", "") : data.map(p => `
    <div class="fx-card" style="margin-bottom:10px">
      <div style="font-size:12.5px;font-weight:700;margin-bottom:4px">${escapeHtml(p.core_employees?.full_name || p.smartcore_flexi_clients?.full_name || "Someone")}${p.author_client_id ? ' <span class="fx-badge fx-badge-grey">client</span>' : ""}</div>
      <div style="font-size:13.5px">${escapeHtml(p.body)}</div>
      <div style="font-size:11px;color:var(--fx-text3);margin-top:6px">${fmtDateTime(p.created_at)}</div>
    </div>
  `).join("");
}
document.getElementById("postBtn").addEventListener("click", async (e) => {
  const body = document.getElementById("postBody").value.trim();
  if (!body) return;
  setLoading(e.target, true, "Posting…");
  const { error } = await sb().from("smartcore_flexi_community_posts").insert({ company_id: profile.company_id, author_employee_id: profile.id, body });
  setLoading(e.target, false);
  if (error) { toast(error.message, "error"); return; }
  document.getElementById("postBody").value = "";
  loadPosts();
});

async function loadChallenges() {
  const { data: challenges } = await sb().from("smartcore_flexi_challenges").select("*").order("start_date", { ascending: false });
  const el = document.getElementById("challenges");
  if (!challenges?.length) { el.innerHTML = emptyState("🏆", "No challenges running", "Create one above to spark some friendly competition."); return; }

  const blocks = await Promise.all(challenges.map(async ch => {
    const { data: entries } = await sb().from("smartcore_flexi_challenge_entries").select("*, smartcore_flexi_clients(full_name)").eq("challenge_id", ch.id).order("value", { ascending: false }).limit(10);
    return `
      <div class="fx-card" style="margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div><strong>${escapeHtml(ch.name)}</strong><div style="color:var(--fx-text3);font-size:12px;margin-top:2px">${fmtDate(ch.start_date)} – ${ch.end_date ? fmtDate(ch.end_date) : "ongoing"}</div></div>
        </div>
        ${!entries?.length ? `<p style="color:var(--fx-text3);font-size:12.5px;margin-top:10px">No entries yet.</p>` : `
          <div style="margin-top:12px;display:flex;flex-direction:column;gap:6px">
            ${entries.map((e,i) => `
              <div style="display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--fx-line)">
                <span>${i+1}. ${escapeHtml(e.smartcore_flexi_clients?.full_name || "—")}</span>
                <span class="fx-tabular" style="font-weight:700">${e.value} ${escapeHtml(ch.metric_label)}</span>
              </div>
            `).join("")}
          </div>
        `}
      </div>
    `;
  }));
  el.innerHTML = blocks.join("");
}

document.getElementById("addChallengeBtn").addEventListener("click", () => {
  document.getElementById("chMsg").textContent = "";
  document.getElementById("chStart").value = new Date().toISOString().slice(0,10);
  openModal("addModal");
});
document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", () => closeModal("addModal")));
document.getElementById("saveChBtn").addEventListener("click", async (e) => {
  const name = document.getElementById("chName").value.trim();
  if (!name) { showMessage("chMsg", "Name is required.", "error"); return; }
  setLoading(e.target, true, "Creating…");
  const { error } = await sb().from("smartcore_flexi_challenges").insert({
    company_id: profile.company_id, name,
    metric_label: document.getElementById("chMetric").value.trim() || "Points",
    start_date: document.getElementById("chStart").value || new Date().toISOString().slice(0,10),
    end_date: document.getElementById("chEnd").value || null,
  });
  setLoading(e.target, false);
  if (error) { showMessage("chMsg", error.message, "error"); return; }
  closeModal("addModal");
  toast("Challenge created", "success");
  loadChallenges();
});

loadPosts();
loadChallenges();
</script>
</body>
</html>
