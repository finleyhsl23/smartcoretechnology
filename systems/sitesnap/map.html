<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Live Map — SiteSnap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/systems/sitesnap/shared/sitesnap.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="sl-shell">
  <nav class="sl-sidebar" id="slNav" aria-label="Main navigation"></nav>
  <div id="sidebarOverlay"></div>
  <div class="sl-main">
    <div class="sl-topbar">
      <button class="hamburger icon-btn" id="hamburger" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <h1>Live Map</h1>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><i data-lucide="log-out"></i></button>
    </div>
    <div class="sl-content" id="content"><div id="body"></div></div>
  </div>
</div>
<div id="toastwrap" aria-live="polite"></div>

<script type="module">
  import { requireSiteSnapAccess } from "/systems/sitesnap/shared/auth.js";
  import { shifts } from "/systems/sitesnap/shared/shifts.js";
  import { settings } from "/systems/sitesnap/shared/api.js";
  import { renderNav, initMobileNav, initTopbar } from "/systems/sitesnap/shared/nav.js";
  import { initTheme } from "/systems/sitesnap/shared/theme.js";
  import { loadGoogleMaps } from "/systems/sitesnap/shared/mapPicker.js";
  import { esc, timeAgo, initials, loadingState, emptyState, errorState, permissionDeniedState, setInner } from "/systems/sitesnap/shared/ui.js";

  initTheme();
  const REFRESH_MS = 15000;
  let _profile = null, _companyId = null, _map = null, _infoWindow = null, _markers = new Map(), _pollTimer = null, _firstFit = true, _employeeSearch = "";
  let _myMarker = null, _myWatchId = null, _firstFitMe = true;

  try {
    const { profile, admin, shift } = await requireSiteSnapAccess();
    _profile = profile; _companyId = profile.company_id;
    renderNav("map", profile, { admin, shift });
    initMobileNav();
    initTopbar();

    if (!admin) {
      setInner("body", permissionDeniedState("Only Owners and Admins can view the live Map."));
    } else {
      const companySettings = await settings.get(_companyId);
      if (companySettings?.live_map_enabled === false) {
        setInner("body", `
          <div class="sl-page-head"><div><h2>Live Map</h2></div></div>
          ${emptyState({
            icon: "map-off", title: "Live Map is turned off",
            message: "An Owner or Admin has disabled the Live Map for your company.",
            actionHtml: `<a class="btn btn-primary" href="settings.html">Go to Settings →</a>`,
          })}`);
      } else {
        await renderShell();
        await refresh();
        _pollTimer = setInterval(refresh, REFRESH_MS);
        startMyLocationWatch();
        window.addEventListener("beforeunload", () => { clearInterval(_pollTimer); if (_myWatchId != null) navigator.geolocation.clearWatch(_myWatchId); });
      }
    }
  } catch (e) {
    setInner("body", errorState({ title: "Couldn't load Live Map", message: e.message || "" }));
  }

  async function renderShell() {
    setInner("body", `
      <div class="sl-page-head">
        <div><h2>Live Map</h2><p>Everyone currently signed into a job site. Only updates while a worker's app is open.</p></div>
        <button class="btn" id="recenterBtn"><i data-lucide="locate-fixed"></i> Recenter</button>
      </div>
      <div class="sl-toolbar">
        <div class="sl-search-wrap" style="max-width:260px;width:100%">
          <i data-lucide="search" class="sl-search-icon"></i>
          <input class="form-input" id="employeeSearch" placeholder="Search by employee…" autocomplete="off"/>
          <div class="sl-search-results" id="employeeResults"></div>
        </div>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div id="mapHost" style="height:65vh;min-height:420px"></div>
      </div>
      <p class="text-muted" id="mapEmptyNote" style="margin-top:10px"></p>
    `);
    window.lucide?.createIcons?.();
    document.getElementById("recenterBtn").addEventListener("click", () => fitToMarkers());
    const searchInput = document.getElementById("employeeSearch");
    searchInput.addEventListener("input", (e) => {
      _employeeSearch = e.target.value;
      applyEmployeeFilter();
      renderSearchResults();
    });
    searchInput.addEventListener("focus", () => renderSearchResults());
    searchInput.addEventListener("blur", () => setTimeout(() => { document.getElementById("employeeResults").style.display = "none"; }, 150));

    await loadGoogleMaps();
    _map = new google.maps.Map(document.getElementById("mapHost"), {
      center: { lat: 20, lng: 0 }, zoom: 2,
      streetViewControl: false, mapTypeControl: false, fullscreenControl: false,
    });
    _infoWindow = new google.maps.InfoWindow();
  }

  async function refresh() {
    try {
      const active = await shifts.listActiveForCompany(_companyId);
      updateMarkers(active);
      applyEmployeeFilter();
      renderSearchResults();
    } catch (e) {
      // Silent — a transient poll failure shouldn't disrupt the map view.
    }
  }

  function updateMarkers(active) {
    const seen = new Set();
    for (const s of active) {
      if (s.last_lat == null || s.last_lng == null) continue;
      seen.add(s.id);
      const pos = { lat: s.last_lat, lng: s.last_lng };
      const name = s.core_employees?.full_name || "Unknown";
      const projectName = s.sitesnap_projects?.name || "Unknown";
      const content = `<strong>${esc(name)}</strong><br/>${esc(projectName)}<br/><span style="color:#888">Updated ${esc(timeAgo(s.last_ping_at || s.clock_in_at))}</span>`;

      if (_markers.has(s.id)) {
        const entry = _markers.get(s.id);
        entry.marker.setPosition(pos);
        entry.content = content;
        entry.name = name;
        entry.projectName = projectName;
      } else {
        const marker = new google.maps.Marker({
          position: pos, map: _map,
          icon: { path: google.maps.SymbolPath.CIRCLE, scale: 16, fillColor: "#1e5cff", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 2 },
          label: { text: initials(name), color: "#fff", fontSize: "11px", fontWeight: "700" },
        });
        const entry = { marker, content, name, projectName };
        marker.addListener("click", () => { _infoWindow.setContent(entry.content); _infoWindow.open(_map, marker); });
        _markers.set(s.id, entry);
      }
    }
    // Remove markers for shifts no longer active.
    for (const [id, entry] of _markers) {
      if (!seen.has(id)) { entry.marker.setMap(null); _markers.delete(id); }
    }
    if (_firstFit && _markers.size) { _firstFit = false; fitToMarkers(); }
  }

  function applyEmployeeFilter() {
    const q = _employeeSearch.trim().toLowerCase();
    let anyVisible = false;
    _markers.forEach((entry) => {
      const match = !q || entry.name.toLowerCase().includes(q);
      entry.marker.setVisible(match);
      if (match) anyVisible = true;
    });

    const note = document.getElementById("mapEmptyNote");
    if (note) {
      if (_markers.size === 0) note.textContent = "No one is currently signed in.";
      else if (q && !anyVisible) note.textContent = `No one matching "${_employeeSearch}" is currently signed in.`;
      else note.textContent = "";
    }
  }

  function renderSearchResults() {
    const resultsEl = document.getElementById("employeeResults");
    if (!resultsEl) return;
    const q = _employeeSearch.trim().toLowerCase();
    const matches = q ? [..._markers.entries()].filter(([, entry]) => entry.name.toLowerCase().includes(q)) : [];
    if (!matches.length) {
      resultsEl.style.display = "none";
      resultsEl.innerHTML = "";
      return;
    }
    resultsEl.style.display = "";
    resultsEl.innerHTML = matches.map(([id, entry]) => `
      <div class="sl-search-result-row" data-select-employee="${esc(id)}" tabindex="0">
        <div class="sl-search-result-name">${esc(entry.name)}</div>
        <div class="sl-search-result-meta">${esc(entry.projectName)}</div>
      </div>`).join("");
    resultsEl.querySelectorAll("[data-select-employee]").forEach(row => {
      row.addEventListener("mousedown", (e) => e.preventDefault()); // survive the input's blur
      row.addEventListener("click", () => selectEmployee(row.dataset.selectEmployee));
    });
  }

  function selectEmployee(id) {
    const entry = _markers.get(id);
    if (!entry) return;
    _employeeSearch = "";
    document.getElementById("employeeSearch").value = entry.name;
    document.getElementById("employeeResults").style.display = "none";
    applyEmployeeFilter(); // clears the filter — everyone stays visible

    _map.panTo(entry.marker.getPosition());
    _map.setZoom(16);
    _infoWindow.setContent(entry.content);
    _infoWindow.open(_map, entry.marker);
  }

  function fitToMarkers() {
    const visible = [..._markers.values()].filter(e => e.marker.getVisible());
    if (!visible.length && !_myMarker) return;
    const bounds = new google.maps.LatLngBounds();
    visible.forEach(e => bounds.extend(e.marker.getPosition()));
    if (_myMarker) bounds.extend(_myMarker.getPosition());
    _map.fitBounds(bounds, 50);
    google.maps.event.addListenerOnce(_map, "bounds_changed", () => {
      if (_map.getZoom() > 16) _map.setZoom(16);
    });
  }

  // Shows where the admin viewing this map currently is, distinct from the
  // employee markers — not tied to a shift, just "whoever's looking at this
  // map right now". Best-effort: silently skipped if location is
  // unavailable/denied, same as everywhere else location is optional.
  function startMyLocationWatch() {
    if (!navigator.geolocation) return;
    _myWatchId = navigator.geolocation.watchPosition(
      (pos) => {
        const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (_myMarker) {
          _myMarker.setPosition(latlng);
        } else {
          _myMarker = new google.maps.Marker({
            position: latlng, map: _map, zIndex: 999,
            icon: { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: "#22c55e", fillOpacity: 1, strokeColor: "#fff", strokeWeight: 3 },
          });
          _myMarker.addListener("click", () => { _infoWindow.setContent("<strong>You</strong>"); _infoWindow.open(_map, _myMarker); });
          if (_firstFitMe) { _firstFitMe = false; fitToMarkers(); }
        }
      },
      () => {}, // ignore errors — the map still works without your own position
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
    );
  }
</script>
</body>
</html>
