<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>My Hours — SiteSnap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/systems/sitesnap/shared/sitesnap.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="sl-shell">
  <nav class="sl-sidebar" id="slNav" aria-label="Main navigation"></nav>
  <div id="sidebarOverlay"></div>
  <div class="sl-main">
    <div class="sl-topbar">
      <button class="hamburger icon-btn" id="hamburger" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <h1>My Hours</h1>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><i data-lucide="log-out"></i></button>
    </div>
    <div class="sl-content" id="content"><div id="body"></div></div>
  </div>
</div>
<div id="toastwrap" aria-live="polite"></div>

<script type="module">
  import { requireSiteSnapAccess } from "/systems/sitesnap/shared/auth.js";
  import { shifts } from "/systems/sitesnap/shared/shifts.js";
  import { renderNav, initMobileNav, initTopbar } from "/systems/sitesnap/shared/nav.js";
  import { initTheme } from "/systems/sitesnap/shared/theme.js";
  import { esc, fmtDateTime, loadingState, emptyState, errorState, setInner } from "/systems/sitesnap/shared/ui.js";

  initTheme();
  let _profile = null, _companyId = null, _range = "week", _myShifts = [];

  try {
    const { profile, admin, shift } = await requireSiteSnapAccess();
    _profile = profile; _companyId = profile.company_id;
    renderNav("my-hours", profile, { admin, shift });
    initMobileNav();
    initTopbar();
    await load();
  } catch (e) {
    setInner("body", errorState({ title: "Couldn't load My Hours", message: e.message || "" }));
  }

  function rangeBounds(range) {
    const now = new Date();
    const start = new Date(now);
    if (range === "today") { start.setHours(0, 0, 0, 0); }
    else if (range === "week") { const day = (start.getDay() + 6) % 7; start.setDate(start.getDate() - day); start.setHours(0, 0, 0, 0); }
    else if (range === "month") { start.setDate(1); start.setHours(0, 0, 0, 0); }
    else if (range === "year") { start.setMonth(0, 1); start.setHours(0, 0, 0, 0); }
    return { from: start.toISOString(), to: now.toISOString() };
  }

  async function load() {
    setInner("body", loadingState("Loading your hours…"));
    try {
      let from = null, to = null;
      if (_range === "custom") {
        const fromEl = document.getElementById("customFrom"), toEl = document.getElementById("customTo");
        from = fromEl?.value ? new Date(fromEl.value + "T00:00:00").toISOString() : null;
        to = toEl?.value ? new Date(toEl.value + "T23:59:59").toISOString() : null;
      } else {
        const bounds = rangeBounds(_range);
        from = bounds.from; to = bounds.to;
      }
      _myShifts = await shifts.listForCompany(_companyId, { from, to, employeeId: _profile.id });
      render();
    } catch (e) {
      setInner("body", errorState({ title: "Couldn't load your hours", message: e.message || "", retryId: "retry" }));
      document.getElementById("retry")?.addEventListener("click", load);
    }
  }

  function durationHours(s) {
    const start = new Date(s.clock_in_at).getTime();
    const end = s.clock_out_at ? new Date(s.clock_out_at).getTime() : Date.now();
    return Math.max(0, (end - start) / 3600000);
  }

  function fmtHours(h) {
    const totalMinutes = Math.round(h * 60);
    const hh = Math.floor(totalMinutes / 60);
    const mm = totalMinutes % 60;
    return mm === 0 ? `${hh}h` : `${hh}h ${mm}m`;
  }

  function render() {
    const byProject = new Map();
    let totalHours = 0;
    for (const s of _myShifts) {
      const hrs = durationHours(s);
      totalHours += hrs;
      const projName = s.sitesnap_projects?.name || "Unknown";
      const p = byProject.get(projName) || { hours: 0, shiftCount: 0 };
      p.hours += hrs; p.shiftCount += 1;
      byProject.set(projName, p);
    }
    const projectRows = [...byProject.entries()].sort((a, b) => b[1].hours - a[1].hours);

    setInner("body", `
      <div class="sl-page-head">
        <div><h2>My Hours</h2><p>Your own attendance and the projects you've worked on.</p></div>
      </div>

      <div class="sl-toolbar" style="margin-bottom:16px">
        ${["today", "week", "month", "year", "custom"].map(r => `<button class="btn ${_range === r ? "btn-primary" : ""}" data-range="${r}">${{ today: "Today", week: "This Week", month: "This Month", year: "This Year", custom: "Custom" }[r]}</button>`).join("")}
      </div>
      ${_range === "custom" ? `
      <div class="sl-toolbar" style="margin-bottom:16px">
        <input type="date" class="form-input" id="customFrom" style="max-width:170px"/>
        <span class="text-muted">to</span>
        <input type="date" class="form-input" id="customTo" style="max-width:170px"/>
        <button class="btn btn-primary" id="applyCustom">Apply</button>
      </div>` : ""}

      <div class="stat-grid" style="margin-bottom:16px">
        <div class="stat-card"><div class="stat-value">${fmtHours(totalHours)}</div><div class="stat-label">Total Hours</div></div>
        <div class="stat-card"><div class="stat-value">${_myShifts.length}</div><div class="stat-label">Shifts</div></div>
        <div class="stat-card"><div class="stat-value">${projectRows.length}</div><div class="stat-label">Projects</div></div>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h2 style="margin:0 0 12px;font-size:15px">Projects You're On</h2>
        ${projectRows.length === 0 ? `<p class="text-muted">No shifts in this period.</p>` : `
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th>Shifts</th><th>Hours</th></tr></thead><tbody>
          ${projectRows.map(([name, v]) => `<tr><td>${esc(name)}</td><td>${v.shiftCount}</td><td>${fmtHours(v.hours)}</td></tr>`).join("")}
        </tbody></table></div>`}
      </div>

      <div class="card">
        <h2 style="margin:0 0 12px;font-size:15px">Shift Log</h2>
        ${_myShifts.length === 0 ? emptyState({ icon: "clock", title: "No shifts in this period" }) : `
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Project</th><th>Clock In</th><th>Clock Out</th><th>Hours</th><th>Status</th></tr></thead><tbody>
          ${_myShifts.map(shiftRow).join("")}
        </tbody></table></div>`}
      </div>
    `);
    window.lucide?.createIcons?.();
    document.querySelectorAll("[data-range]").forEach(btn => btn.addEventListener("click", () => { _range = btn.dataset.range; if (_range === "custom") render(); else load(); }));
    document.getElementById("applyCustom")?.addEventListener("click", load);
  }

  function shiftRow(s) {
    const hrs = durationHours(s);
    const statusLabel = s.status === "active" ? `<span class="badge badge-green">Active</span>`
      : s.clock_out_reason === "auto_geofence" ? `<span class="badge badge-grey">Auto (left radius)</span>`
      : `<span class="badge badge-blue">Closed</span>`;
    return `<tr>
      <td>${esc(s.sitesnap_projects?.name || "Unknown")}</td>
      <td>${esc(fmtDateTime(s.clock_in_at))}</td>
      <td>${s.clock_out_at ? esc(fmtDateTime(s.clock_out_at)) : "—"}</td>
      <td>${fmtHours(hrs)}</td>
      <td>${statusLabel}</td>
    </tr>`;
  }
</script>
</body>
</html>
