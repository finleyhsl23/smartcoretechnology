<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tasks — SiteSnap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/systems/sitesnap/shared/sitesnap.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="sl-shell">
  <nav class="sl-sidebar" id="slNav" aria-label="Main navigation"></nav>
  <div id="sidebarOverlay"></div>
  <div class="sl-main">
    <div class="sl-topbar">
      <button class="hamburger icon-btn" id="hamburger" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <h1>Tasks</h1>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><i data-lucide="log-out"></i></button>
    </div>
    <div class="sl-content" id="content"><div id="body"></div></div>
  </div>
</div>
<div id="toastwrap" aria-live="polite"></div>

<script type="module">
  import { requireSiteSnapAccess, hasPermission } from "/systems/sitesnap/shared/auth.js";
  import { tasks, projects, employees } from "/systems/sitesnap/shared/api.js";
  import { renderNav, initMobileNav, initTopbar } from "/systems/sitesnap/shared/nav.js";
  import { initTheme } from "/systems/sitesnap/shared/theme.js";
  import { esc, fmtDate, loadingState, emptyState, errorState, setInner, toast, modal } from "/systems/sitesnap/shared/ui.js";
  import { sendPush } from "/systems/sitesnap/shared/notifications.js";
  import { completeTaskWithPhoto, viewTaskPhoto } from "/systems/sitesnap/shared/taskPhoto.js";

  initTheme();
  let _profile = null, _companyId = null, _scope = "mine", _statusFilter = "open";
  let _activeProjects = [], _companyEmployees = [];

  try {
    const { profile, admin, shift } = await requireSiteSnapAccess();
    _profile = profile; _companyId = profile.company_id;

    if (!admin && shift) {
      window.location.href = `project-detail.html?id=${encodeURIComponent(shift.project_id)}`;
      throw new Error("Redirecting to your project");
    }

    renderNav("tasks", profile, { admin, shift });
    initMobileNav();
    initTopbar();
    if (hasPermission("sitesnap.manage_tasks")) {
      [_activeProjects, _companyEmployees] = await Promise.all([
        projects.list(_companyId, { status: "active" }), employees.listForCompany(_companyId),
      ]);
    }
    await load();
  } catch (e) {
    setInner("body", errorState({ title: "Couldn't load Tasks", message: e.message || "" }));
  }

  async function load() {
    setInner("body", loadingState("Loading tasks…"));
    try {
      const opts = _statusFilter === "all" ? {} : { status: _statusFilter };
      if (_scope === "mine") opts.assigneeId = _profile.id;
      const list = await tasks.listForCompany(_companyId, opts);
      render(list);
    } catch (e) {
      setInner("body", errorState({ title: "Couldn't load tasks", message: e.message || "", retryId: "retry" }));
      document.getElementById("retry")?.addEventListener("click", load);
    }
  }

  function render(list) {
    const canManage = hasPermission("sitesnap.manage_tasks");
    setInner("body", `
      <div class="sl-page-head">
        <div><h2>Tasks</h2><p>Everything assigned across your SiteSnap projects.</p></div>
        ${canManage ? `<button class="btn btn-primary" id="newTaskBtn"><i data-lucide="plus"></i> New Task</button>` : ""}
      </div>
      <div class="sl-toolbar">
        <select class="form-select" id="scopeSelect" style="max-width:160px">
          <option value="mine" ${_scope === "mine" ? "selected" : ""}>My Tasks</option>
          <option value="all" ${_scope === "all" ? "selected" : ""}>All Tasks</option>
        </select>
        <select class="form-select" id="statusSelect" style="max-width:160px">
          <option value="open" ${_statusFilter === "open" ? "selected" : ""}>Open</option>
          <option value="in_progress" ${_statusFilter === "in_progress" ? "selected" : ""}>In Progress</option>
          <option value="done" ${_statusFilter === "done" ? "selected" : ""}>Done</option>
          <option value="all" ${_statusFilter === "all" ? "selected" : ""}>All</option>
        </select>
      </div>
      ${list.length === 0 ? emptyState({
        icon: "check-square", title: "No tasks found",
        actionHtml: canManage ? `<button class="btn btn-primary" id="emptyNewTaskBtn"><i data-lucide="plus"></i> New Task</button>` : "",
      }) : list.map(taskRow).join("")}
    `);
    document.getElementById("scopeSelect").addEventListener("change", (e) => { _scope = e.target.value; load(); });
    document.getElementById("statusSelect").addEventListener("change", (e) => { _statusFilter = e.target.value; load(); });
    document.getElementById("newTaskBtn")?.addEventListener("click", openNewTaskModal);
    document.getElementById("emptyNewTaskBtn")?.addEventListener("click", openNewTaskModal);
    document.querySelectorAll("[data-task-toggle]").forEach(cb => cb.addEventListener("change", async () => {
      const taskId = cb.dataset.taskToggle;
      if (!cb.checked) {
        await tasks.update(taskId, { status: "open" });
        toast("success", "Task updated");
        load();
        return;
      }
      const task = list.find(t => t.id === taskId);
      cb.checked = false; // revert until the photo is confirmed
      completeTaskWithPhoto(task, {
        companyId: _companyId, employeeId: _profile.id,
        onDone: () => load(),
        onCancel: () => { cb.checked = false; },
      });
    }));
    document.querySelectorAll("[data-view-photo]").forEach(btn => btn.addEventListener("click", () => {
      viewTaskPhoto(list.find(t => t.id === btn.dataset.viewPhoto));
    }));
  }

  function openNewTaskModal() {
    if (!_activeProjects.length) {
      toast("error", "No active projects", "Create a project before adding tasks.");
      return;
    }
    const overlay = modal(`
      <div class="modal-header"><h3>New Task</h3><button class="modal-close">&times;</button></div>
      <div class="modal-body">
        <div class="form-field"><label class="form-label">Project *</label>
          <select class="form-select" id="ntProject">${_activeProjects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
        </div>
        <div class="form-field"><label class="form-label">Title *</label><input class="form-input" id="ntTitle"/></div>
        <div class="form-field"><label class="form-label">Description</label><textarea class="form-textarea" id="ntDesc"></textarea></div>
        <div class="form-row">
          <div class="form-field"><label class="form-label">Assignee</label>
            <select class="form-select" id="ntAssignee"><option value="">Unassigned</option>${_companyEmployees.map(e => `<option value="${e.id}">${esc(e.full_name)}</option>`).join("")}</select>
          </div>
          <div class="form-field"><label class="form-label">Priority</label>
            <select class="form-select" id="ntPriority"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option></select>
          </div>
        </div>
        <div class="form-field"><label class="form-label">Due date</label><input type="date" class="form-input" id="ntDue"/></div>
        <div id="ntError" class="form-error"></div>
      </div>
      <div class="modal-footer"><button class="btn" id="cancel">Cancel</button><button class="btn btn-primary" id="save">Add Task</button></div>
    `);
    overlay.querySelectorAll(".modal-close, #cancel").forEach(b => b.addEventListener("click", () => overlay.remove()));
    overlay.querySelector("#save").addEventListener("click", async () => {
      const title = overlay.querySelector("#ntTitle").value.trim();
      const projectId = overlay.querySelector("#ntProject").value;
      if (!title) { overlay.querySelector("#ntError").textContent = "Title is required."; return; }
      const assigneeId = overlay.querySelector("#ntAssignee").value || null;
      const project = _activeProjects.find(p => p.id === projectId);
      try {
        await tasks.create({
          project_id: projectId, company_id: _companyId, title,
          description: overlay.querySelector("#ntDesc").value.trim() || null,
          assignee_employee_id: assigneeId,
          priority: overlay.querySelector("#ntPriority").value,
          due_date: overlay.querySelector("#ntDue").value || null,
          created_by: _profile.id,
        });
        overlay.remove();
        toast("success", "Task added");
        load();

        if (assigneeId && assigneeId !== _profile.id) {
          sendPush({
            employeeId: assigneeId, companyId: _companyId,
            title: "New task assigned to you", body: `${title} — ${project?.name || ""}`,
            url: "/systems/sitesnap/tasks.html",
          });
        }
      } catch (e) {
        overlay.querySelector("#ntError").textContent = e.message || "Could not create task.";
      }
    });
  }

  function taskRow(t) {
    const badge = { low: "badge-grey", normal: "badge-blue", high: "badge-red" }[t.priority] || "badge-grey";
    return `
      <a href="project-detail.html?id=${esc(t.project_id)}" class="sl-task-row ${t.status === "done" ? "done" : ""}" style="text-decoration:none;color:inherit">
        <input type="checkbox" data-task-toggle="${t.id}" onclick="event.stopPropagation()" ${t.status === "done" ? "checked" : ""} style="width:20px;height:20px;accent-color:var(--accent)"/>
        <div style="flex:1">
          <div class="sl-task-title">${esc(t.title)}</div>
          <div class="sl-task-meta">
            <span class="badge ${badge}">${esc(t.priority)}</span>
            <span><i data-lucide="folder-kanban" style="width:11px;height:11px;vertical-align:-1px"></i> ${esc(t.sitesnap_projects?.name || "")}</span>
            ${t.due_date ? `<span><i data-lucide="calendar" style="width:11px;height:11px;vertical-align:-1px"></i> ${esc(fmtDate(t.due_date))}</span>` : ""}
            ${t.core_employees ? `<span>${esc(t.core_employees.full_name)}</span>` : ""}
          </div>
        </div>
        ${t.status === "done" && t.sitesnap_media?.length ? `<button class="btn" data-view-photo="${esc(t.id)}" onclick="event.stopPropagation()" style="flex-shrink:0"><i data-lucide="image"></i> See Photo</button>` : ""}
      </a>`;
  }
</script>
</body>
</html>
