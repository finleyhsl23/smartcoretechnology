name = "smartcore-cron"
main = "worker.js"
compatibility_date = "2024-01-01"

[triggers]
# "0 8 * * *"    — once-daily jobs (invoices, reminders, etc.)
# "*/15 * * * *" — frequent jobs whose timing is per-record, not fixed UTC
#                  (e.g. presence auto sign-out, due at whatever local time
#                  each site configures)
crons = ["0 8 * * *", "*/15 * * * *"]
