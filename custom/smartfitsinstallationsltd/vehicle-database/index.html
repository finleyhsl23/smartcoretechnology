<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Vehicle Installations Database — SmartCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/custom/smartfitsinstallationsltd/vehicle-database/shared/vehicledb.css"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="vdb-shell">
  <nav class="vdb-sidebar" id="vdbNav" aria-label="Main navigation"></nav>
  <div id="sidebarOverlay"></div>

  <div class="vdb-main">
    <div class="vdb-topbar">
      <button class="hamburger icon-btn" id="hamburger" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <h1>Vehicle Installations Database</h1>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out" title="Sign out"><i data-lucide="log-out"></i></button>
    </div>
    <div class="vdb-content" id="content">
      <div id="body"></div>
    </div>
  </div>
</div>
<div id="toastwrap" aria-live="polite"></div>

<script type="module">
  import { requireModuleAccess } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/auth.js";
  import { searchVehicles, listRecentVehicles, getVehicleByRegistration, searchVehiclesByMakeModelYear } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/api.js";
  import { renderNav, initMobileNav, initTopbar } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/nav.js";
  import { initTheme } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/theme.js";
  import { esc, setInner, loadingState, emptyState, errorState, modal, toast } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/ui.js";

  initTheme();
  const BASE = "/custom/smartfitsinstallationsltd/vehicle-database";
  let _profile, _tier;

  try {
    const { profile, tier } = await requireModuleAccess();
    _profile = profile; _tier = tier;
    renderNav("home", profile, tier);
    initMobileNav();
    initTopbar();
    await render();
  } catch (e) {
    if (!document.body.innerHTML.includes("vdb-state")) {
      setInner("body", errorState({ title: "Couldn't load this page", message: e.message }));
    }
  }

  async function render() {
    setInner("body", loadingState("Loading vehicles…"));
    try {
      const vehicles = await listRecentVehicles(24);
      draw(vehicles, "");
    } catch (e) {
      setInner("body", errorState({ title: "Couldn't load vehicles", message: e.message }));
    }
  }

  function draw(vehicles, query) {
    const isManagerOrAbove = _tier === "owner_admin" || _tier === "manager";
    const html = `
      <div class="page-head">
        <div>
          <h2>Search Vehicles</h2>
          <p>Look up a vehicle by registration, VIN, make or model to see its full install profile.</p>
        </div>
        <div class="page-head-actions">
          <button class="btn btn-primary" id="findVehicleBtn"><i data-lucide="search"></i> Search</button>
        </div>
      </div>
      <div class="search-wrap">
        <i data-lucide="search" class="search-icon"></i>
        <input type="text" id="vehSearch" class="form-input" placeholder="Search by reg, VIN, make or model…" autocomplete="off" value="${esc(query)}"/>
      </div>
      <div id="results"></div>
    `;
    setInner("body", html);
    renderResults(vehicles, query);
    document.getElementById("findVehicleBtn").addEventListener("click", () => openFindVehicleModal(isManagerOrAbove));

    const input = document.getElementById("vehSearch");
    input.focus();
    input.setSelectionRange(query.length, query.length);
    let debounce;
    input.addEventListener("input", (e) => {
      clearTimeout(debounce);
      const q = e.target.value;
      debounce = setTimeout(async () => {
        try {
          const results = q.trim() ? await searchVehicles(q) : await listRecentVehicles(24);
          renderResults(results, q);
        } catch (err) {
          setInner("results", errorState({ title: "Search failed", message: err.message }));
        }
      }, 250);
    });
  }

  function renderResults(vehicles, query) {
    const container = document.getElementById("results");
    if (!container) return;
    if (!vehicles.length) {
      container.innerHTML = emptyState({
        icon: "car",
        title: query.trim() ? "No matches" : "No vehicles added yet",
        message: query.trim() ? "Try a different registration, VIN, make or model." : "Vehicles added here will show up as recent.",
      });
    } else {
      container.innerHTML = `<div class="veh-grid">${vehicles.map(vehicleCard).join("")}</div>`;
    }
    container.querySelectorAll("[data-veh-id]").forEach(card => {
      card.addEventListener("click", () => {
        window.location.href = `${BASE}/vehicle-detail.html?id=${card.dataset.vehId}`;
      });
    });
    window.lucide?.createIcons?.();
  }

  function vehicleCard(v) {
    const title = [v.make, v.model].filter(Boolean).join(" ") || "Make/model not set";
    const meta = [v.year_of_manufacture, v.colour].filter(Boolean).join(" · ");
    return `
      <div class="veh-card" data-veh-id="${esc(v.id)}">
        <span class="veh-card-reg">${esc(formatReg(v.registration))}</span>
        <div class="veh-card-title">${esc(title)}</div>
        ${meta ? `<div class="veh-card-meta">${esc(meta)}</div>` : ""}
        ${v.vin ? `<div class="veh-card-meta">VIN: ${esc(v.vin)}</div>` : ""}
      </div>`;
  }

  function formatReg(reg) {
    return reg || "—";
  }

  // ── Find (or Create) Vehicle modal ───────────────────────────────────────
  // Two search modes: by registration, or by make/model/year. "Create
  // Vehicle" only ever appears after a registration search comes up empty —
  // never from the make/model/year search — so a new vehicle can't be
  // created without first confirming its reg isn't already in the database.
  function openFindVehicleModal(isManagerOrAbove) {
    const overlay = modal(`
      <div class="modal-header">
        <h3>Find a Vehicle</h3>
        <button class="btn modal-close" aria-label="Close"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <div class="pill-row">
          <button class="pill active" data-mode="reg" type="button">By Registration</button>
          <button class="pill" data-mode="mmy" type="button">By Make, Model &amp; Year</button>
        </div>

        <div data-panel="reg">
          <div class="form-row">
            <label class="form-label" for="findReg">Registration</label>
            <div style="display:flex;gap:8px">
              <input type="text" id="findReg" class="form-input" style="text-transform:uppercase" placeholder="e.g. AB12 CDE" autocomplete="off"/>
              <button class="btn btn-primary" id="findRegBtn" type="button" style="white-space:nowrap"><i data-lucide="search"></i> Search</button>
            </div>
          </div>
          <div id="findRegResult"></div>
        </div>

        <div data-panel="mmy" style="display:none">
          <div class="form-grid">
            <div class="form-row"><label class="form-label" for="findMake">Make</label><input type="text" id="findMake" class="form-input" autocomplete="off"/></div>
            <div class="form-row"><label class="form-label" for="findModel">Model</label><input type="text" id="findModel" class="form-input" autocomplete="off"/></div>
            <div class="form-row"><label class="form-label" for="findYear">Year</label><input type="number" id="findYear" class="form-input" autocomplete="off"/></div>
          </div>
          <button class="btn btn-primary" id="findMmyBtn" type="button"><i data-lucide="search"></i> Search</button>
          <div id="findMmyResult" style="margin-top:14px"></div>
        </div>
      </div>
    `, {});
    window.lucide?.createIcons?.();

    overlay.querySelectorAll(".pill[data-mode]").forEach(btn => {
      btn.addEventListener("click", () => {
        overlay.querySelectorAll(".pill[data-mode]").forEach(b => b.classList.toggle("active", b === btn));
        overlay.querySelectorAll("[data-panel]").forEach(p => p.style.display = p.dataset.panel === btn.dataset.mode ? "" : "none");
      });
    });

    const regInput = overlay.querySelector("#findReg");
    const runRegSearch = () => searchByRegistration(overlay, regInput.value.trim(), isManagerOrAbove);
    overlay.querySelector("#findRegBtn").addEventListener("click", runRegSearch);
    regInput.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runRegSearch(); } });
    regInput.focus();

    const runMmySearch = () => searchByMakeModelYear(overlay);
    overlay.querySelector("#findMmyBtn").addEventListener("click", runMmySearch);
    ["#findMake", "#findModel", "#findYear"].forEach(sel => {
      overlay.querySelector(sel).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); runMmySearch(); } });
    });
  }

  async function searchByRegistration(overlay, reg, isManagerOrAbove) {
    const resultEl = overlay.querySelector("#findRegResult");
    if (!reg) { toast("error", "Enter a registration first"); return; }
    resultEl.innerHTML = loadingState("Searching…");
    try {
      const existing = await getVehicleByRegistration(reg);
      if (existing) {
        const title = [existing.make, existing.model, existing.year_of_manufacture].filter(Boolean).join(" ");
        resultEl.innerHTML = `
          <div class="card" style="margin-top:14px">
            <span class="veh-card-reg">${esc(existing.registration)}</span>
            <div class="veh-card-title" style="margin-top:10px">${esc(title || "Make/model not set")}</div>
            <a class="btn btn-primary" style="margin-top:12px" href="${BASE}/vehicle-detail.html?id=${esc(existing.id)}">View Vehicle →</a>
          </div>`;
      } else if (isManagerOrAbove) {
        resultEl.innerHTML = `
          <div class="card" style="margin-top:14px;border-color:var(--warn)">
            <p style="margin:0 0 12px">No vehicle found with registration <strong>${esc(reg.toUpperCase())}</strong>.</p>
            <a class="btn btn-primary" href="${BASE}/vehicle-form.html?registration=${esc(reg)}"><i data-lucide="plus"></i> Create Vehicle</a>
          </div>`;
      } else {
        resultEl.innerHTML = `
          <div class="card" style="margin-top:14px;border-color:var(--warn)">
            <p style="margin:0">No vehicle found with registration <strong>${esc(reg.toUpperCase())}</strong>. Ask a Senior Regional Engineering Manager to add it.</p>
          </div>`;
      }
      window.lucide?.createIcons?.();
    } catch (e) {
      resultEl.innerHTML = "";
      toast("error", "Search failed", e.message);
    }
  }

  async function searchByMakeModelYear(overlay) {
    const resultEl = overlay.querySelector("#findMmyResult");
    const make = overlay.querySelector("#findMake").value.trim();
    const model = overlay.querySelector("#findModel").value.trim();
    const year = overlay.querySelector("#findYear").value.trim();
    if (!make && !model && !year) { toast("error", "Enter at least a make, model or year"); return; }

    resultEl.innerHTML = loadingState("Searching…");
    try {
      const matches = await searchVehiclesByMakeModelYear({ make, model, year });
      if (!matches.length) {
        resultEl.innerHTML = `
          <div class="card" style="border-color:var(--warn)">
            <p style="margin:0">No vehicles found for that make, model and year. Search by registration to add a new one.</p>
          </div>`;
        return;
      }
      resultEl.innerHTML = matches.map(v => {
        const title = [v.make, v.model, v.year_of_manufacture].filter(Boolean).join(" ");
        return `
          <div class="veh-card" data-veh-id="${esc(v.id)}" style="margin-bottom:10px;cursor:pointer">
            <span class="veh-card-reg">${esc(v.registration)}</span>
            <div class="veh-card-title" style="margin-top:8px">${esc(title || "Make/model not set")}</div>
          </div>`;
      }).join("");
      resultEl.querySelectorAll("[data-veh-id]").forEach(card => {
        card.addEventListener("click", () => { window.location.href = `${BASE}/vehicle-detail.html?id=${card.dataset.vehId}`; });
      });
    } catch (e) {
      resultEl.innerHTML = "";
      toast("error", "Search failed", e.message);
    }
  }
</script>
</body>
</html>
