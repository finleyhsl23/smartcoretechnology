<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Top Contributors — SmartCore Vehicle Installations Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/custom/smartfitsinstallationsltd/vehicle-database/shared/vehicledb.css"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/custom/smartfitsinstallationsltd/vehicle-database/shared/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/custom/smartfitsinstallationsltd/vehicle-database/shared/favicon-16.png"/>
  <link rel="apple-touch-icon" href="/custom/smartfitsinstallationsltd/vehicle-database/shared/apple-touch-icon.png"/>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body>
<div class="vdb-shell">
  <nav class="vdb-sidebar" id="vdbNav" aria-label="Main navigation"></nav>
  <div id="sidebarOverlay"></div>

  <div class="vdb-main">
    <div class="vdb-topbar">
      <button class="hamburger icon-btn" id="hamburger" aria-label="Open menu"><i data-lucide="menu"></i></button>
      <h1>Top Contributors</h1>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme"><i data-lucide="moon"></i></button>
      <button class="icon-btn" id="logoutBtn" aria-label="Sign out"><i data-lucide="log-out"></i></button>
    </div>
    <div class="vdb-content" id="content">
      <div id="body"></div>
    </div>
  </div>
</div>
<div id="toastwrap" aria-live="polite"></div>

<script type="module">
  import { requireModuleAccess } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/auth.js";
  import { listContributorLeaderboard, listApprovalLeaderboard, getEmployeesByIds, LEADERBOARD_PERIODS, getLeaderboardPeriodRange } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/api.js";
  import { renderNav, initMobileNav, initTopbar } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/nav.js";
  import { initTheme } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/theme.js";
  import { esc, initials, setInner, loadingState, emptyState, errorState, initCustomSelect, toast } from "/custom/smartfitsinstallationsltd/vehicle-database/shared/ui.js";

  initTheme();
  let _isManagerOrAbove = false;
  let _periodKey = "all";
  let _customFrom = "";
  let _customTo = "";
  let _periodSelect = null;

  try {
    const { profile, tier } = await requireModuleAccess();
    _isManagerOrAbove = tier === "owner_admin" || tier === "manager";
    renderNav("leaderboard", profile, tier);
    initMobileNav();
    initTopbar();
    drawShell();
    await render();
  } catch (e) {
    if (document.getElementById("body")) {
      setInner("body", errorState({ title: "Couldn't load Top Contributors", message: e.message }));
    }
  }

  async function rankedFrom(counts, countKey) {
    const employees = await getEmployeesByIds(counts.map(c => c.employee_id));
    const employeeById = Object.fromEntries(employees.map(e => [e.id, e]));
    return counts
      .map(c => ({ employee: employeeById[c.employee_id], count: Number(c[countKey]), raw: c }))
      .filter(r => r.employee);
  }

  // The page shell (period picker + section headers) renders once; only
  // the two ranked lists get replaced on every period change, so picking a
  // new period doesn't also blow away and re-wire the picker mid-use.
  function drawShell() {
    const html = `
      <div class="page-head">
        <div>
          <h2>Top Contributors</h2>
          <p>Everyone who's helped keep the database accurate — suggested changes submitted, plus vehicles managers added directly.</p>
        </div>
      </div>

      <div class="card" style="margin-bottom:22px">
        <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap">
          <div style="min-width:200px">
            <label class="form-label">Time period</label>
            <div id="periodSelect"></div>
          </div>
          <div id="customRangeRow" style="display:none;gap:14px;flex-wrap:wrap">
            <div><label class="form-label" for="customFrom">From</label><input type="date" id="customFrom" class="form-input"/></div>
            <div><label class="form-label" for="customTo">To</label><input type="date" id="customTo" class="form-input"/></div>
            <button type="button" class="btn btn-primary" id="customApplyBtn" style="align-self:flex-end">Apply</button>
          </div>
        </div>
      </div>

      <div id="leaderboardList"></div>

      ${_isManagerOrAbove ? `
        <div class="page-head" style="margin-top:32px">
          <div>
            <h2>Top Approvers</h2>
            <p>Review workload across managers, ranked by change requests approved — a check that it isn't all landing on one person.</p>
          </div>
        </div>
        <div id="approvalLeaderboardList"></div>
      ` : ""}
    `;
    setInner("body", html);
    window.lucide?.createIcons?.();

    _periodSelect = initCustomSelect(document.getElementById("periodSelect"), {
      options: LEADERBOARD_PERIODS.map(p => ({ key: p.key, label: p.label })),
      value: _periodKey,
      onChange: (key) => {
        _periodKey = key;
        document.getElementById("customRangeRow").style.display = key === "custom" ? "flex" : "none";
        if (key !== "custom") render();
      },
    });

    document.getElementById("customApplyBtn").addEventListener("click", () => {
      _customFrom = document.getElementById("customFrom").value;
      _customTo = document.getElementById("customTo").value;
      if (!_customFrom || !_customTo) { toast("error", "Pick both a from and to date"); return; }
      render();
    });
  }

  async function render() {
    const listEl = document.getElementById("leaderboardList");
    const approvalListEl = document.getElementById("approvalLeaderboardList");
    listEl.innerHTML = loadingState("Tallying contributions…");
    if (approvalListEl) approvalListEl.innerHTML = loadingState("Tallying approvals…");
    try {
      const { from, to } = getLeaderboardPeriodRange(_periodKey, _customFrom, _customTo);
      const ranked = await rankedFrom(await listContributorLeaderboard({ from, to }), "total_count");
      // Approval leaderboard is manager/admin-only — it's about balancing
      // review workload across managers (so it doesn't quietly all fall on
      // one person), not something a regular employee needs to see.
      const approvalRanked = _isManagerOrAbove
        ? await rankedFrom(await listApprovalLeaderboard({ from, to }), "approval_count")
        : null;
      draw(ranked, approvalRanked);
    } catch (e) {
      listEl.innerHTML = errorState({ title: "Couldn't load Top Contributors", message: e.message });
    }
  }

  function draw(ranked, approvalRanked) {
    renderRankedList("leaderboardList", ranked, {
      icon: "trophy",
      title: "Nothing to rank yet",
      message: "Once employees start suggesting changes, or a manager adds a vehicle directly, the top contributors will show up here.",
    });
    if (approvalRanked) {
      renderRankedList("approvalLeaderboardList", approvalRanked, {
        icon: "check-circle",
        title: "Nothing to rank yet",
        message: "Once managers start approving change requests, this will show who's reviewing them.",
      });
    }
    window.lucide?.createIcons?.();
  }

  function contributorBreakdown(raw) {
    if (raw.request_count === undefined) return ""; // approval rows have no split
    const parts = [];
    if (raw.request_count > 0) parts.push(`${raw.request_count} suggestion${raw.request_count === 1 ? "" : "s"}`);
    if (raw.direct_add_count > 0) parts.push(`${raw.direct_add_count} direct add${raw.direct_add_count === 1 ? "" : "s"}`);
    return parts.length ? `<div class="leaderboard-meta">${parts.join(" + ")}</div>` : "";
  }

  function renderRankedList(containerId, ranked, emptyMessage) {
    const list = document.getElementById(containerId);
    if (!ranked.length) {
      list.innerHTML = emptyState(emptyMessage);
      return;
    }

    list.innerHTML = ranked.map((r, i) => {
      const rank = i + 1;
      const rankClass = rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
      // Only the contributor list carries a request/direct-add breakdown —
      // the approval list's raw row has no such split.
      const breakdown = contributorBreakdown(r.raw);
      return `
        <div class="leaderboard-row">
          <div class="leaderboard-rank ${rankClass}">${rank}</div>
          <div class="avatar avatar-md">${esc(initials(r.employee.full_name))}</div>
          <div class="leaderboard-info">
            <div class="leaderboard-name">${esc(r.employee.full_name)}</div>
            <div class="leaderboard-meta">${esc(r.employee.job_title || "—")}</div>
            ${breakdown}
          </div>
          <div class="leaderboard-score">${r.count}</div>
        </div>`;
    }).join("");
  }
</script>
</body>
</html>
