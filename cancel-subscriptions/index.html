<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta http-equiv="refresh" content="4;url=/manage-plans">
  <title>Redirecting — SmartCore Technology</title>
  <link rel="icon" type="image/png" href="/SmartCore Official Logos/SC Icon - Black Background.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --text:#eaf0ff;
      --muted:rgba(234,240,255,.74);
      --muted2:rgba(234,240,255,.55);
      --stroke:rgba(255,255,255,.12);
      --stroke2:rgba(255,255,255,.08);
      --accent:rgba(120,170,255,.95);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
      color:var(--text);
      background:
        radial-gradient(ellipse 130% 60% at 50% 0%, rgba(70,120,255,.22) 0%, transparent 55%),
        linear-gradient(180deg,#020617 0%,#030a1f 40%,#040d26 100%);
      display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .card{
      max-width:480px;width:100%;text-align:center;
      background:rgba(255,255,255,.045);
      border:1px solid var(--stroke2);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-radius:22px;
      padding:48px 36px;
    }
    .icon{font-size:44px;margin-bottom:20px}
    h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
    p{font-size:15px;line-height:1.7;color:var(--muted);margin-bottom:0}
    .countdown{
      display:inline-block;margin:24px 0;
      font-size:13px;color:var(--muted2);
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.07);
      padding:6px 16px;border-radius:999px;
    }
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:13px 24px;border-radius:14px;
      border:1px solid rgba(120,170,255,.35);
      background:rgba(120,170,255,.16);
      font-size:14px;font-weight:600;
      color:var(--text);text-decoration:none;
      transition:background .14s;margin-top:8px;
    }
    .btn:hover{background:rgba(120,170,255,.26)}
    .back{display:block;margin-top:20px;font-size:13px;color:var(--muted2);text-decoration:none}
    .back:hover{color:var(--text)}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📦</div>
    <h1>This page has moved</h1>
    <p>Subscriptions are now managed at <strong>/manage-plans</strong>. We've updated all our links. You'll be redirected in a few seconds, or click below.</p>
    <div class="countdown" id="cd">Redirecting in 4...</div>
    <br>
    <a href="/manage-plans" class="btn">Go to Manage Plans →</a>
    <a href="/" class="back">← Back to SmartCore</a>
  </div>

  <script>
    let n = 4;
    const cd = document.getElementById('cd');
    const t = setInterval(()=>{
      n--;
      if(n <= 0){
        clearInterval(t);
        cd.textContent = 'Redirecting…';
        window.location.href = '/manage-plans';
      } else {
        cd.textContent = 'Redirecting in ' + n + '...';
      }
    }, 1000);
  </script>
</body>
</html>
